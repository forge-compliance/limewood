<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Staff House Electrical</title><link rel="stylesheet" href="assets/style.css?v=20260830-8"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js?v=20260830-8"></script><style>

:2px 0!important;font-size:9px!important;line-height:1.05!important;color:var(--g)}.node p{margin:0!important;color:var(--muted);font-size:7px!important;line-height:1.1!important}.pill{display:inline-block;margin-top:3px;padding:2px 5px;border-radius:999px;background:#e9efec;color:var(--g);font-size:7px;font-weight:800}.vline{height:7px;width:2px;background:var(--g);margin:0 auto}.sectionTitle{font-size:7px;font-weight:900;color:var(--g);line-height:1.1;margin:2px 0 3px;text-align:center}.dimmerGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.dimmerFeed{text-align:center}.feedLine{height:6px;width:2px;background:var(--g);margin:0 auto}.feedTag{font-size:7px;font-weight:900;color:var(--g);margin:1px 0 2px}.drawerBack{position:fixed!important;inset:0!important;background:#0d1c17a8!important;display:none!important;z-index:99999!important}.drawerBack.open{display:block!important}.drawer{position:absolute!important;right:0!important;top:0!important;height:100%!important;width:min(680px,96vw)!important;background:#fff!important;overflow:auto!important}.drawerHead{position:sticky;top:0;background:var(--g);color:#fff;padding:14px;display:flex;justify-content:space-between}.drawerHead small{color:#e0c98f;font-weight:800}.drawerHead h2{margin:3px 0 0;font-size:19px}.drawerHead button{border:0;background:#ffffff18;color:#fff;border-radius:9px;width:36px;height:36px;font-size:19px}.drawerBody{padding:12px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}.fact{border:1px solid #dfdcd5;background:#faf9f6;border-radius:8px;padding:8px}.fact small{display:block;color:var(--muted);font-size:8px}.fact b{font-size:11px}.circuits{width:100%;border-collapse:collapse;font-size:11px}.circuits th{text-align:left;background:#f1efe9;padding:7px}.circuits td{padding:7px;border-bottom:1px solid #ebe8e1}.empty{padding:16px;text-align:center;color:var(--muted)}@media(max-width:520px){.page{padding:5px}.branches{gap:4px}.node{padding:4px!important}.node h3{font-size:8px!important}.node p,.node .code,.pill,.sectionTitle,.feedTag{font-size:6.2px!important}.facts{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="brand"><div class="bolt">⚡</div><div><h1>Staff House Electrical</h1><small>Interactive distribution schematic</small><div class="build">Build SH-ELEC-0830-8</div></div></div><button id="backBtn">← Staff House</button></header>
<main class="page"><section class="intro"><h2>Electrical distribution</h2><p>Verified Staff House distribution. Tap a board or dimmer for its circuit schedule.</p></section><section class="canvas">
<div class="sourceWrap"><div class="sourceNode"><div class="code">STAFF HOUSE</div><h3>Mains incoming</h3><p>Incoming electrical distribution</p></div></div><div class="trunk"></div>
<div class="branches">
  <div class="branch">
    <div class="vline"></div>
    <button class="node circuitNode" data-code="SH-DB-007"><div class="code">SH-DB-007</div><h3>Switch DB SH</h3><p>Feeds DBSH</p><span class="pill">Verified</span></button>
    <div class="vline"></div>
    <button class="node circuitNode" data-code="SH-DB-002"><div class="code">SH-DB-002</div><h3>DBSH</h3><p>Office</p><span class="pill">18 circuits</span></button>
  </div>
  <div class="branch">
    <div class="vline"></div>
    <button class="node circuitNode" data-code="SH-DB-006"><div class="code">SH-DB-006</div><h3>Switch DB SHE</h3><p>Feeds DBSHE</p><span class="pill">Verified</span></button>
    <div class="vline"></div>
    <button class="node circuitNode" data-code="SH-DB-003"><div class="code">SH-DB-003</div><h3>DBSHE</h3><p>Office</p><span class="pill">24 circuits</span></button>
    <div class="sectionTitle">DBSHE outgoing</div>
    <div class="dimmerGrid">
      <div class="dimmerFeed"><div class="feedLine"></div><div class="feedTag">1L1</div><button class="node circuitNode" data-code="SH-DB-005"><div class="code">SH-DB-005</div><h3>DIMMER SH 1</h3><p>DBSHE 1L1</p><span class="pill">12 circuits</span></button></div>
      <div class="dimmerFeed"><div class="feedLine"></div><div class="feedTag">1L2</div><button class="node circuitNode" data-code="SH-DB-004"><div class="code">SH-DB-004</div><h3>DIMMER SH 2</h3><p>DBSHE 1L2</p><span class="pill">4 circuits</span></button></div>
    </div>
  </div>
  <div class="branch">
    <div class="vline"></div>
    <button class="node detailNode" data-code="SH-F-001"><div class="code">SH-F-001</div><h3>Switch MSCP Basement</h3><p>Office</p><span class="pill">Verified</span></button>
    <div class="vline"></div>
    <button class="node detailNode" data-code="SH-008"><div class="code">SH-008</div><h3>Staff House MCP</h3><p>Staff House Plant Room</p><span class="pill">Verified</span></button>
  </div>
</div></section></main>
<div class="drawerBack" id="drawerBack"><aside class="drawer"><div class="drawerHead"><div><small id="dCode"></small><h2 id="dName"></h2></div><button id="drawerClose">×</button></div><div class="drawerBody"><div class="facts" id="facts"></div><h3 id="scheduleTitle">⚡ Circuit schedule</h3><div id="circuitWrap" class="empty"></div></div></aside></div>
<script>(function(){'use strict';const $=id=>document.getElementById(id),cfg=window.LIMEWOOD_CONFIG||{};let client=null;function db(){if(client)return client;if(window.supabase&&cfg.supabaseUrl&&cfg.supabasePublishableKey)client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);return client}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(code,name){$('dCode').textContent=code;$('dName').textContent=name||code;$('facts').innerHTML='';$('drawerBack').style.display='block';$('drawerBack').classList.add('open')}async function circuits(code,name){show(code,name);$('scheduleTitle').textContent='⚡ Circuit schedule';$('circuitWrap').className='empty';$('circuitWrap').textContent='Loading circuit schedule…';const c=db();if(!c){$('circuitWrap').textContent='Database connection unavailable.';return}const r=await c.from('electrical_circuits').select('circuit_number,circuit_description,phase,status').eq('board_asset_code',code);if(r.error){$('circuitWrap').textContent='Could not load circuit schedule.';return}const rows=(r.data||[]).sort((a,b)=>String(a.circuit_number).localeCompare(String(b.circuit_number),undefined,{numeric:true}));if(!rows.length){$('circuitWrap').textContent='No outgoing circuit schedule recorded.';return}$('circuitWrap').className='';$('circuitWrap').innerHTML=`<div style="overflow:auto"><table class="circuits"><thead><tr><th>Circuit</th><th>Description</th><th>Phase</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.circuit_number)}</b></td><td>${esc(x.circuit_description)}</td><td>${esc(x.phase||'—')}</td><td>${esc(x.status||'—')}</td></tr>`).join('')}</tbody></table></div>`}function detail(code,name){show(code,name);$('scheduleTitle').textContent='⚡ Verified relationship';$('circuitWrap').className='empty';$('circuitWrap').innerHTML=code==='SH-F-001'?'<b>Switch MSCP Basement</b><br><br>Located in the Office and verified as feeding the Staff House MCP.':'<b>Staff House MCP</b><br><br>Located in the Staff House Plant Room and verified as fed from Switch MSCP Basement in the Office.'}document.querySelectorAll('.circuitNode').forEach(b=>b.addEventListener('click',()=>circuits(b.dataset.code,b.querySelector('h3').textContent)));document.querySelectorAll('.detailNode').forEach(b=>b.addEventListener('click',()=>detail(b.dataset.code,b.querySelector('h3').textContent)));function close(){$('drawerBack').classList.remove('open');$('drawerBack').style.display='none'}$('drawerClose').addEventListener('click',close);$('drawerBack').addEventListener('click',e=>{if(e.target===$('drawerBack'))close()});$('backBtn').addEventListener('click',()=>location.href='/');})();</script></body></html>
