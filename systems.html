<style>body{margin:0;background:#f4f0e7;color:#1f2925;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.sysTop{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#17372c;color:#fff}.sysTop .mark{width:40px;height:40px;display:grid;place-items:center;background:#d6b36a;color:#17372c;border-radius:11px;font-weight:900}.sysTop div:nth-child(2){flex:1}.sysTop b{display:block}.sysTop small{color:#cbd7d1}.sysTop button{background:transparent;color:#fff;border:1px solid #ffffff40;border-radius:10px;padding:9px 12px}.sysShell{width:min(1200px,calc(100% - 24px));margin:auto;padding:20px 0 48px}.sysHero{padding:24px;border-radius:20px;background:linear-gradient(135deg,#17372c,#285746);color:#fff}.sysHero span{color:#e7cc94;font-size:11px;font-weight:900;letter-spacing:.15em}.sysHero h1{margin:7px 0 8px;font-family:Georgia,serif;font-size:clamp(30px,5vw,48px)}.sysHero p{margin:0;color:#d7e1dc;line-height:1.55}.sysTools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.sysTools input{flex:1;min-width:220px;padding:12px;border:1px solid #ccd3ce;border-radius:11px}.sysTools button,.sysCard a{padding:11px 14px;border:0;border-radius:11px;background:#17372c;color:#fff;font-weight:800;text-decoration:none}.sysTools.spaFinder{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:#fff;border:1px solid #d8ddd7;border-radius:16px;padding:12px;margin:16px 0 8px;box-shadow:0 8px 22px rgba(23,55,44,.06)}.sysTools.spaFinder input{border:0;background:#f7f6f1;min-height:48px;font-size:15px;padding:13px 14px;outline:none}.spaSearchMeta{display:none;color:#6b746f;font-size:12px;margin:0 2px 14px}.spaSearchMeta.show{display:block}.sysGrid.spaResults{grid-template-columns:1fr;gap:10px}.spaResult{display:grid;grid-template-columns:52px minmax(0,1fr) 42px;gap:13px;align-items:center;background:#fff;border:1px solid #d8ddd7;border-radius:15px;padding:14px;text-decoration:none;color:inherit;box-shadow:0 4px 14px rgba(23,55,44,.04)}.spaResult:hover{border-color:#bba66b;box-shadow:0 7px 20px rgba(23,55,44,.08)}.spaResultIcon{width:52px;height:52px;border-radius:13px;background:#edf3ef;display:grid;place-items:center;font-size:24px}.spaResultMain{min-width:0}.spaResultTitle{font-size:17px;font-weight:900;color:#17372c}.spaResultLocation{font-size:11px;color:#6b746f;margin-top:3px}.spaResultReason{font-size:11px;font-weight:800;color:#8b6a20;margin-top:7px}.spaResultMeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.spaPill{display:inline-block;border-radius:999px;padding:5px 8px;background:#edf1ef;color:#53625d;font-size:9px;font-weight:800}.spaResultCode{font-size:9px;color:#98a09b;margin-top:7px}.spaResultGo{width:38px;height:38px;border-radius:11px;background:#edf3ef;color:#17372c;display:grid;place-items:center;font-size:25px;font-weight:900}.locationGroupLabel{font-size:11px;font-weight:900;letter-spacing:.12em;color:#8a6c25;margin:10px 2px 2px}.locationResult{display:grid;grid-template-columns:52px minmax(0,1fr) 42px;gap:13px;align-items:center;background:#f7fbf8;border:1px solid #bfd3c6;border-radius:15px;padding:14px;text-decoration:none;color:inherit;box-shadow:0 4px 14px rgba(23,55,44,.04)}.locationResult:hover{border-color:#9ebcab}.locationResult .spaResultIcon{background:#dfece4}.locationResult .spaResultReason{color:#35614e}@media(max-width:600px){.sysTools.spaFinder{grid-template-columns:1fr}.sysTools.spaFinder button{width:100%}.spaResult{grid-template-columns:44px minmax(0,1fr) 34px;padding:11px;gap:9px}.spaResultIcon{width:44px;height:44px}.spaResultTitle{font-size:15px}}.sysStats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.sysStats article,.sysCard{padding:16px;background:#fff;border:1px solid #d8ddd7;border-radius:14px}.sysStats b{display:block;font-size:26px;color:#17372c}.sysStats span,.sysCard p{font-size:12px;color:#66716c}.sysGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sysCard h3{margin:6px 0 8px}.sysCard .badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8efe9;color:#285746;font-size:11px;font-weight:900}.sysCard a{display:inline-block;margin-top:10px}.empty{grid-column:1/-1;padding:32px;background:#fff;border:1px dashed #b8c1bc;border-radius:15px;text-align:center}.locationActions{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.locationActions a{display:block;padding:22px;background:#fff;border:1px solid #d8ddd7;border-radius:15px;text-decoration:none;color:#1f2925}.locationActions .primaryLink{background:#17372c;color:#fff}@media(max-width:800px){.sysGrid,.sysStats{grid-template-columns:1fr 1fr}.locationActions{grid-template-columns:1fr}}@media(max-width:600px){.sysGrid{grid-template-columns:1fr}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js"></script></head><body>
<header class="sysTop"><div class="mark">LW</div><div><b>Limewood Engineering</b><small>Estate technical control centre</small></div><button onclick="location.href='/'">Dashboard</button></header><main class="sysShell"><section class="sysHero"><span>ENGINEERING SYSTEM VIEW</span><h1 id="title">Loading…</h1><p id="subtitle">Connecting to the estate database.</p></section><div class="sysTools" id="tools"><input id="search" placeholder="Search this view"><button id="refresh">Refresh</button></div><div id="searchMeta" class="spaSearchMeta"></div><section class="sysStats"><article><b id="count">0</b><span>Matching records</span></article><article><b id="photoCount">0</b><span>Photos</span></article><article><b id="status">…</b><span>Database</span></article></section><section id="content" class="sysGrid"></section></main>
<script>(()=>{'use strict';const cfg=window.LIMEWOOD_CONFIG||{},client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),qs=new URLSearchParams(location.search),view=qs.get('view')||'Engineering Systems',kind=qs.get('kind')||'system',room=qs.get('room')||'',showList=qs.get('list')==='1',initialQuery=qs.get('q')||'',$=id=>document.getElementById(id);$('title').textContent=view;const TERMS={'Water Systems':['water','cws','hws','dhw','tmv','booster','water treatment','cold water','hot water'],'Heating Systems':['heating','boiler','lthw','calorifier','heat exchanger','pressurisation','radiator'],'Chilled Water Systems':['chilled','chw','chiller','cooling'],'Lighting':['lighting','light','dimmer','emergency lighting'],'Fire & Life Safety':['fire','alarm','sprinkler','smoke','emergency lighting','life safety'],'Pool & Spa Water Treatment':['pool','spa','dosing','chlorine','bromine','ph','water treatment','filter','backwash']};let assets=[],photos=[],buildings=[],plantRooms=[],areas=[],subAreas=[];function text(a){return[a.asset_code,a.asset_name,a.category,a.system_duty,a.manufacturer,a.model,a.serial_number,a.exact_location,a.notes].join(' ').toLowerCase()}function locationText(a){const b=buildings.find(x=>x.id===a.building_id)?.name||'',p=plantRooms.find(x=>x.id===a.plant_room_id)?.name||'';return[b,p,a.exact_location,a.asset_name,a.notes].join(' ').toLowerCase()}function poolSpaMatch(a){const t=text(a),cat=String(a.category||'').toLowerCase(),duty=String(a.system_duty||'').toLowerCase(),name=String(a.asset_name||'').toLowerCase();const strong=['pool','hydro','chlorine','bromine','dosing','backwash','water treatment','pool filter','spa filter'];if(strong.some(x=>[cat,duty,name].join(' ').includes(x)))return true;const spaPlant=locationText(a).includes('spa plant');const waterEquipment=['filter','pump','dosing','chemical','water','tank','uv','heat exchanger'].some(x=>[cat,duty,name].join(' ').includes(x));return spaPlant&&waterEquipment}function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9/]+/g,' ').replace(/\s+/g,' ').trim()}function buildingName(a){const direct=buildings.find(x=>String(x.id)===String(a.building_id))?.name||'';if(direct)return direct;const pr=plantRooms.find(x=>String(x.id)===String(a.plant_room_id));return buildings.find(x=>String(x.id)===String(pr?.building_id))?.name||''}const locationMode=kind==='location';function locationAsset(a){return norm(buildingName(a))===norm(view)}function richText(a){const b=buildingName(a),p=plantRooms.find(x=>String(x.id)===String(a.plant_room_id))?.name||'';return norm([a.asset_code,a.asset_name,a.category,a.system_duty,a.manufacturer,a.model,a.serial_number,a.asset_tag,a.operational_status,a.condition,a.criticality,a.exact_location,a.electrical_isolation,a.mechanical_isolation,a.emergency_isolation,a.ppm_frequency,a.notes,b,p,areaName(a),subAreaName(a)].join(' '))}const LOCATION_ALIASES={ac:['ac','a/c','air conditioning','air con','conditioning'],aircon:['ac','a/c','air conditioning','air con'],boiler:['boiler','heating'],pump:['pump','circulation pump','booster pump'],filter:['filter','filtration'],pool:['pool','lap pool','hydro pool'],hydro:['hydro','hydro pool'],lighting:['lighting','light','lights'],light:['lighting','light','lights'],lights:['lighting','light','lights'],fan:['fan','extract fan','supply fan'],water:['water','cws','hws','dhw','hot water','cold water'],heating:['heating','boiler','lthw','underfloor heating','ufh'],treatment:['treatment','treatment room'],socket:['socket','sockets','skts','ring main','power'],sockets:['socket','sockets','skts','ring main','power'],door:['door','doors'],fridge:['fridge','refrigerator','refrigeration'],freezer:['freezer','refrigeration'],extract:['extract','extract fan'],supply:['supply','supply fan']};function locationQueryMatch(a,raw){const q=norm(raw);if(!q)return false;const hay=richText(a);const room=q.match(/\b(?:room|bedroom|treatment room)\s*0*(\d{1,3})\b/);if(room){const n=String(Number(room[1]));if(!new RegExp('\\b(?:room|bedroom|treatment room)\\s*0*'+n+'\\b').test(hay))return false}let residual=q;if(room)residual=residual.replace(room[0],' ').replace(/\s+/g,' ').trim();const buildingTerms=norm(view).split(' ').filter(Boolean);const terms=residual.split(' ').filter(Boolean).filter(x=>!['the','and','for'].includes(x)&&!buildingTerms.includes(x));return terms.every(term=>{const aliases=LOCATION_ALIASES[term]||[term];return aliases.some(x=>hay.includes(norm(x)))})}function areaName(a){return areas.find(x=>String(x.id)===String(a.area_id))?.name||''}function subAreaName(a){return subAreas.find(x=>String(x.id)===String(a.sub_area_id))?.name||''}function locationRecords(){if(!locationMode)return[];const building=buildings.find(b=>norm(b.name)===norm(view));const bid=building?.id;const rows=[];const seen=new Set();const add=(type,name,id='')=>{const n=String(name||'').trim();if(!n)return;const key=type+'|'+norm(n);if(seen.has(key))return;seen.add(key);const count=assets.filter(a=>locationAsset(a)&&[norm(areaName(a)),norm(subAreaName(a)),norm(plantRooms.find(p=>String(p.id)===String(a.plant_room_id))?.name),norm(a.exact_location)].includes(norm(n))).length;rows.push({type,name:n,id,count})};areas.filter(x=>!bid||String(x.building_id)===String(bid)).forEach(x=>add('Area',x.name,x.id));subAreas.filter(x=>areas.some(a=>String(a.id)===String(x.area_id)&&(!bid||String(a.building_id)===String(bid)))).forEach(x=>add('Sub-area',x.name,x.id));plantRooms.filter(x=>!bid||String(x.building_id)===String(bid)).forEach(x=>add('Plant room',x.name,x.id));assets.filter(locationAsset).forEach(a=>{if(a.exact_location)add('Room / location',a.exact_location)});return rows.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}))}function matchingLocations(raw){const q=norm(raw);if(!q)return[];const buildingTerms=norm(view).split(' ').filter(Boolean);const terms=q.split(' ').filter(Boolean).filter(x=>!['the','and','for'].includes(x)&&!buildingTerms.includes(x));return locationRecords().filter(r=>{const hay=norm([r.name,r.type].join(' '));return terms.every(term=>(LOCATION_ALIASES[term]||[term]).some(x=>hay.includes(norm(x))))})}function matching(){let list=assets.slice();if(locationMode)list=list.filter(locationAsset);else if(view==='Pool & Spa Water Treatment')list=list.filter(poolSpaMatch);else if(TERMS[view])list=list.filter(a=>TERMS[view].some(t=>text(a).includes(t)));if(room)list=list.filter(a=>locationText(a).includes(room.toLowerCase()));const q=$('search').value.trim();if(locationMode)return q?list.filter(a=>locationQueryMatch(a,q)):[];if(q)list=list.filter(a=>text(a).includes(q.toLowerCase())||locationText(a).includes(q.toLowerCase()));return list}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[c]))}function card(a){const b=buildingName(a),p=plantRooms.find(x=>String(x.id)===String(a.plant_room_id))?.name||'',pc=photos.filter(x=>x.asset_id===a.id).length;return`<article class="sysCard"><span class="badge">${esc(a.asset_code||'Asset')}</span><h3>${esc(a.asset_name||'Unnamed asset')}</h3><p>${esc([b,p,a.exact_location].filter(Boolean).join(' · ')||'Location not set')}</p><p>${esc([a.manufacturer,a.model].filter(Boolean).join(' ')||a.category||'')}</p><p>${pc} photo${pc===1?'':'s'}</p><a href="/?asset=${encodeURIComponent(a.asset_code||'')}">Open asset</a></article>`}function locationCard(a){const p=plantRooms.find(x=>String(x.id)===String(a.plant_room_id))?.name||'',pc=photos.filter(x=>x.asset_id===a.id).length;const loc=[p,a.exact_location].filter(Boolean).join(' · ')||view;const detail=[a.manufacturer,a.model].filter(Boolean).join(' ')||a.category||'Asset';const hay=[a.asset_name,a.category,a.system_duty].join(' ');const icon=/air conditioning|\bac\b|a\/c/i.test(hay)?'❄️':/pump/i.test(hay)?'⚙️':/filter|water/i.test(hay)?'💧':/boiler|heating/i.test(hay)?'🔥':/light|dimmer/i.test(hay)?'💡':'▣';return`<a class="spaResult" href="/?asset=${encodeURIComponent(a.asset_code||'')}"><div class="spaResultIcon">${icon}</div><div class="spaResultMain"><div class="spaResultTitle">${esc(a.asset_name||'Unnamed asset')}</div><div class="spaResultLocation">${esc(loc)}</div><div class="spaResultReason">${esc(view)} building match</div><div class="spaResultMeta"><span class="spaPill">${esc(a.category||'Asset')}</span><span class="spaPill">${esc(detail)}</span><span class="spaPill">📷 ${pc}</span></div><div class="spaResultCode">${esc(a.asset_code||'')}</div></div><div class="spaResultGo">›</div></a>`}function locationCard(r){return`<a class="locationResult" href="#" data-location-search="${esc(r.name)}"><div class="spaResultIcon">📍</div><div class="spaResultMain"><div class="spaResultTitle">${esc(r.name)}</div><div class="spaResultLocation">${esc(view)} · ${esc(r.type)}</div><div class="spaResultReason">${r.count} linked asset${r.count===1?'':'s'}</div></div><div class="spaResultGo">›</div></a>`}function renderAssets(){const list=matching();if(locationMode){const total=assets.filter(locationAsset),raw=$('search').value.trim(),locs=matchingLocations(raw);$('tools').classList.add('spaFinder');$('search').placeholder=`Search ${view}... e.g. Treatment Room 2, boiler, lighting, pump`;$('subtitle').textContent=`Search rooms, areas and assets within the ${view} building. Results stay scoped to ${view}.`;$('content').classList.add('spaResults');$('count').textContent=raw?(locs.length+list.length):total.length;$('photoCount').textContent=photos.filter(p=>total.some(a=>a.id===p.asset_id)).length;$('searchMeta').textContent=raw?(`${locs.length} location${locs.length===1?'':'s'} · ${list.length} asset${list.length===1?'':'s'}`):'Start typing to search '+total.length+' '+view+' assets and locations';$('searchMeta').classList.add('show');if(!raw){$('content').innerHTML='';return}const parts=[];if(locs.length){parts.push('<div class="locationGroupLabel">ROOMS & LOCATIONS</div>');parts.push(...locs.map(locationCard))}if(list.length){parts.push('<div class="locationGroupLabel">ASSETS</div>');parts.push(...list.map(locationCard))}$('content').innerHTML=parts.length?parts.join(''):`<div class="empty">No matching rooms or assets in the ${esc(view)} building.</div>`;document.querySelectorAll('[data-location-search]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();$('search').value=el.dataset.locationSearch||'';renderAssets()}));return}$('subtitle').textContent=`Live asset register filtered for ${view}.`;$('count').textContent=list.length;$('photoCount').textContent=photos.filter(p=>list.some(a=>a.id===p.asset_id)).length;$('content').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No matching assets yet.</div>'}async function load(){try{const{data:{session}}=await client.auth.getSession();if(!session){location.href='/?return='+encodeURIComponent(location.href);return}const[a,b,p,ph,ar,sa]=await Promise.all([client.from('assets').select('*').order('asset_code'),client.from('buildings').select('*').order('name'),client.from('plant_rooms').select('*').order('name'),client.from('asset_photos').select('*').order('created_at',{ascending:false}),client.from('location_areas').select('*').order('name'),client.from('location_sub_areas').select('*').order('name')]);const err=a.error||b.error||p.error||ph.error||ar.error||sa.error;if(err)throw err;assets=a.data||[];buildings=b.data||[];plantRooms=p.data||[];photos=ph.data||[];areas=ar.data||[];subAreas=sa.data||[];$('status').textContent='Live';if(initialQuery&&!$('search').value)$('search').value=initialQuery;renderAssets()}catch(e){$('status').textContent='Error';$('content').innerHTML=`<div class="empty">Could not load this view: ${esc(e.message||e)}</div>`}}$('search').addEventListener('input',renderAssets);$('refresh').onclick=load;load()})();</script></body></html>
