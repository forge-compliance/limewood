<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Electrical Map</title>
<link rel="stylesheet" href="/assets/style.css?v=607">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/config.js?v=20260901-auth2"></script>
<script defer src="/assets/site-sidebar.js"></script>
<style>
:root{--g:#17372c;--cream:#f5f1e8;--ink:#24332e;--muted:#72807b;--line:#dedbd3;--card:#fff;--gold:#c6a96a}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.page{max-width:980px;margin:auto;padding:14px}.hero{background:#17372c;color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}.hero small{display:block;color:#d7c28d;font-size:9px;font-weight:900;letter-spacing:.09em}.hero h1{margin:6px 0 0;font-size:25px;line-height:1.1}.heroActions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.heroActions a{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 12px;border-radius:10px;text-decoration:none;font-size:10px;font-weight:900;background:rgba(255,255,255,.1);color:#fff}.heroActions a.primary{background:var(--gold);color:var(--g)}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:4px 2px 10px}.sectionHead h2{margin:0;color:var(--g);font-size:18px}.sectionHead span{color:var(--muted);font-size:9px}.locationGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.locationBtn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 14px;min-height:78px;text-align:left;box-shadow:0 6px 18px rgba(23,55,44,.06);cursor:pointer}.locationBtn b{display:block;color:var(--g);font-size:15px;line-height:1.15}.locationBtn span{display:block;margin-top:5px;color:var(--muted);font-size:9px}.locationBtn:active{transform:scale(.99)}.loading{padding:20px;text-align:center;color:var(--muted);font-size:10px}@media(max-width:520px){.page{padding:10px}.hero{padding:16px;border-radius:15px}.hero h1{font-size:22px}.locationGrid{grid-template-columns:1fr}.locationBtn{min-height:72px;padding:15px}}
</style>
</head>
<body>
<main class="page">
<section class="hero"><small>ELECTRICAL DISTRIBUTION</small><h1>Electrical Map</h1><div class="heroActions"><a class="primary" href="/electrical-distribution.html">← Electrical Distribution</a><a href="/">Dashboard</a></div></section>
<div class="sectionHead"><h2>Choose a location</h2><span>Open live electrical map</span></div>
<div id="locations" class="locationGrid"><div class="loading">Loading locations…</div></div>
</main>
<script>
(async()=>{const cfg=window.LIMEWOOD_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const box=document.getElementById('locations');const {data:sessionData}=await sb.auth.getSession();if(!sessionData.session){location.href='/';return}const [br,pr,er]=await Promise.all([sb.from('buildings').select('id,name').order('name'),sb.from('plant_rooms').select('id,name,building_id'),sb.from('electrical_assets').select('asset_code,plant_room')]);if(br.error||pr.error){box.innerHTML='<div class="loading">Could not load locations.</div>';return}const buildings=br.data||[],rooms=pr.data||[],electrical=er.error?[]:(er.data||[]);const countByBuilding=new Map();for(const b of buildings){const names=new Set(rooms.filter(r=>String(r.building_id)===String(b.id)).map(r=>r.name));countByBuilding.set(b.id,electrical.filter(a=>names.has(a.plant_room)).length)}box.innerHTML=buildings.map(b=>`<button class="locationBtn" data-building="${String(b.name).replace(/"/g,'&quot;')}"><b>${b.name}</b><span>${countByBuilding.get(b.id)||0} electrical assets</span></button>`).join('');box.addEventListener('click',e=>{const btn=e.target.closest('[data-building]');if(!btn)return;const name=btn.dataset.building;if(name==='Staff House'){location.href='/staff-house-electrical.html';return}if(name==='Barn'){location.href='/barn-electrical.html';return}location.href='/electrical-schematic-map.html?building='+encodeURIComponent(name)});})();
</script>
</body>
</html>
