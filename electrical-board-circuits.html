<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Electrical Circuit Schedule</title><link rel="stylesheet" href="/assets/style.css?v=607"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js?v=20260901-auth2"></script><style>:root{--g:#173d33;--gold:#c6a96a;--cream:#f4f0e8;--muted:#6f7b76}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1f2b27;font-family:Arial,Helvetica,sans-serif}.top{background:var(--g);color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:17px;margin:0}.top small{opacity:.7}.top button{border:1px solid #ffffff35;background:#ffffff12;color:#fff;padding:9px 10px;border-radius:8px;font-weight:700}.page{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #d9d6cf;border-radius:14px;overflow:hidden}.head{padding:14px;border-bottom:1px solid #e7e2d8}.code{font-size:10px;font-weight:800;color:#8a7650}.head h2{margin:4px 0 2px;color:var(--g);font-size:22px}.head p{margin:0;color:var(--muted);font-size:12px}.status{margin:14px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;background:#f1efe9;padding:9px}td{padding:9px;border-bottom:1px solid #ebe8e1;vertical-align:top}.verified{font-weight:800;color:var(--g)}@media(max-width:560px){.page{padding:7px}.tableWrap{overflow:auto}table{min-width:560px}}</style></head><body><header class="top"><div><h1>Electrical Circuit Schedule</h1><small>Live verified register</small></div><button id="backBtn">← Schematic</button></header><main class="page"><section class="card"><div class="head"><div class="code" id="code">BOARD</div><h2 id="name">Loading…</h2><p id="meta">Loading board details…</p></div><div id="content" class="status">Loading circuit schedule…</div></section></main><script>(async function(){'use strict';const p=new URLSearchParams(location.search),code=(p.get('board')||'').trim();document.getElementById('backBtn').onclick=()=>history.length>1?history.back():location.href='/electrical-map.html';document.getElementById('code').textContent=code||'BOARD';if(!code||code.length>80||/[<>"']/.test(code)){document.getElementById('name').textContent='Invalid board';document.getElementById('content').textContent='No valid board code was supplied.';return}const cfg=window.LIMEWOOD_CONFIG||{};if(!window.supabase||!cfg.supabaseUrl||!cfg.supabasePublishableKey){document.getElementById('name').textContent=code;document.getElementById('content').textContent='Database connection unavailable.';return}const c=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const a=await c.from('electrical_assets').select('asset_code,asset_name,plant_room,status,distribution_board,upstream_supply').eq('asset_code',code).maybeSingle();document.getElementById('name').textContent=a.data?.asset_name||code;document.getElementById('meta').textContent=[a.data?.plant_room,a.data?.upstream_supply?`Supply: ${a.data.upstream_supply}`:null,a.data?.status].filter(Boolean).join(' · ')||'Electrical asset';const r=await c.from('electrical_circuits').select('circuit_number,circuit_description,phase,protective_device,device_rating,status').eq('board_asset_code',code);if(r.error){document.getElementById('content').textContent='Could not load this circuit schedule.';return}const rows=(r.data||[]).sort((x,y)=>String(x.circuit_number||'').localeCompare(String(y.circuit_number||''),undefined,{numeric:true}));if(!rows.length){document.getElementById('content').textContent='No outgoing circuit schedule recorded for this asset.';return}document.getElementById('content').className='tableWrap';document.getElementById('content').innerHTML=`<table><thead><tr><th>Circuit</th><th>Description</th><th>Phase</th><th>Device</th><th>Rating</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.circuit_number)}</b></td><td>${esc(x.circuit_description||'—')}</td><td>${esc(x.phase||'—')}</td><td>${esc(x.protective_device||'—')}</td><td>${esc(x.device_rating||'—')}</td><td class="${String(x.status).toLowerCase()==='verified'?'verified':''}">${esc(x.status||'—')}</td></tr>`).join('')}</tbody></table>`})();</script></body></html>
