:root{--g:#173d33;--cream:#f4f0e8;--muted:#6f7b76}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1f2b27;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:8px}.bolt{width:34px;height:34px;border-radius:9px;background:#54230a;color:#ffd46a;display:grid;place-items:center;font-size:19px}.brand h1{font:700 20px Georgia,serif;margin:0}.brand small{opacity:.72;font-size:9px}.top a{border:1px solid #ffffff35;background:#ffffff12;color:#fff;padding:8px;border-radius:8px;font-weight:700;text-decoration:none}.page{max-width:900px;margin:auto;padding:7px}.intro h2{margin:0;color:var(--g);font-size:18px}.intro p{margin:2px 0 7px;color:var(--muted);font-size:10px}.search{margin:0 0 8px}.search input{width:100%;height:38px;border:1px solid #c9c4ba;border-radius:9px;background:#fff;padding:0 11px;font-size:11px}.canvas{background:#272727;border:1px solid #77736d;border-radius:13px;padding:7px}.sourceWrap{text-align:center}.sourceNode{display:inline-block;width:min(500px,82%);background:#052417;color:#fff;border:2px solid #296b52;border-radius:12px;padding:7px}.sourceNode .code{font-size:6.5px;font-weight:800;color:#c7ab6d}.sourceNode h3{margin:2px 0;font-size:12px}.sourceNode p{margin:0;font-size:6.5px;color:#d8e6df}.trunk{height:9px;width:2px;background:#b8ded0;margin:0 auto}.bus{height:2px;background:#b8ded0;margin:0 8%}.branchGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:0 2px}.branchCell{position:relative;min-width:0;padding-top:8px}.branchCell:before{content:"";position:absolute;top:0;left:50%;width:2px;height:8px;background:#b8ded0}.groupBtn,.node{display:block;width:100%;min-width:0;border-radius:7px;padding:4px;text-align:left;text-decoration:none;color:#fff;cursor:pointer}.groupBtn{min-height:57px;background:#12382c;border:1.2px solid #4c7a6a}.groupBtn .code,.node .code{font-size:5.8px;font-weight:800;color:#c8b37d}.groupBtn h3,.node h3{margin:2px 0;font-size:7.6px;color:#d7f2e7;line-height:1.05}.groupBtn p{margin:0;color:#aebdb6;font-size:5.7px;line-height:1.1}.pill{display:inline-block;margin-top:3px;padding:1px 4px;border-radius:999px;background:#061c14;color:#d5eee4;font-size:5.7px;font-weight:800}.groupPanel{display:none;margin-top:8px;padding-top:8px;border-top:1px solid #5e625f}.groupPanel.open{display:block}.groupTitle{color:#d7f2e7;font-size:10px;font-weight:900;margin:0 0 6px}.itemGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.assetBlock{min-width:0}.node{background:#44433f;border:1px solid #696762}.node h3{font-size:8px}.node p{margin:0;color:#d0ccc6;font-size:6.2px}.circuits{margin:3px 0 0 5px;padding-left:7px;border-left:2px solid #6fa793}.circuit{display:block;text-decoration:none;background:#1f302a;border:1px solid #426456;border-radius:6px;padding:3px 4px;margin:0 0 3px;color:#dcece5}.circuit b{display:block;font-size:6.4px;color:#d5b971}.circuit span{display:block;font-size:6px;line-height:1.15}.allCircuits{font-size:6px;color:#bfe1d3;text-decoration:none;font-weight:800}.hidden{display:none!important}.status{padding:12px;color:#d0ccc6;font-size:10px;text-align:center}.noMatches{display:none;color:#d0ccc6;text-align:center;padding:16px;font-size:9px}@media(min-width:700px){.branchGrid{grid-template-columns:repeat(5,minmax(0,1fr))}.itemGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:390px){.page{padding:5px}.brand h1{font-size:18px}.branchGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.groupBtn{padding:3px;min-height:54px}.groupBtn h3{font-size:7px}.groupBtn p{font-size:5.2px}}
</style></head><body><header class="top"><div class="brand"><div class="bolt">⚡</div><div><h1 id="pageTitle">Electrical</h1><small>Interactive distribution schematic</small></div></div><a href="/electrical-map.html">← Locations</a></header><main class="page"><section class="intro"><h2>Electrical distribution</h2><p>Each category branches from the main incomer. Circuits stay attached to the board or unit that actually supplies them.</p></section><div class="search"><input id="mapSearch" type="search" placeholder="Search MH19, Kitchen, Room 15, circuit…" autocomplete="off"></div><div id="status" class="status">Loading electrical distribution…</div><section id="canvas" class="canvas" hidden></section></main><script>
(async()=>{'use strict';const requested=new URLSearchParams(location.search).get('building')||'Main House';if(requested==='Barn'){location.replace('/barn-electrical.html?v=20260901-2');return}if(requested==='Crescent'){location.replace('/crescent-electrical.html?v=20260901-1');return}const cfg=window.LIMEWOOD_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const natural=(a,b)=>String(a.asset_name||a.asset_code||'').localeCompare(String(b.asset_name||b.asset_code||''),undefined,{numeric:true,sensitivity:'base'});const circuitNatural=(a,b)=>String(a.circuit_number||'').localeCompare(String(b.circuit_number||''),undefined,{numeric:true,sensitivity:'base'});const status=document.getElementById('status'),canvas=document.getElementById('canvas');const [br,pr]=await Promise.all([sb.from('buildings').select('id,name').order('name'),sb.from('plant_rooms').select('id,name,building_id')]);if(br.error||pr.error){status.textContent='Could not load building directory.';return}const building=(br.data||[]).find(b=>b.name===requested)||(br.data||[])[0];if(!building){status.textContent='No building found.';return}document.getElementById('pageTitle').textContent=building.name+' Electrical';const roomNames=(pr.data||[]).filter(r=>String(r.building_id)===String(building.id)).map(r=>r.name);const [ar,cr]=await Promise.all([sb.from('electrical_assets').select('asset_code,asset_name,plant_room,category,system_duty,distribution_board,upstream_supply,circuit_reference,verification_status').in('plant_room',roomNames).order('asset_code'),sb.from('electrical_circuits').select('board_asset_code,circuit_number,circuit_description,destination,phase,protective_device,device_rating,notes').order('board_asset_code').order('circuit_number')]);if(ar.error){status.textContent='Could not load electrical assets.';return}const all=ar.data||[],circuits=cr.error?[]:(cr.data||[]);const structure=a=>/incoming|incomer|intake|meter|main switch|switchboard|feeder|mcp|motor control|control panel|distribution board|consumer unit|\bcu\b|\bdb\b|dimmer|lighting control panel|ilight|unit mh/i.test((a.category||'')+' '+(a.asset_name||'')+' '+(a.system_duty||''));const assets=all.filter(structure);const circuitsFor=a=>{const keys=[a.asset_code,a.asset_name].filter(Boolean).map(norm);return circuits.filter(c=>keys.includes(norm(c.board_asset_code))).sort(circuitNatural)};const clickable=a=>/switchboard|mcp|control panel|distribution board|consumer unit|\bcu\b|\bdb\b|panel|dimmer|ilight/i.test((a.category||'')+' '+(a.asset_name||''));const incoming=assets.find(a=>/incoming|incomer|intake|meter/.test(norm((a.category||'')+' '+(a.asset_name||''))))||null;const txt=a=>norm((a.asset_name||'')+' '+(a.category||'')+' '+(a.system_duty||'')+' '+(a.asset_code||''));const isConsumer=a=>/consumer unit|\bcu\b/.test(txt(a));const isDimmerRack=a=>/dimmer rack|lighting rack|dimmer board/.test(txt(a));const isILight=a=>/\bilight\b/.test(txt(a))&&!isDimmerRack(a);const isDB=a=>/distribution board|\bdb\b/.test(txt(a))&&!isConsumer(a);const isMain=a=>/switchboard|main switch|feeder/.test(txt(a));function itemCard(a){const ac=circuitsFor(a),n=ac.length,verified=/verified|human reviewed/.test(norm(a.verification_status)),click=clickable(a)&&a.asset_code;const tag=n?n+' circuit'+(n===1?'':'s'):(verified?'Verified':'Recorded');const searchText=norm([a.asset_code,a.asset_name,a.plant_room,a.category,a.system_duty,a.distribution_board,...ac.flatMap(c=>[c.circuit_number,c.circuit_description,c.destination,c.phase,c.protective_device,c.device_rating,c.notes])].join(' '));const head=`<${click?'a':'div'} class="node"${click?` href="/electrical-board-circuits.html?board=${encodeURIComponent(a.asset_code)}"`:''}><div class="code">${esc(a.asset_code||'')}</div><h3>${esc(a.asset_name||'Electrical asset')}</h3><p>${esc(a.plant_room||'Location not recorded')}</p><span class="pill">${esc(tag)}</span></${click?'a':'div'}>`;const circuitHtml=n?`<div class="circuits">${ac.slice(0,8).map(c=>`<a class="circuit" href="/electrical-board-circuits.html?board=${encodeURIComponent(a.asset_code)}"><b>${esc(c.circuit_number||'Circuit')}</b><span>${esc(c.circuit_description||c.destination||'Recorded circuit')}</span>${c.device_rating?`<span>${esc(c.device_rating)}${c.phase?' · '+esc(c.phase):''}</span>`:''}</a>`).join('')}${n>8?`<a class="allCircuits" href="/electrical-board-circuits.html?board=${encodeURIComponent(a.asset_code)}">+ ${n-8} more circuits</a>`:''}</div>`:'';return `<div class="assetBlock mapItem" data-search="${esc(searchText)}">${head}${circuitHtml}</div>`}function groupCard(key,title,items){return `<div class="branchCell"><button class="groupBtn" type="button" data-group="${key}"><div class="code">${items.length} ITEMS</div><h3>${esc(title)}</h3><p>From main incomer</p><span class="pill">Open</span></button></div>`}const remainder=assets.filter(a=>a!==incoming),used=new Set();const take=(key,title,test)=>{const items=remainder.filter(a=>!used.has(a)&&test(a)).sort(natural);items.forEach(a=>used.add(a));return {key,title,items}};const groups=[take('db','Distribution Boards',a=>isDB(a)&&!isILight(a)&&!isDimmerRack(a)),take('cu','Consumer Units',a=>isConsumer(a)),take('ilight','iLight Units',a=>isILight(a)),take('dimmers','Dimmer Racks',a=>isDimmerRack(a)),take('main','Switchboard & Feeders',a=>isMain(a)),take('other','Other Controls',a=>true)].filter(g=>g.items.length);const sourceTitle=incoming?incoming.asset_name:'Mains incoming',sourceCode=incoming?(incoming.asset_code||building.name.toUpperCase()):building.name.toUpperCase(),sourceSub=incoming?(incoming.plant_room||'Incoming electrical distribution'):'Incoming electrical distribution';let html=`<div class="sourceWrap"><div class="sourceNode"><div class="code">${esc(sourceCode)}</div><h3>${esc(sourceTitle)}</h3><p>${esc(sourceSub)}</p></div></div><div class="trunk"></div><div class="bus"></div><div class="branchGrid">${groups.map(g=>groupCard(g.key,g.title,g.items)).join('')}</div>`;html+=groups.map(g=>`<div id="group-${g.key}" class="groupPanel"><div class="groupTitle">${esc(g.title)}</div><div class="itemGrid">${g.items.map(itemCard).join('')}</div></div>`).join('');html+='<div id="noMatches" class="noMatches">No electrical items match that search.</div>';canvas.innerHTML=html;canvas.querySelectorAll('.groupBtn').forEach(btn=>btn.addEventListener('click',()=>{const p=document.getElementById('group-'+btn.dataset.group);const open=p.classList.toggle('open');btn.querySelector('.pill').textContent=open?'Close':'Open';if(open)p.scrollIntoView({behavior:'smooth',block:'nearest'})}));const search=document.getElementById('mapSearch');search.addEventListener('input',()=>{const q=norm(search.value);let hits=0;canvas.querySelectorAll('.mapItem').forEach(el=>{const hit=!q||(el.dataset.search||'').includes(q);el.classList.toggle('hidden',!hit);if(hit)hits++});canvas.querySelectorAll('.groupPanel').forEach(p=>{const visible=[...p.querySelectorAll('.mapItem')].filter(x=>!x.classList.contains('hidden')).length;if(q&&visible)p.classList.add('open');else if(q&&!visible)p.classList.remove('open')});canvas.querySelectorAll('.groupBtn').forEach(btn=>{const p=document.getElementById('group-'+btn.dataset.group);const visible=p?[...p.querySelectorAll('.mapItem')].filter(x=>!x.classList.contains('hidden')).length:0;btn.closest('.branchCell').classList.toggle('hidden',!!q&&!visible)});document.getElementById('noMatches').style.display=q&&hits===0?'block':'none'});status.hidden=true;canvas.hidden=false})();
</script></body></html>
