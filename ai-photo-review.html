<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Lime Wood Photo Review</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0f1113;color:#f5f5f5} header{position:sticky;top:0;z-index:5;background:#171a1d;padding:14px 16px;border-bottom:1px solid #2a2e32} h1{font-size:20px;margin:0 0 4px}.muted{color:#a8afb6;font-size:13px}.tools{margin-top:10px}.btn{display:inline-block;padding:9px 12px;border-radius:8px;background:#f5f5f5;color:#111;text-decoration:none;font-weight:700;font-size:13px}.wrap{padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card{background:#171a1d;border:1px solid #2a2e32;border-radius:12px;overflow:hidden}.photo{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#090a0b}.meta{padding:10px}.loc{font-weight:700;font-size:14px;margin-bottom:4px}.file{color:#a8afb6;font-size:12px;word-break:break-all}.status{padding:30px;text-align:center;color:#a8afb6}.error{color:#ff9b9b}.count{font-weight:700;color:#fff}
  </style>
</head>
<body>
  <header>
    <h1>Lime Wood Photo Review</h1>
    <div class="muted"><span id="count" class="count">...</span> photos waiting to be sorted</div>
    <div class="tools"><a class="btn" href="https://sswedojvkqvoqmwhfmkj.supabase.co/functions/v1/photo-review-pack">Download review pack</a></div>
  </header>
  <main class="wrap">
    <div id="status" class="status">Loading photo inbox...</div>
    <div id="grid" class="grid" hidden></div>
  </main>
<script>
const api='https://sswedojvkqvoqmwhfmkj.supabase.co/functions/v1/photo-review-preview';
const grid=document.getElementById('grid');
const status=document.getElementById('status');
const count=document.getElementById('count');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
fetch(api,{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('Review feed returned '+r.status);return r.json()})
  .then(data=>{
    count.textContent=data.count??0;
    const items=data.items||[];
    grid.innerHTML=items.map(item=>`<article class="card"><img class="photo" loading="lazy" src="${api}?id=${encodeURIComponent(item.id)}" alt="${esc(item.location_hint||'Photo inbox image')}"><div class="meta"><div class="loc">${esc(item.location_hint||'Unspecified location')}</div><div class="file">${esc(item.original_filename||'')}</div></div></article>`).join('');
    status.hidden=true;grid.hidden=false;
  })
  .catch(err=>{status.classList.add('error');status.textContent='Could not load photo review: '+err.message});
</script>
</body>
</html>
