<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17372c"><title>Document Editor - Limewood Engineering</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--g:#17372c;--l:#b8cc19;--c:#f6f2e9;--i:#23362f;--line:#dfe5e0}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:3;background:var(--g);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}header button,.actions button,.attachBtn{border:0;border-radius:10px;padding:11px 14px;font-weight:800}.brand{font-weight:900}.sub{font-size:12px;opacity:.75}main{max-width:920px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 24px #0000000d}.top{border-bottom:2px solid var(--l);padding-bottom:14px;margin-bottom:16px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.11em;color:var(--g);margin-top:8px}h1{font:700 30px Georgia,serif;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#536259}input,select,textarea{width:100%;margin-top:5px;padding:11px;border:1px solid #cfd6d1;border-radius:10px;background:#fbfcfa;font:inherit;color:var(--i)}textarea{min-height:98px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:0;background:#fff;padding:12px 0}.save{background:var(--g);color:#fff}.pdf{background:var(--l);color:var(--g)}#msg{font-size:13px;font-weight:800;padding-top:8px}.attachPanel{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#f8faf8}.attachBtn{display:inline-block;background:var(--g);color:white;cursor:pointer}.attachBtn input{display:none}.attachList{margin-top:10px;font-size:13px}.attachRow{display:flex;justify-content:space-between;gap:8px;padding:8px;border-top:1px solid #e6ebe7}.attachRow button{border:0;background:#eee;color:#7b2d2d;border-radius:7px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}h1{font-size:25px}.actions button{flex:1}}</style></head><body><header><div><div class="brand">Limewood Engineering</div><div class="sub">Controlled document editor</div></div><button onclick="history.length>1?history.back():location.href='/'">Back</button></header><main><section class="card"><div class="top"><div class="eyebrow">LIMEWOOD ENGINEERING</div><div class="eyebrow">CONTROLLED DOCUMENT</div><h1 id="heading">New document</h1></div><div class="grid"><label>Document type<select id="type"><option value="rams">RAMS</option><option value="risk_assessment">Risk assessment</option><option value="method_statement">Method statement</option><option value="coshh">COSHH</option><option value="isolation_procedure">Isolation procedure</option><option value="manual">Manual</option><option value="schematic">Schematic</option><option value="drawing">Drawing</option><option value="certificate">Certificate</option><option value="report">Report</option><option value="permit">Permit</option><option value="inspection">Inspection / check</option><option value="other">Other</option></select></label><label>Document number<input id="number"></label><label class="wide">Title<input id="title"></label><label>Category<input id="category"></label><label>Revision<input id="revision" value="1"></label><label>Status<select id="status"><option value="draft">Draft</option><option value="under_review">Under review</option><option value="approved">Approved</option><option value="superseded">Superseded</option></select></label><label>Building<select id="building"><option value="">Estate-wide</option></select></label><label>Room / area<select id="location"><option value="">No specific room / area</option></select></label><label>Author<input id="author"></label><label>Approved by<input id="approved"></label><label>Issue date<input id="issue" type="date"></label><label>Review date<input id="review" type="date"></label><label class="wide">Purpose / summary<textarea id="purpose"></textarea></label><label class="wide">Scope<textarea id="scope"></textarea></label><label class="wide">Hazards / considerations<textarea id="hazards"></textarea></label><label class="wide">Controls / precautions<textarea id="controls"></textarea></label><label class="wide">Method / procedure / findings<textarea id="procedure"></textarea></label><label class="wide">Actions / recommendations<textarea id="actions"></textarea></label><label class="wide">Notes<textarea id="notes"></textarea></label></div><section class="attachPanel"><b>Attachments</b><p>Photos, PDFs and supporting files can be attached to the controlled document.</p><label class="attachBtn">+ Add files<input id="files" type="file" multiple></label><div id="attachMsg"></div><div id="attachList" class="attachList"></div></section><div id="msg"></div><div class="actions"><button class="pdf" id="pdfBtn">Download PDF</button><button class="save" id="saveBtn">Save changes</button></div></section></main><script>(()=>{'use strict';const U='https://sswedojvkqvoqmwhfmkj.supabase.co',K='sb_publishable_BoOHg11kfg6FB3xhQHW-dw_yal1q1Yu',B='asset-files',$=id=>document.getElementById(id),db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let doc=null,buildings=[],plantRooms=[],areas=[],subAreas=[],attachments=[];const p=new URLSearchParams(location.search),id=p.get('id'),requestedType=p.get('type')||'rams';const val=id=>$(id).value.trim(),set=(id,v)=>{$(id).value=v??''};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safe(v){return String(v||'file').replace(/[^a-zA-Z0-9._-]+/g,'_')}function prefix(t){return({rams:'RAMS',risk_assessment:'RA',method_statement:'MS',coshh:'COSHH',isolation_procedure:'ISO',manual:'MAN',schematic:'SCH',drawing:'DRG',certificate:'CERT',report:'REP',permit:'PERMIT',inspection:'INS',other:'DOC'})[t]||'DOC'}async function nextNumber(t){const pre=prefix(t),{data}=await db.from('controlled_documents').select('document_number').ilike('document_number',pre+'-%');let n=0;(data||[]).forEach(r=>{const m=String(r.document_number).match(/(\d+)$/);if(m)n=Math.max(n,+m[1])});return pre+'-'+String(n+1).padStart(3,'0')}function fill(data){doc=data;$('heading').textContent=data.title||'Controlled document';set('type',data.document_type);set('number',data.document_number);set('title',data.title);set('category',data.category);set('revision',data.revision||'1');set('status',data.status||'draft');set('author',data.author);set('approved',data.approved_by);set('issue',data.issue_date);set('review',data.review_date);const b=data.body||{};set('purpose',b.purpose);set('scope',b.scope);set('hazards',b.hazards);set('controls',b.controls);set('procedure',b.procedure);set('actions',b.actions);set('notes',b.notes)}function fillLocations(){const bid=val('building'),old=val('location');const prs=plantRooms.filter(x=>!bid||String(x.building_id)===String(bid));const ars=areas.filter(x=>x.active!==false&&(!bid||String(x.building_id)===String(bid)));const areaIds=new Set(ars.map(x=>String(x.id)));const subs=subAreas.filter(x=>x.active!==false&&(!bid||areaIds.has(String(x.area_id))));let html='<option value="">No specific room / area</option>';if(prs.length)html+='<optgroup label="Plant rooms">'+prs.map(x=>'<option value="plant:'+x.id+'">'+esc(x.name)+'</option>').join('')+'</optgroup>';if(ars.length)html+='<optgroup label="Rooms / areas">'+ars.map(x=>'<option value="area:'+x.id+'">'+esc(x.name)+(x.area_type?' · '+esc(x.area_type):'')+'</option>').join('')+'</optgroup>';if(subs.length)html+='<optgroup label="Sub-areas">'+subs.map(x=>{const a=areas.find(y=>String(y.id)===String(x.area_id));return'<option value="sub:'+x.id+'">'+esc(a?.name||'Area')+' · '+esc(x.name)+'</option>'}).join('')+'</optgroup>';$('location').innerHTML=html;if([...$('location').options].some(o=>o.value===old))$('location').value=old}async function load(){const[b,r,a,s]=await Promise.all([db.from('buildings').select('id,name').order('name'),db.from('plant_rooms').select('id,name,building_id').order('name'),db.from('location_areas').select('id,name,building_id,area_type,active').order('sort_order').order('name'),db.from('location_sub_areas').select('id,name,area_id,active').order('sort_order').order('name')]);buildings=b.data||[];plantRooms=r.data||[];areas=a.data||[];subAreas=s.data||[];$('building').innerHTML='<option value="">Estate-wide</option>'+buildings.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');if(id){const{data,error}=await db.from('controlled_documents').select('*').eq('id',id).single();if(error)throw error;fill(data);$('building').value=data.building_id||'';fillLocations();if(data.plant_room_id)$('location').value='plant:'+data.plant_room_id;else if(data.location_sub_area_id)$('location').value='sub:'+data.location_sub_area_id;else if(data.location_area_id)$('location').value='area:'+data.location_area_id;await loadAttachments()}else{$('type').value=requestedType;$('number').value=await nextNumber(requestedType);fillLocations()}}$('building').onchange=()=>{fillLocations()};$('type').onchange=async()=>{if(!doc)$('number').value=await nextNumber(val('type'))};function locationFields(){const [kind,lid]=val('location').split(':');return{plant_room_id:kind==='plant'?lid||null:null,location_area_id:kind==='area'?lid||null:null,location_sub_area_id:kind==='sub'?lid||null:null}}async function saveDoc(){const{data:s}=await db.auth.getSession(),uid=s?.session?.user?.id;if(!uid)return $('msg').textContent='Session expired. Sign in again.';const row={document_number:val('number'),document_type:val('type'),title:val('title'),category:val('category')||null,revision:val('revision')||'1',status:val('status')||'draft',author:val('author')||null,approved_by:val('approved')||null,issue_date:val('issue')||null,review_date:val('review')||null,building_id:val('building')||null,...locationFields(),description:val('purpose')||null,body:{purpose:val('purpose'),scope:val('scope'),hazards:val('hazards'),controls:val('controls'),procedure:val('procedure'),actions:val('actions'),notes:val('notes')},updated_by:uid,updated_at:new Date().toISOString()};$('msg').textContent='Saving...';let res;if(doc)res=await db.from('controlled_documents').update(row).eq('id',doc.id).select('*').single();else res=await db.from('controlled_documents').insert({...row,created_by:uid}).select('*').single();if(res.error)return $('msg').textContent=res.error.message;doc=res.data;fill(doc);history.replaceState(null,'','?id='+doc.id);$('msg').textContent='Saved.';await loadAttachments()}async function loadAttachments(){if(!doc)return;$('attachList').innerHTML='';const{data}=await db.from('controlled_document_attachments').select('*').eq('document_id',doc.id).order('sort_order');attachments=data||[];$('attachList').innerHTML=attachments.length?attachments.map(a=>'<div class="attachRow"><span>'+esc(a.file_name||a.caption||'Attachment')+'</span><button data-r="'+a.id+'">Remove</button></div>').join(''):'No attachments yet.';$('attachList').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>removeAttachment(b.dataset.r))}async function upload(files){if(!doc){await saveDoc();if(!doc)return}const{data:s}=await db.auth.getSession(),uid=s?.session?.user?.id;if(!uid)return;let order=attachments.length;for(const file of files){const path='controlled-documents/'+doc.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+safe(file.name);const up=await db.storage.from(B).upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(up.error){$('attachMsg').textContent=up.error.message;return}const ins=await db.from('controlled_document_attachments').insert({document_id:doc.id,storage_path:path,file_name:file.name,caption:file.name,sort_order:order++,created_by:uid});if(ins.error){$('attachMsg').textContent=ins.error.message;return}}$('attachMsg').textContent='Files added.';await loadAttachments()}async function removeAttachment(aid){const a=attachments.find(x=>x.id===aid);if(!a||!confirm('Remove this attachment?'))return;await db.from('controlled_document_attachments').delete().eq('id',aid);await db.storage.from(B).remove([a.storage_path]);await loadAttachments()}$('files').onchange=e=>upload([...e.target.files]);$('saveBtn').onclick=saveDoc;$('pdfBtn').onclick=async()=>{if(!doc)await saveDoc();if(doc)location.href='/document-pdf.html?id='+encodeURIComponent(doc.id)};load().catch(e=>$('msg').textContent=e.message)})();</script></body></html>
