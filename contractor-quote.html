<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Submit Quotation | Limewood Engineering</title><meta name="theme-color" content="#17372c">
<style>
:root{--g:#17372c;--gold:#b99a4a;--paper:#f3f6f4;--line:#dbe3de;--blue:#1f5fbf}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial;color:#26322c}header{background:var(--g);color:#fff;padding:18px}.brand{max-width:760px;margin:auto}.brand h1{font:700 22px Georgia;margin:0}.brand p{margin:4px 0;color:#dfe8e2}.brand a{color:#78a9ff;font-weight:900}main{max-width:760px;margin:22px auto;padding:0 16px 36px}.hero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.hero h2{font:700 27px Georgia;color:var(--g)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{background:#f7faf8;border-radius:11px;padding:10px}.fact small{display:block;text-transform:uppercase;font-size:9px;color:#758079;font-weight:900}.fact b{display:block;margin-top:4px}form{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.wide{grid-column:1/-1}label{display:grid;gap:6px;font-size:12px;font-weight:800}input,select,textarea{border:1px solid #cfd8d2;border-radius:10px;padding:11px;font:inherit}.submit{width:100%;margin-top:16px;border:0;background:var(--gold);padding:14px;border-radius:11px;font-weight:900}.msg{margin-top:12px;padding:12px;border-radius:11px;background:#eef4ff}.ok{background:#dceee2}.bad{background:#f6dddd}.muted{color:#6d7871}@media(max-width:620px){.grid,.facts{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header><div class="brand"><h1>Limewood Engineering</h1><p>Secure Contractor Quotation · Powered by <a href="https://forgecompliance.co.uk" target="_blank">Forge Compliance</a></p></div></header><main><section class="hero"><h2>Submit quotation</h2><div id="job" class="facts"><div class="fact"><small>Status</small><b>Loading request…</b></div></div></section><form id="form" hidden><div class="grid"><label>Proposal type<select id="type"><option>Repair</option><option>Replacement</option></select></label><label>Quoted amount (£)<input id="amount" type="number" step="0.01" min="0" required></label><label>Lead time<input id="lead" placeholder="e.g. 3 working days"></label><label>Warranty<input id="warranty" placeholder="e.g. 12 months"></label><label class="wide">Proposed works<textarea id="scope" rows="5" required></textarea></label><label class="wide">Exclusions / assumptions<textarea id="exclusions" rows="3"></textarea></label><label>Earliest attendance<input id="attendance" type="date"></label><label>Quote reference<input id="quoteRef"></label></div><button class="submit">Submit quotation</button><div id="msg" hidden></div></form></main>
<script>
(async()=>{
 const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
 const token=new URLSearchParams(location.search).get('token');if(!token){$('job').innerHTML='<div class="msg bad">Invalid quotation link.</div>';return}
 const res=await fetch('/api/contractor-quote?token='+encodeURIComponent(token));const data=await res.json().catch(()=>({}));
 if(!res.ok){$('job').innerHTML='<div class="msg bad">'+esc(data.error||'Quotation request not found.')+'</div>';return}
 const q=data.quote,i=data.issue,c=data.contractor;$('job').innerHTML=[['Reference',i.reference||q.reference],['Location',i.location],['Issue',i.description],['Contractor',c.company||c.name]].map(([a,b])=>`<div class="fact"><small>${a}</small><b>${esc(b||'—')}</b></div>`).join('');$('form').hidden=false;
 $('form').onsubmit=async e=>{e.preventDefault();const payload={token,proposal_type:$('type').value,quoted_amount:Number($('amount').value),lead_time:$('lead').value.trim(),warranty:$('warranty').value.trim(),proposal_scope:$('scope').value.trim(),exclusions:$('exclusions').value.trim(),earliest_attendance:$('attendance').value||null,contractor_quote_ref:$('quoteRef').value.trim()};const r=await fetch('/api/contractor-quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));$('msg').hidden=false;$('msg').className='msg '+(r.ok?'ok':'bad');$('msg').textContent=r.ok?'Quotation submitted successfully. Engineering has been notified.':(d.error||'Could not submit quotation.');if(r.ok)e.target.querySelector('button').disabled=true};
})();
</script></body></html>
