<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Main House Electrical Item</title><style>:root{--g:#173d33;--cream:#f4f0e8;--muted:#6f7b76}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1f2b27;font-family:Arial,Helvetica,sans-serif}.top{background:var(--g);color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:17px;margin:0}.top small{opacity:.72}.top a{border:1px solid #ffffff35;background:#ffffff12;color:#fff;padding:9px;border-radius:8px;color:#fff;text-decoration:none;font-weight:700}.page{max-width:760px;margin:auto;padding:10px}.card{background:#fff;border:1px solid #d9d6cf;border-radius:14px;overflow:hidden}.head,.section{padding:14px}.section{border-top:1px solid #eee9e0}.head h2{margin:4px 0;color:var(--g)}.eyebrow{font-size:9px;font-weight:900;color:#8a7650}.meta,.note{font-size:11px;color:var(--muted);line-height:1.45}.section h3{margin:0 0 8px;font-size:13px;color:var(--g)}.list,.circuits{display:grid;gap:6px}.list{grid-template-columns:1fr 1fr}.item,.circuit{background:#faf9f6;border:1px solid #e2ddd4;border-radius:9px;padding:9px}.itemLink{display:flex;align-items:center;justify-content:space-between;gap:10px;color:inherit;text-decoration:none}.itemLink:hover{border-color:#c6a96a;background:#fffdf7}.assetOpen{font-size:9px;color:#173d33;background:#eaf1ed;border-radius:999px;padding:5px 7px;white-space:nowrap}.pending{opacity:.72}.pending .assetOpen{background:#efede7;color:#7d817e}.circuit{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center}.cno{font-weight:900;color:var(--g)}.cdesc{font-size:12px;font-weight:700}.cmeta,.rating{font-size:9px;color:var(--muted)}.rating{font-weight:800;white-space:nowrap}@media(max-width:520px){.list{grid-template-columns:1fr}.circuit{grid-template-columns:38px 1fr}.rating{grid-column:2}}</style></head><body><header class="top"><div><h1>Main House Electrical</h1><small>Verified register detail</small></div><a href="/main-house-electrical-section.html">← Back</a></header><main class="page"><section class="card"><div class="head"><div class="eyebrow" id="type">ELECTRICAL ITEM</div><h2 id="title">Loading…</h2><div class="meta" id="meta"></div></div><div class="section" id="functions" hidden><h3>Verified functions</h3><div class="list" id="functionList"></div></div><div class="section" id="circuits"><h3 id="circuitTitle">Circuits</h3><div class="circuits" id="circuitList"><div class="note">Loading register…</div></div></div><div class="section"><h3>Record status</h3><div class="note">Only verified information is shown. Missing information is deliberately left blank.</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js"></script><script>(async()=>{const key=new URLSearchParams(location.search).get('item')||'';const assetLinks={
'Heating Pump 1':'P-MH-01',

'Pressurisation Unit':'PU-MH-01',

'Hot Water Supply Secondary Return Pump':'P-MH-04'
};const special={mcp:['MSCP Main House / MCP','Control panel','Main House Plant Room',['Heating Pump 1','Heating Pump 2','Pressurisation Unit','Underfloor Heating Pump','Billiard Room Supply Fan','Billiard Room Extract Fan','Hot Water Supply Secondary Return Pump']],fan_msr:['Fan MSR','Control panel','Main House Plant Room',['Basement Supply Fan','Basement Extract Fan','Toilet Core Fan','Staff Changing Supply Fan','Staff Changing Extract Fan']],roof:['Roof Isolation','Isolation','Main House Plant Room · serves Roof 1 and Roof 2',[]],lift:['Passenger Lift','Equipment feeder','Main House Plant Room',[]],dishwasher:['Dishwasher Pot Wash','Equipment feeder','Main House Plant Room',[]],emergency_fan:['Emergency Service Fan','Equipment feeder','Main House Plant Room',[]],kitchen_store:['Distribution Board Kitchen Store','Distribution feeder','Main House Plant Room',[]]};let board='',name='',kind='Electrical item',meta='';if(special[key]){[name,kind,meta]=special[key];const f=special[key][3];if(f.length){functions.hidden=false;functionList.innerHTML=f.map(x=>{const code=assetLinks[x];return code?`<a class="item itemLink" href="/?asset=${encodeURIComponent(code)}&return=%2Fmain-house-electrical-item.html%3Fitem%3Dmcp"><span>${x}</span><b class="assetOpen">Open asset ›</b></a>`:`<div class="item itemLink pending"><span>${x}</span><b class="assetOpen">Asset link pending</b></div>`}).join('')}}else if(/^mh\d+$/.test(key)){const n=key.slice(2);name=`Distribution Board MH${n}`;kind='Distribution board';const boardMap={14:'MH-DB-026',15:'MH-DB-15',16:'MH-DB-16',17:'MH-DB-17',24:'MH-DB-24',25:'MH-DB-25'};board=boardMap[n]||`MH-DB-${n}`;const loc={8:'First Floor Riser Cupboard',9:'First Floor Riser Cupboard',10:'First Floor Riser Cupboard',11:'First Floor Riser Cupboard',15:'Second Floor Riser Cupboard',16:'Second Floor Riser Cupboard',17:'Second Floor Riser Cupboard',24:'Main House Basement Food Prep Room',25:'Ground Floor Riser Cupboard'};meta=loc[n]||'Schedule/location not yet fully verified.'}else if(/^dim/.test(key)){const n=key.slice(3).replace('_','/');name=`iLight Dimmer ${n}`;kind='Lighting control';board=key==='dim28_33'?'MH-DIM-28-33':`MH-DIM-${key.slice(3).toUpperCase()}`;meta=/^(dim15a|dim15b|dim16a|dim16b|dim17a|dim17b|dim29a|dim29b|dim30a|dim30b|dim34a|dim34b)$/.test(key)?'Second Floor Riser Cupboard':'Main House electrical system'}else if(/^cu[123]$/.test(key)){const n=key.slice(2);name=`Consumer Unit ${n}`;kind='Consumer unit';board=`MH-CU-0${n}`;meta='Main House electrical system'}else{name='Electrical item';meta='No verified detail recorded yet.'}title.textContent=name;type.textContent=kind.toUpperCase();document.getElementById('meta').textContent=meta;if(!board){circuits.hidden=true;return}try{const cfg=window.LIMEWOOD_CONFIG||{},sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const {data,error}=await sb.from('electrical_circuits').select('circuit_number,circuit_description,phase,protective_device,device_rating,status').eq('board_asset_code',board);if(error)throw error;const rows=(data||[]).sort((a,b)=>String(a.circuit_number).localeCompare(String(b.circuit_number),undefined,{numeric:true}));circuitTitle.textContent=`Circuits · ${rows.length}`;circuitList.innerHTML=rows.length?rows.map(r=>`<div class="circuit"><div class="cno">${esc(r.circuit_number)}</div><div><div class="cdesc">${esc(r.circuit_description||'')}</div><div class="cmeta">${esc([r.protective_device,r.phase,r.status].filter(Boolean).join(' · '))}</div></div><div class="rating">${esc(r.device_rating||'')}</div></div>`).join(''):'<div class="note">Schedule not yet surveyed. Left blank intentionally.</div>'}catch(e){circuitList.innerHTML='<div class="note">Register could not be loaded.</div>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})();</script></body></html>
