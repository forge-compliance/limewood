<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17372c">
  <title>SOP - Limewood Engineering</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--green:#17372c;--lime:#b8cc19;--cream:#f6f2e9;--ink:#23362f;--line:#d9e0db;--gold:#b98a2e}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
    header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;background:var(--green);color:#fff}
    header b{display:block;font-size:16px}header small{opacity:.72}button,a.action{border:0;border-radius:10px;padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer}
    header button{background:#fff;color:var(--green)}main{max-width:900px;margin:auto;padding:12px}.sheet{background:#fff;border-radius:16px;box-shadow:0 8px 28px #0001;overflow:hidden}
    .hero{padding:18px;border-bottom:3px solid var(--lime);background:linear-gradient(135deg,#fff,#f8faef)}.eyebrow{color:#73840e;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:5px 0 12px;color:var(--green);font:700 28px Georgia,serif;line-height:1.08}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.meta div{padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#fff}.meta b,.meta span{display:block}.meta b{font-size:9px;color:#68756e;text-transform:uppercase}.meta span{font-size:12px}.approved{color:#547000;font-weight:900}
    .content{padding:15px}.quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.quickCard{border:1px solid var(--line);border-radius:12px;padding:12px;background:#f9faf8}.quickCard b{display:block;color:var(--green);font-size:12px;text-transform:uppercase;letter-spacing:.05em}.quickCard span{display:block;margin-top:4px;font-weight:700;white-space:pre-line}.where{grid-column:1/-1;border:2px solid var(--lime);background:#f9fbe9}.where b{color:#6f800f}
    .photoSection{margin:0 0 14px}.photoSection h2,.stepsTitle{margin:0 0 8px;color:var(--green);font:700 20px Georgia,serif}.photoGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photoCard{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#f9faf8;margin:0}.photoCard img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#eef1ee}.photoCard figcaption{padding:8px 10px;font-weight:800;color:#45564f;font-size:12px}.photoCard figcaption small{display:none}
    .serviceGrid{display:grid;gap:10px;margin:0 0 14px}.serviceCard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.serviceHead{padding:10px 12px;color:#fff;background:var(--green)}.serviceHead b{display:block;font-size:17px}.serviceHead small{display:block;margin-top:2px;font-weight:700;font-size:12px}.serviceBody{padding:11px 12px}.serviceBody ol{margin:0;padding-left:20px}.serviceBody li{margin:0 0 7px}.serviceBody li:last-child{margin-bottom:0}.cold .serviceHead{background:#176ca4}.hot .serviceHead{background:#a8402a}.heating .serviceHead{background:#806019}.electrical .serviceHead{background:#765400}.gas .serviceHead{background:#7a342d}.pool .serviceHead{background:#087784}.proof,.restore,.warning{margin-top:9px;padding:9px 10px;border-radius:8px;font-weight:800;font-size:12px}.proof{background:#eef5ed;color:#254b35}.restore{background:#eef3f8;color:#24465f}.warning{background:#fff2df;color:#753d0a}
    details.more{margin:10px 0;border:1px solid var(--line);border-radius:12px;background:#fbfcfa;overflow:hidden}details.more summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:900;color:var(--green)}details.more summary::-webkit-details-marker{display:none}details.more summary:after{content:'+';float:right}details.more[open] summary:after{content:'−'}details.more .detailBody{padding:0 14px 14px;white-space:pre-line}.notice{border-left:4px solid var(--gold);background:#fff8e8;padding:10px;border-radius:8px}
    .actions{display:flex;gap:9px;flex-wrap:wrap;padding:0 15px 16px}.actions .pdf{background:var(--lime);color:var(--green)}.actions .back{background:var(--green);color:#fff}.error{padding:30px;text-align:center;color:#7c2d2d}
    @media(max-width:620px){main{padding:8px}.sheet{border-radius:12px}.hero{padding:14px}h1{font-size:24px}.meta{grid-template-columns:1fr 1fr}.content{padding:12px}.quickGrid{grid-template-columns:1fr 1fr}.photoGrid{grid-template-columns:1fr}.actions{padding:0 12px 14px}.actions a{flex:1;text-align:center}}
  </style>
</head>
<body>
<header><div><b>Limewood Engineering</b><small>Controlled SOP</small></div><button type="button" onclick="history.length>1?history.back():location.href='/'">Back</button></header>
<main><article class="sheet" id="sheet"><div class="error">Loading approved procedure…</div></article></main>
<script>
(()=>{'use strict';
  const U='https://sswedojvkqvoqmwhfmkj.supabase.co',K='sb_publishable_BoOHg11kfg6FB3xhQHW-dw_yal1q1Yu',MARK='LW_SOP_BUILDER_V1:';
  const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),number=(new URLSearchParams(location.search).get('number')||'').trim(),sheet=document.getElementById('sheet');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function detail(v){v=String(v||'');if(!v.startsWith(MARK))return{notes:v};try{return JSON.parse(v.slice(MARK.length))}catch{return{notes:v}}}
  function lines(v){return String(v||'').split(/\n+/).map(x=>x.replace(/^\s*(?:\d+[.)]|[-•])\s*/, '').trim()).filter(Boolean)}
  function card(label,text,cls=''){return text?`<div class="quickCard ${cls}"><b>${esc(label)}</b><span>${esc(text)}</span></div>`:''}
  function more(title,text,notice=false){return text?`<details class="more"><summary>${esc(title)}</summary><div class="detailBody${notice?' notice':''}">${esc(text)}</div></details>`:''}
  function actionCards(d,sop){let items=Array.isArray(d.service_actions)?d.service_actions:Array.isArray(d.action_groups)?d.action_groups:[];if(!items.length&&d.steps)items=[{key:String(sop.category||'').toLowerCase().includes('pool')?'pool':'general',title:'Isolation steps',when:d.scope||'',steps:lines(d.steps),prove:d.prove||'',restore:d.reinstatement||''}];if(!items.length)return'';return`<h2 class="stepsTitle">Isolation steps</h2><div class="serviceGrid">${items.map(x=>`<section class="serviceCard ${esc(x.key||'general')}"><div class="serviceHead"><b>${esc(x.title||'Procedure')}</b>${x.when?`<small>${esc(x.when)}</small>`:''}</div><div class="serviceBody">${x.warning?`<div class="warning">⚠ ${esc(x.warning)}</div>`:''}<ol>${(x.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${x.prove?`<div class="proof">✓ ${esc(x.prove)}</div>`:''}${x.restore?`<div class="restore">↻ ${esc(x.restore)}</div>`:''}</div></section>`).join('')}</div>`}
  function photoHtml(rows){if(!rows?.length)return'';const cards=rows.map(r=>{const p=r.photo_inbox||r.photo_inbox_id||{},path=p.storage_path||r.storage_path||'',name=p.original_filename||r.file_name||'';if(!path)return'';const url=db.storage.from('asset-files').getPublicUrl(path).data.publicUrl;return`<figure class="photoCard"><img src="${esc(url)}" alt="${esc(r.caption||name||'SOP reference photo')}" loading="lazy"><figcaption>${esc(r.caption||'Reference photo')}${name?`<small>${esc(name)}</small>`:''}</figcaption></figure>`}).join('');return cards?`<section class="photoSection"><h2>Photos</h2><div class="photoGrid">${cards}</div></section>`:''}
  async function run(){
    if(!number)throw Error('SOP number missing.');
    const{data:sop,error}=await db.from('sops').select('*').eq('sop_number',number).maybeSingle();if(error||!sop)throw error||Error('SOP not found.');
    const{data:photos,error:photoErr}=await db.from('sop_photos').select('caption,sort_order,photo_inbox:photo_inbox_id(storage_path,original_filename)').eq('sop_id',sop.id).order('sort_order',{ascending:true});if(photoErr)console.warn('SOP photos unavailable',photoErr.message);
    const d=detail(sop.description);document.title=(sop.title||number)+' - Limewood Engineering';
    const isolationSummary=d.isolation||d.scope||'';
    sheet.innerHTML=`<div class="hero"><div class="eyebrow">Controlled SOP</div><h1>${esc(sop.title||number)}</h1><div class="meta"><div><b>Document</b><span>${esc(sop.sop_number)}</span></div><div><b>Revision</b><span>${esc(sop.revision||'1')}</span></div><div><b>Status</b><span class="approved">${esc((sop.status||'draft').replaceAll('_',' '))}</span></div><div><b>Author</b><span>${esc(sop.author||'—')}</span></div><div><b>Approved by</b><span>${esc(sop.approved_by||'—')}</span></div><div><b>Issue date</b><span>${esc(sop.issue_date||'—')}</span></div></div></div><div class="content"><div class="quickGrid">${card('Where to find it',d.location,'where')}${card('What it isolates',isolationSummary)}${card('Before starting',d.ppe)}</div>${photoHtml(photos||[])}${actionCards(d,sop)}${more('Emergency / failed isolation',d.emergency,true)}${more('Technical reference',d.isolation)}${more('Reinstatement detail',d.reinstatement)}${more('Operating notes',d.notes)}</div><div class="actions"><a class="action pdf" href="/sop-pdf.html?number=${encodeURIComponent(sop.sop_number)}">Download PDF</a><a class="action back" href="/">Back to dashboard</a></div>`;
  }
  run().catch(e=>sheet.innerHTML='<div class="error"><b>Could not open this SOP.</b><br>'+esc(e?.message||e)+'</div>');
})();
</script>
</body>
</html>
