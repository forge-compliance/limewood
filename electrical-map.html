<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electrical Map</title><link rel="stylesheet" href="/assets/style.css?v=601"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js?v=20260901-auth2"></script><script defer src="/assets/site-sidebar.js"></script><style>:root{--bg:#171918;--panel:#232725;--line:#6f8f7e;--text:#eff6f1;--muted:#a8b5ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.page{max-width:1200px;margin:auto;padding:18px}.head{background:#17372c;border:1px solid #3f6654;border-radius:20px;padding:20px}.head h1{margin:5px 0;font:700 30px Georgia,serif}.head p{margin:0;color:#cbd9d1}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.toolbar select,.toolbar button,.toolbar a{background:#315746;color:#fff;border:0;border-radius:10px;padding:10px 12px;font-weight:700;text-decoration:none}.buildingStrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-top:14px}.buildingStrip button{border:1px solid #46534c;background:#202421;color:#dce8e1;border-radius:10px;padding:10px;font-weight:800}.buildingStrip button.active{background:#315746;border-color:#6f927f}.status,.note{margin-top:16px;padding:12px;border:1px solid #46534c;border-radius:12px;background:#202421;color:var(--muted)}.section{margin-top:22px}.section h2{font:700 22px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.node{background:var(--panel);border:1px solid #56635c;border-radius:14px;padding:13px}.node b{display:block}.node small{display:block;color:var(--muted);margin-top:5px;line-height:1.35}.node.board{border-color:#84a997;background:#26362f}.node.mapped{border-color:#6f927f}.node.unmapped{border-style:dashed}.circuit{font-size:11px;color:#d4e6dc;font-weight:700;margin-bottom:5px}.boards{display:grid;gap:16px}.boardBlock{padding:15px;border:1px solid #435149;border-radius:16px;background:#1d211f}.links{display:grid;gap:8px}.link{padding:10px 12px;border-left:3px solid var(--line);background:#202421;border-radius:8px}.stan{font-size:11px;color:#bcdacb}@media(max-width:600px){.page{padding:12px}.head h1{font-size:24px}.toolbar{display:grid}.grid{grid-template-columns:1fr}.buildingStrip{grid-template-columns:1fr 1fr}}</style></head><body><main class="page"><section class="head"><small>MASTER ELECTRICAL MAP · LIVE REGISTER</small><h1 id="title">Electrical Map</h1><p>Choose a building to open its live electrical distribution map. Stan-reviewed links appear here automatically.</p><div class="toolbar"><select id="building"></select><button id="refresh">Refresh map</button><a href="/electrical-distribution.html">Electrical search</a><a href="/">Dashboard</a></div><div id="buildingStrip" class="buildingStrip"></div></section><div id="status" class="status">Loading…</div><div id="map" hidden></div></main><script>(async()=>{const cfg=window.LIMEWOOD_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const sel=document.getElementById('building'),strip=document.getElementById('buildingStrip'),status=document.getElementById('status'),map=document.getElementById('map'),title=document.getElementById('title');const q=new URL(location.href).searchParams;const [br,pr]=await Promise.all([sb.from('buildings').select('id,name').order('name'),sb.from('plant_rooms').select('id,name,building_id')]);if(br.error||pr.error){status.textContent='Could not load building directory.';return}const buildings=br.data||[],rooms=pr.data||[];sel.innerHTML=buildings.map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');strip.innerHTML=buildings.map(b=>`<button data-building="${esc(b.name)}">${esc(b.name)}</button>`).join('');const requested=q.get('building');if(requested&&buildings.some(b=>b.name===requested))sel.value=requested;else if(buildings.some(b=>b.name==='Main House'))sel.value='Main House';const node=(a,cls='')=>`<div class="node ${cls}"><b>${esc(a.asset_code||'')} · ${esc(a.asset_name||'Unnamed')}</b><small>${esc(a.plant_room||'Location not recorded')}${a.voltage?' · '+esc(a.voltage):''}${a.device_rating?' · '+esc(a.device_rating):''}</small>${a.upstream_supply?`<small>Fed from: ${esc(a.upstream_supply)}</small>`:''}${a.circuit_reference?`<small>Circuit: ${esc(a.circuit_reference)}</small>`:''}</div>`;async function load(){status.hidden=false;map.hidden=true;status.textContent='Loading electrical register…';const name=sel.value;title.textContent=name+' electrical map';history.replaceState(null,'','?building='+encodeURIComponent(name));strip.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.building===name));const b=buildings.find(x=>x.name===name);const roomNames=rooms.filter(r=>String(r.building_id)===String(b?.id)).map(r=>r.name);if(!roomNames.length){status.textContent='No registered electrical locations for this building yet.';return}const ar=await sb.from('electrical_assets').select('asset_code,asset_name,plant_room,category,distribution_board,circuit_reference,upstream_supply,phase,voltage,protective_device,device_rating,isolation_point,verification_status,source_type').in('plant_room',roomNames).order('asset_code');if(ar.error){status.textContent=ar.error.message;return}const assets=ar.data||[];const boardKeys=[...new Set(assets.filter(a=>/distribution board|control panel|mcp|panel|switchboard/i.test((a.category||'')+' '+(a.asset_name||''))).flatMap(a=>[a.asset_code,a.asset_name]).filter(Boolean))];let circuits=[];if(boardKeys.length){const cr=await sb.from('electrical_circuits').select('board_asset_code,circuit_number,circuit_description,phase,protective_device,device_rating,destination,verification_status,notes').in('board_asset_code',boardKeys).order('board_asset_code').order('circuit_number');if(!cr.error)circuits=cr.data||[]}const mapped=assets.filter(a=>a.upstream_supply||a.distribution_board||a.circuit_reference);const unmapped=assets.filter(a=>!a.upstream_supply&&!a.distribution_board&&!a.circuit_reference&&!/distribution board|control panel|meter|intake|switchboard/i.test((a.category||'')+' '+(a.asset_name||'')));const boards=assets.filter(a=>boardKeys.includes(a.asset_code)||boardKeys.includes(a.asset_name));map.innerHTML=`<section class="section"><h2>Registered supply relationships</h2>${mapped.length?`<div class="links">${mapped.map(a=>`<div class="link"><b>${esc(a.asset_code)} · ${esc(a.asset_name)}</b><div>${esc(a.upstream_supply||a.distribution_board||'Mapped')}</div>${a.circuit_reference?`<small>Circuit ${esc(a.circuit_reference)}</small>`:''}</div>`).join('')}</div>`:'<div class="note">No explicit upstream relationships recorded yet.</div>'}</section><section class="section"><h2>Boards & control panels</h2><div class="boards">${boards.length?boards.map(bd=>{const cs=circuits.filter(c=>c.board_asset_code===bd.asset_code||c.board_asset_code===bd.asset_name);return `<div class="boardBlock">${node(bd,'board')}<div class="grid" style="margin-top:12px">${cs.length?cs.map(c=>`<div><div class="circuit">${esc(c.circuit_number||'No ref')}${c.phase?' · '+esc(c.phase):''}${c.device_rating?' · '+esc(c.device_rating):''}</div><div class="node mapped"><b>${esc(c.circuit_description||'Unnamed outgoing')}</b><small>${esc(c.protective_device||c.verification_status||'')}</small></div></div>`).join(''):'<div class="note">No outgoing circuits registered for this panel yet.</div>'}</div></div>`}).join(''):'<div class="note">No boards or control panels registered in this building yet.</div>'}</div></section><section class="section"><h2>Electrical assets still to map</h2>${unmapped.length?`<div class="grid">${unmapped.map(a=>node(a,'unmapped')).join('')}</div>`:'<div class="note">No unmapped local electrical assets.</div>'}</section>`;status.hidden=true;map.hidden=false}sel.addEventListener('change',load);strip.addEventListener('click',e=>{const b=e.target.closest('[data-building]');if(!b)return;sel.value=b.dataset.building;load()});document.getElementById('refresh').addEventListener('click',load);await load()})();</script></body></html>
