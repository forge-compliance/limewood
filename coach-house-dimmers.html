<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Coach House Dimmers</title><link rel="stylesheet" href="/assets/style.css?v=20260830-10"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js?v=20260901-auth2"></script><script defer src="/assets/site-sidebar.js?v=20260830-2"></script><style>:root{--g:#173d33;--gold:#c6a96a;--cream:#f4f0e8;--muted:#6f7b76}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1f2b27;font-family:Arial,Helvetica,sans-serif}.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:8px}.bolt{width:34px;height:34px;border-radius:9px;background:#54230a;color:#ffd46a;display:grid;place-items:center;font-size:19px}.brand h1{font:700 20px Georgia,serif;margin:0;line-height:1}.brand small{opacity:.72;font-size:9px}.top a{border:1px solid #ffffff35;background:#ffffff12;color:#fff;padding:8px;border-radius:8px;font-weight:700;text-decoration:none}.page{max-width:900px;margin:auto;padding:7px}.intro h2{margin:0;color:var(--g);font-size:18px}.intro p{margin:2px 0 7px;color:var(--muted);font-size:10px}.canvas{background:#272727;border:1px solid #77736d;border-radius:13px;padding:10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.node{display:block;background:#5a5853;border:1.5px solid #77736d;border-radius:8px;padding:7px 8px;text-decoration:none;color:#fff}.code{font-size:7px;font-weight:800;color:#c8b37d}.node h3{margin:2px 0;font-size:10px;color:#d7f2e7}.node p{margin:0;color:#d0ccc6;font-size:7px}.pill{display:inline-block;margin-top:5px;padding:2px 5px;border-radius:999px;background:#132d24;color:#d5eee4;font-size:7px;font-weight:800}.status{padding:12px;background:#fff;border:1px solid #d8d3ca;border-radius:11px;color:var(--muted);font-size:10px}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.node h3{font-size:9px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand"><div class="bolt">⚡</div><div><h1>Coach House Dimmers</h1><small>Select a dimmer board</small></div></div><a href="/electrical-schematic-map.html?building=Coach%20House">← Coach House</a></header><main class="page"><section class="intro"><h2>Dimmer boards</h2><p>Tap a dimmer to open its recorded circuit schedule.</p></section><div id="status" class="status">Loading dimmers…</div><section id="canvas" class="canvas" hidden><div id="grid" class="grid"></div></section></main><script>(async()=>{'use strict';const cfg=window.LIMEWOOD_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=v=>String(v||'').toLowerCase();const status=document.getElementById('status'),canvas=document.getElementById('canvas'),grid=document.getElementById('grid');const [ar,cr]=await Promise.all([sb.from('electrical_assets').select('asset_code,asset_name,plant_room,category,verification_status').or('plant_room.ilike.Coach House%,asset_code.ilike.CH-%').order('asset_code'),sb.from('electrical_circuits').select('board_asset_code')]);if(ar.error){status.textContent='Could not load Coach House dimmers.';return}const all=ar.data||[],circuits=cr.error?[]:(cr.data||[]),dimmers=all.filter(a=>/dimmer|lighting rack/i.test((a.asset_name||'')+' '+(a.category||'')));const count=a=>circuits.filter(c=>norm(c.board_asset_code)===norm(a.asset_code)||norm(c.board_asset_code)===norm(a.asset_name)).length;if(!dimmers.length){status.textContent='No Coach House dimmer boards recorded.';return}grid.innerHTML=dimmers.map(a=>{const n=count(a);return `<a class="node" href="/electrical-board-circuits.html?board=${encodeURIComponent(a.asset_code)}"><div class="code">${esc(a.asset_code)}</div><h3>${esc(a.asset_name)}</h3><p>${esc(a.plant_room||'Coach House')}</p><span class="pill">${n?n+' circuits':(String(a.verification_status||'').includes('verified')?'Verified':'Recorded')}</span></a>`}).join('');status.hidden=true;canvas.hidden=false})();</script></body></html>
