<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electrical Schematic Maps</title><link rel="stylesheet" href="/assets/style.css?v=607"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js?v=20260901-auth2"></script><script defer src="/assets/site-sidebar.js"></script><style>:root{--g:#17372c;--cream:#f5f1e8;--card:#fff;--ink:#24332e;--muted:#72807b;--line:#8da99a;--border:#dedbd3;--gold:#c6a96a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.page{max-width:1180px;margin:auto;padding:14px}.head{background:var(--g);color:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(23,55,44,.12)}.head small{color:#d8c28c;font-size:9px;font-weight:900;letter-spacing:.08em}.head h1{margin:5px 0 5px;font:700 27px Georgia,serif}.head p{margin:0;color:#dce8e1;font-size:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.toolbar select,.toolbar button,.toolbar a{border:0;border-radius:10px;padding:9px 11px;background:#315746;color:#fff;font-weight:800;text-decoration:none;font-size:10px}.toolbar a.primary{background:var(--gold);color:var(--g)}.status{margin-top:14px;padding:11px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--muted);font-size:10px}.tree{margin-top:20px}.treeRoot{display:flex;flex-direction:column;align-items:center}.node{width:min(380px,100%);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;box-shadow:0 7px 18px rgba(23,55,44,.07);text-align:left}.node strong{display:block;color:var(--g);font-size:14px}.node small{display:block;color:var(--muted);margin-top:4px;line-height:1.35;font-size:9px}.node.root{border:2px solid #7ca28f;background:#f3f8f5}.node.board{border-color:#93ae9f;cursor:pointer}.node.board:after{content:'Tap to open';display:block;margin-top:7px;color:#557366;font-size:8px;font-weight:900}.node.board:active{transform:scale(.99)}.wire{width:3px;height:30px;background:var(--line)}.branches{width:100%;position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;padding-top:30px}.branches:before{content:"";position:absolute;left:5%;right:5%;top:13px;height:3px;background:var(--line)}.branch{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}.branch:before{content:"";position:absolute;top:-17px;left:50%;width:3px;height:17px;background:var(--line)}.section{margin-top:24px}.section h2{margin:0 0 10px;color:var(--g);font:700 19px Georgia,serif}.unmappedGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.unmapped{border-style:dashed;box-shadow:none}@media(max-width:650px){.page{padding:10px}.head{border-radius:15px;padding:15px}.head h1{font-size:23px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar select{grid-column:1/-1}.branches{grid-template-columns:1fr 1fr;gap:10px}.branches:before{left:10%;right:10%}.node{padding:10px}.node strong{font-size:12px}}@media(max-width:430px){.branches{grid-template-columns:1fr}.branches:before{display:none}.branch:before{height:14px;top:-14px}.toolbar{grid-template-columns:1fr}}</style></head><body><main class="page"><section class="head"><small>ELECTRICAL DISTRIBUTION</small><h1 id="title">Electrical schematic</h1><p>Supply hierarchy from mains incomer through panels and distribution boards.</p><div class="toolbar"><select id="building"></select><a href="/electrical-map.html">← Locations</a><a class="primary" href="/electrical-distribution.html">Electrical search</a></div></section><div id="status" class="status">Loading electrical register…</div><div id="map" hidden></div></main><script>(async()=>{const cfg=window.LIMEWOOD_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const sel=document.getElementById('building'),status=document.getElementById('status'),map=document.getElementById('map'),title=document.getElementById('title');const q=new URL(location.href).searchParams;const [br,pr]=await Promise.all([sb.from('buildings').select('id,name').order('name'),sb.from('plant_rooms').select('id,name,building_id')]);if(br.error||pr.error){status.textContent='Could not load building directory.';return}const buildings=br.data||[],rooms=pr.data||[];sel.innerHTML=buildings.map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');const requested=q.get('building');if(requested&&buildings.some(b=>b.name===requested))sel.value=requested;else if(buildings.some(b=>b.name==='Main House'))sel.value='Main House';function isStructure(a){return /incomer|incoming|intake|meter|main switch|switchboard|mcp|motor control|control panel|distribution board|\bdb\b|feeder/i.test((a.category||'')+' '+(a.asset_name||'')+' '+(a.system_duty||''))}function isClickable(a){return /switchboard|mcp|motor control|control panel|distribution board|\bdb\b|panel/i.test((a.category||'')+' '+(a.asset_name||''))}function refMatches(ref,a){const r=norm(ref);if(!r)return false;return [a.asset_code,a.asset_name].filter(Boolean).some(v=>{const n=norm(v);return n&&(r===n||r.includes(n)||n.includes(r))})}function rootRank(a){const t=norm((a.category||'')+' '+(a.asset_name||''));if(/incoming|incomer|intake/.test(t))return 0;if(/meter/.test(t))return 1;if(/main switch|switchboard/.test(t))return 2;if(/mcp|motor control|control panel/.test(t))return 3;if(/distribution board|\bdb\b/.test(t))return 4;return 5}function node(a,root=false){const click=isClickable(a);const cls=(root?'root ':'')+(click?'board':'');return `<div class="node ${cls}"${click?` data-board="${esc(a.asset_code||'')}"`:''}><strong>${esc([a.asset_code,a.asset_name].filter(Boolean).join(' · ')||'Unnamed electrical asset')}</strong><small>${esc(a.plant_room||'Location not recorded')}${a.voltage?' · '+esc(a.voltage):''}</small></div>`}async function load(){status.hidden=false;map.hidden=true;status.textContent='Loading electrical hierarchy…';const name=sel.value;title.textContent=name+' electrical schematic';history.replaceState(null,'','?building='+encodeURIComponent(name));const b=buildings.find(x=>x.name===name);const roomNames=rooms.filter(r=>String(r.building_id)===String(b?.id)).map(r=>r.name);if(!roomNames.length){status.textContent='No registered electrical locations for this building yet.';return}const ar=await sb.from('electrical_assets').select('asset_code,asset_name,plant_room,category,system_duty,distribution_board,upstream_supply,voltage').in('plant_room',roomNames).order('asset_code');if(ar.error){status.textContent=ar.error.message;return}const all=ar.data||[],assets=all.filter(isStructure);if(!assets.length){status.textContent='No mains, panels or distribution boards mapped for this building yet.';return}const childrenOf=parent=>assets.filter(a=>a!==parent&&(refMatches(a.upstream_supply,parent)||refMatches(a.distribution_board,parent)));const hasParent=a=>assets.some(p=>p!==a&&(refMatches(a.upstream_supply,p)||refMatches(a.distribution_board,p)));const seen=new Set();function renderTree(a,root=false,depth=0){const key=a.asset_code||a.asset_name;if(depth>10||seen.has(key))return node(a,root);seen.add(key);const kids=childrenOf(a).sort((x,y)=>rootRank(x)-rootRank(y)||String(x.asset_name||'').localeCompare(String(y.asset_name||'')));return `<div class="treeRoot">${node(a,root)}${kids.length?`<div class="wire"></div><div class="branches">${kids.map(k=>`<div class="branch">${renderTree(k,false,depth+1)}</div>`).join('')}</div>`:''}</div>`}let roots=assets.filter(a=>!hasParent(a)).sort((x,y)=>rootRank(x)-rootRank(y));if(!roots.length)roots=[assets.slice().sort((x,y)=>rootRank(x)-rootRank(y))[0]];seen.clear();map.innerHTML=roots.map(r=>`<div class="tree">${renderTree(r,true)}</div>`).join('');const unmapped=assets.filter(a=>!seen.has(a.asset_code||a.asset_name));if(unmapped.length)map.innerHTML+=`<section class="section"><h2>Not yet connected</h2><div class="unmappedGrid">${unmapped.map(a=>`<div class="node unmapped"><strong>${esc([a.asset_code,a.asset_name].filter(Boolean).join(' · '))}</strong><small>${esc(a.plant_room||'Location not recorded')}</small></div>`).join('')}</div></section>`;status.hidden=true;map.hidden=false}sel.addEventListener('change',load);map.addEventListener('click',e=>{const n=e.target.closest('[data-board]');if(!n)return;location.href='/electrical-board-circuits.html?board='+encodeURIComponent(n.dataset.board)});await load()})();</script></body></html>
