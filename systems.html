<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17372c"><title>Limewood Building Dashboard</title><link rel="stylesheet" href="/assets/style.css?v=607"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js"></script><style>body{margin:0;background:#f4f0e7;color:#1f2925;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#0d3026;color:#fff}.mark{width:52px;height:52px;border-radius:12px;background:#d6b36a;color:#17372c;display:grid;place-items:center;font:900 24px Georgia}.brand{flex:1}.brand b{display:block;font-size:18px}.brand span{color:#cbd7d1;font-size:13px}.top button{background:transparent;color:#fff;border:1px solid #ffffff45;border-radius:10px;padding:11px 15px;font-weight:800}.shell{width:min(1220px,calc(100% - 28px));margin:auto;padding:30px 0 50px}.hero{background:linear-gradient(135deg,#17372c,#285746);border-radius:24px;padding:28px;color:#fff}.eyebrow{color:#e7c77f;font-size:11px;font-weight:900;letter-spacing:.16em}.hero h1{font:700 clamp(38px,5vw,58px) Georgia;margin:8px 0 10px}.hero p{margin:0;color:#dce6e1;font-size:16px}.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin:20px 0 10px;background:#fff;border:1px solid #d6d8d3;border-radius:18px;padding:12px;box-shadow:0 8px 24px #17372c12}.search input{border:0;background:#f7f6f1;border-radius:12px;padding:15px;font-size:16px;outline:none}.search button{border:0;border-radius:12px;background:#17372c;color:#fff;font-weight:900;padding:0 22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 30px}.stats article{background:#fff;border:1px solid #d8ddd7;border-radius:18px;padding:20px;text-align:center}.stats b{display:block;color:#17372c;font-size:30px}.stats span{color:#68736e;font-size:13px}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:8px 0 12px}.sectionHead h2{font:700 28px Georgia;margin:0;color:#17372c}.sectionHead span{font-size:12px;color:#777}.locations{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.loc{background:#fff;border:1px solid #d8ddd7;border-radius:14px;padding:14px 18px;text-align:left;color:#17372c;cursor:pointer}.loc b{display:block;font-size:16px}.loc small{color:#777}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.action{display:block;background:#fff;border:1px solid #d8ddd7;border-radius:20px;padding:22px;text-decoration:none;color:#1f2925;min-height:125px}.action span{font-size:27px}.action b{display:block;margin:12px 0 4px;font-size:17px;color:#17372c}.action small{color:#68736e}.results{display:none;margin-top:18px}.results.show{display:block}.result{display:block;background:#fff;border:1px solid #d8ddd7;border-radius:12px;padding:12px;margin:7px 0;text-decoration:none;color:#1f2925}.result b{color:#17372c}.result small{display:block;color:#777;margin-top:4px}.empty{padding:20px;background:#fff;border:1px dashed #bbb;border-radius:12px;color:#777}.hidden{display:none!important}@media(max-width:800px){.stats,.actions{grid-template-columns:repeat(2,1fr)}.locations{grid-template-columns:1fr 1fr}}@media(max-width:520px){.shell{width:min(100% - 16px,1220px);padding-top:12px}.top{padding:10px}.stats,.actions,.locations{grid-template-columns:1fr}.search{grid-template-columns:1fr}.search button{padding:13px}.hero{padding:20px}}</style></head><body><header class="top"><div class="mark">LW</div><div class="brand"><b>Limewood Engineering</b><span>Estate technical control centre</span></div><button onclick="location.href='/'">Dashboard</button></header><main class="shell"><section class="hero"><span class="eyebrow">BUILDING HUB</span><h1 id="title">Loading…</h1><p id="subtitle">Search rooms, locations and assets across this building.</p></section><div class="search"><input id="search" placeholder="Search this building"><button id="searchBtn">Search</button></div><section class="stats"><article><b id="assetCount">0</b><span>Assets</span></article><article><b id="locationCount">0</b><span>Locations</span></article><article><b id="photoCount">0</b><span>Photos</span></article><article><b id="plantCount">0</b><span>Plant rooms</span></article></section><section id="locationSection"><div class="sectionHead"><h2>Locations</h2><span id="locationHint"></span></div><div id="locations" class="locations"></div></section><section id="results" class="results"></section><section id="actions" class="actions"></section></main><script>(async()=>{'use strict';const q=new URLSearchParams(location.search),view=q.get('view')||'Main House',kind=q.get('kind')||'location',cfg=window.LIMEWOOD_CONFIG||{},sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(kind!=='location'){location.replace('/?system='+encodeURIComponent(view));return}const {data:session}=await sb.auth.getSession();if(!session.session){location.href='/';return}$('title').textContent=view;$('subtitle').textContent=`Search rooms, locations and assets across ${view}.`;$('search').placeholder=`Search ${view}… e.g. boiler, pump, lighting, room`;
const [br,pr,ar,ph,areas,subs]=await Promise.all([sb.from('buildings').select('id,name'),sb.from('plant_rooms').select('id,name,building_id'),sb.from('assets').select('id,asset_code,asset_name,building_id,plant_room_id,area_id,sub_area_id,exact_location,category,system_duty,manufacturer,model,notes'),sb.from('asset_photos').select('id,asset_id'),sb.from('areas').select('id,name,building_id'),sb.from('sub_areas').select('id,name,area_id')]);const buildings=br.data||[],rooms=pr.data||[],assets=ar.data||[],photos=ph.data||[],areaRows=areas.data||[],subRows=subs.data||[];const building=buildings.find(b=>norm(b.name)===norm(view));const bid=building?.id;const roomIds=new Set(rooms.filter(r=>String(r.building_id)===String(bid)).map(r=>String(r.id)));const scoped=assets.filter(a=>String(a.building_id)===String(bid)||roomIds.has(String(a.plant_room_id)));const assetIds=new Set(scoped.map(a=>String(a.id)));const scopedPhotos=photos.filter(p=>assetIds.has(String(p.asset_id)));const roomRows=rooms.filter(r=>String(r.building_id)===String(bid));const buildingAreas=areaRows.filter(a=>String(a.building_id)===String(bid));const areaIds=new Set(buildingAreas.map(a=>String(a.id)));const buildingSubs=subRows.filter(s=>areaIds.has(String(s.area_id)));const exact=[...new Set(scoped.map(a=>String(a.exact_location||'').trim()).filter(Boolean))];const locationNames=[...new Set([...buildingAreas.map(x=>x.name),...buildingSubs.map(x=>x.name),...roomRows.map(x=>x.name),...exact].filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));$('assetCount').textContent=scoped.length;$('locationCount').textContent=locationNames.length;$('photoCount').textContent=scopedPhotos.length;$('plantCount').textContent=roomRows.length;$('locationHint').textContent=`Choose an area of ${view}`;
function locCount(name){const n=norm(name);return scoped.filter(a=>{const r=rooms.find(x=>String(x.id)===String(a.plant_room_id))?.name||'',aa=areaRows.find(x=>String(x.id)===String(a.area_id))?.name||'',ss=subRows.find(x=>String(x.id)===String(a.sub_area_id))?.name||'';return[norm(r),norm(aa),norm(ss),norm(a.exact_location)].includes(n)}).length}$('locations').innerHTML=locationNames.length?locationNames.slice(0,18).map(n=>`<button class="loc" data-loc="${esc(n)}"><b>${esc(n)}</b><small>${locCount(n)} linked asset${locCount(n)===1?'':'s'}</small></button>`).join(''):'<div class="empty">No locations registered for this building yet.</div>';
const hrefView=encodeURIComponent(view);$('actions').innerHTML=`<a class="action" href="#" data-action="search"><span>🔎</span><b>Rooms & Assets</b><small>Search the whole building</small></a><a class="action" href="/?building=${hrefView}&view=plantrooms"><span>🏭</span><b>Plant Rooms</b><small>Engineering plant-room hubs</small></a><a class="action" href="/electrical-schematic-map.html?building=${hrefView}"><span>⚡</span><b>Electrical</b><small>Distribution and circuits</small></a><a class="action" href="/drawings-schematics.html?building=${hrefView}"><span>🗺</span><b>Schematics</b><small>Drawings and system maps</small></a><a class="action" href="/?building=${hrefView}&view=documents"><span>📚</span><b>Documents</b><small>SOPs, RAMS and manuals</small></a><a class="action" href="/maintenance-dashboard.html?building=${hrefView}"><span>🧰</span><b>Maintenance</b><small>Jobs and engineering work</small></a><a class="action" href="/?building=${hrefView}&view=compliance"><span>🛡</span><b>Compliance</b><small>Evidence and review status</small></a><a class="action" href="/?building=${hrefView}&view=bms"><span>🟢</span><b>Live BMS</b><small>Open Niagara controls</small></a>`;
function hay(a){const r=rooms.find(x=>String(x.id)===String(a.plant_room_id))?.name||'',aa=areaRows.find(x=>String(x.id)===String(a.area_id))?.name||'',ss=subRows.find(x=>String(x.id)===String(a.sub_area_id))?.name||'';return norm([a.asset_code,a.asset_name,a.category,a.system_duty,a.manufacturer,a.model,a.exact_location,a.notes,r,aa,ss].join(' '))}function renderSearch(raw){const s=norm(raw);if(!s){$('results').classList.remove('show');$('locationSection').classList.remove('hidden');$('actions').classList.remove('hidden');return}const terms=s.split(' ').filter(Boolean),found=scoped.filter(a=>terms.every(t=>hay(a).includes(t))).slice(0,100);$('locationSection').classList.add('hidden');$('actions').classList.add('hidden');$('results').classList.add('show');$('results').innerHTML=`<div class="sectionHead"><h2>Search results</h2><span>${found.length} match${found.length===1?'':'es'}</span></div>`+(found.length?found.map(a=>{const r=rooms.find(x=>String(x.id)===String(a.plant_room_id))?.name||'';return`<a class="result" href="/?asset=${encodeURIComponent(a.asset_code||'')}"><b>${esc(a.asset_code||'Asset')} · ${esc(a.asset_name||'Unnamed asset')}</b><small>${esc([r,a.exact_location,a.category].filter(Boolean).join(' · '))}</small></a>`}).join(''):'<div class="empty">No matching assets in this building.</div>')}$('searchBtn').onclick=()=>renderSearch($('search').value);$('search').addEventListener('keydown',e=>{if(e.key==='Enter')renderSearch(e.target.value)});$('locations').addEventListener('click',e=>{const b=e.target.closest('[data-loc]');if(b){$('search').value=b.dataset.loc;renderSearch(b.dataset.loc)}});$('actions').addEventListener('click',e=>{const a=e.target.closest('[data-action="search"]');if(a){e.preventDefault();$('search').focus()}})})();</script></body></html>
