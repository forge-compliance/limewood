name: One-time PPM building directory repair

on:
  push:
    paths:
      - '.github/workflows/fix-ppm-structure.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair PPM building directory source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('assets/ppm-directory-search.js')
          s = p.read_text(encoding='utf-8')

          anchor = '''function roomDetail(room){
  const src=sourceRooms.find(x=>x.room===room);
  if(!src)return '';
  const tmp=document.createElement('div');tmp.innerHTML=src.html;
  return tmp.querySelector('small')?.textContent||'';
}
'''
          insert = anchor + '''
function synthesizeSourceRooms(){
  const scheduledCodes=new Set(schedules.map(s=>s.asset_code).filter(Boolean));
  const counts=new Map();
  assets.forEach(a=>{
    if(!scheduledCodes.has(a.asset_code))return;
    const room=(roomNameFromAsset(a)||'').trim();
    if(!room)return;
    counts.set(room,(counts.get(room)||0)+1);
  });
  sourceRooms=[...counts.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([room,count])=>({
    room,
    html:`<div><b>${esc(room)}</b><small>${count} PPM${count===1?'':'s'}</small></div>`
  }));
  return sourceRooms.length>0;
}
'''
          if 'function synthesizeSourceRooms()' not in s:
              if anchor not in s:
                  raise SystemExit('roomDetail anchor not found')
              s=s.replace(anchor,insert,1)

          old = '''  buildings=b.data||[];plantRooms=p.data||[];areas=a.data||[];subAreas=sa.data||[];assets=as.data||[];schedules=pp.data||[];
  if(captureOriginalRooms())renderSmartDirectory();
'''
          new = '''  buildings=b.data||[];plantRooms=p.data||[];areas=a.data||[];subAreas=sa.data||[];assets=as.data||[];schedules=pp.data||[];
  if(!captureOriginalRooms())synthesizeSourceRooms();
  renderSmartDirectory();
'''
          if old not in s:
              raise SystemExit('loadReferenceData anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          app=Path('app.js')
          a=app.read_text(encoding='utf-8')
          a=a.replace('ppm-directory-search.js?v=20260902-3','ppm-directory-search.js?v=20260902-4')
          app.write_text(a,encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "forge-compliance"
          git config user.email "gphewett@gmail.com"
          git add assets/ppm-directory-search.js app.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "[ppm-fix] render buildings from live PPM data"
          git push
