<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Barn Electrical Groups</title><link rel="stylesheet" href="/assets/style.css?v=20260830-10"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js?v=20260901-auth2"></script><script defer src="/assets/site-sidebar.js?v=20260830-2"></script><style>:root{--g:#173d33;--gold:#c6a96a;--cream:#f4f0e8;--muted:#6f7b76}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1f2b27;font-family:Arial,Helvetica,sans-serif}.top{background:var(--g);color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:8px}.bolt{width:34px;height:34px;border-radius:9px;background:#54230a;color:#ffd46a;display:grid;place-items:center;font-size:19px}.brand h1{font:700 19px Georgia,serif;margin:0}.brand small{font-size:9px;opacity:.72}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff35;background:#ffffff12;padding:8px;border-radius:8px;font-weight:800}.page{max-width:900px;margin:auto;padding:8px}.intro h2{margin:4px 0;color:var(--g);font-size:19px}.intro p{margin:0 0 10px;color:var(--muted);font-size:10px}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.group{background:#fff;border:1px solid #d8d3ca;border-radius:12px;padding:12px;text-decoration:none;color:inherit}.group h3{margin:0;color:var(--g);font-size:14px}.group p{margin:5px 0 0;color:var(--muted);font-size:9px}.group .count{display:inline-block;margin-top:8px;background:#e9efec;color:var(--g);font-weight:900;font-size:8px;padding:4px 7px;border-radius:999px}.list{margin-top:10px;display:grid;gap:7px}.item{display:block;background:#fff;border:1px solid #d8d3ca;border-radius:11px;padding:10px;text-decoration:none;color:inherit}.item b{display:block;color:var(--g);font-size:12px}.item small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.back{display:inline-block;margin:8px 0 12px;color:var(--g);font-weight:900;text-decoration:none;font-size:10px}@media(max-width:520px){.groups{grid-template-columns:1fr}.page{padding:6px}}</style></head><body><header class="top"><div class="brand"><div class="bolt">⚡</div><div><h1>Barn Electrical</h1><small>Grouped circuits and supplies</small></div></div><a href="/electrical-schematic-map.html?building=Barn">← Barn</a></header><main class="page"><section class="intro"><h2 id="title">Circuit groups</h2><p id="sub">Choose a group, then select the circuit or supply you need.</p></section><a id="backGroups" class="back" href="/barn-electrical-groups.html" hidden>← All Barn groups</a><div id="content"></div></main><script>(async()=>{'use strict';const cfg=window.LIMEWOOD_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const p=new URLSearchParams(location.search),chosen=p.get('group');const groups={buggy:{title:'Buggy Chargers',match:a=>/^GB-C-01[5-8]$/.test(a.asset_code||'')},lighting:{title:'Lighting',match:a=>/^GB-C-00[4-7]$/.test(a.asset_code||'')||a.asset_code==='GB-E-010'},power:{title:'Sockets & Small Power',match:a=>['GB-C-001','GB-C-008','GB-C-009','GB-C-010','GB-E-008'].includes(a.asset_code)},alarms:{title:'Alarms & Monitoring',match:a=>['GB-C-003','GB-E-003','GB-E-004','GB-E-005','GB-E-006','GB-E-007','GB-E-009'].includes(a.asset_code)},external:{title:'External & Site Supplies',match:a=>['GB-C-012','GB-C-013','GB-C-014','GB-C-019','GB-C-020'].includes(a.asset_code)},plant:{title:'Plant & Refrigeration',match:a=>['GB-C-011','GB-E-008','GB-E-009'].includes(a.asset_code)}};const r=await sb.from('electrical_assets').select('asset_code,asset_name,plant_room,category,verification_status').like('asset_code','GB-%').order('asset_code');const all=r.error?[]:(r.data||[]);const content=document.getElementById('content');if(!chosen||!groups[chosen]){content.className='groups';content.innerHTML=Object.entries(groups).map(([k,g])=>{const n=all.filter(g.match).length;return `<a class="group" href="?group=${k}"><h3>${g.title}</h3><p>Open the grouped Barn circuits and supplies.</p><span class="count">${n} item${n===1?'':'s'}</span></a>`}).join('');return}const g=groups[chosen],items=all.filter(g.match);document.getElementById('title').textContent=g.title;document.getElementById('sub').textContent='Select the circuit or supply you need.';document.getElementById('backGroups').hidden=false;content.className='list';content.innerHTML=items.length?items.map(a=>`<a class="item" href="/electrical-distribution.html?asset=${encodeURIComponent(a.asset_code)}"><b>${a.asset_code} · ${a.asset_name}</b><small>${a.plant_room||'Barn Plant Room'} · ${a.verification_status||'Recorded'}</small></a>`).join(''):'<div class="item">No matching records.</div>'})();</script></body></html>
