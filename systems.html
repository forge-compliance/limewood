<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17372c">
<title>Limewood Engineering Systems</title><link rel="stylesheet" href="/assets/style.css?v=601">
<style>body{margin:0;background:#f4f0e7;color:#1f2925;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.sysTop{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#17372c;color:#fff}.sysTop .mark{width:40px;height:40px;display:grid;place-items:center;background:#d6b36a;color:#17372c;border-radius:11px;font-weight:900}.sysTop div:nth-child(2){flex:1}.sysTop b{display:block}.sysTop small{color:#cbd7d1}.sysTop button{background:transparent;color:#fff;border:1px solid #ffffff40;border-radius:10px;padding:9px 12px}.sysShell{width:min(1200px,calc(100% - 24px));margin:auto;padding:20px 0 48px}.sysHero{padding:24px;border-radius:20px;background:linear-gradient(135deg,#17372c,#285746);color:#fff}.sysHero span{color:#e7cc94;font-size:11px;font-weight:900;letter-spacing:.15em}.sysHero h1{margin:7px 0 8px;font-family:Georgia,serif;font-size:clamp(30px,5vw,48px)}.sysHero p{margin:0;color:#d7e1dc;line-height:1.55}.sysTools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.sysTools input{flex:1;min-width:220px;padding:12px;border:1px solid #ccd3ce;border-radius:11px}.sysTools button,.sysCard a{padding:11px 14px;border:0;border-radius:11px;background:#17372c;color:#fff;font-weight:800;text-decoration:none}.sysStats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.sysStats article,.sysCard{padding:16px;background:#fff;border:1px solid #d8ddd7;border-radius:14px}.sysStats b{display:block;font-size:26px;color:#17372c}.sysStats span,.sysCard p{font-size:12px;color:#66716c}.sysGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sysCard h3{margin:6px 0 8px}.sysCard .badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8efe9;color:#285746;font-size:11px;font-weight:900}.sysCard a{display:inline-block;margin-top:10px}.empty{grid-column:1/-1;padding:32px;background:#fff;border:1px dashed #b8c1bc;border-radius:15px;text-align:center}.locationActions{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.locationActions a{display:block;padding:22px;background:#fff;border:1px solid #d8ddd7;border-radius:15px;text-decoration:none;color:#1f2925}.locationActions .primaryLink{background:#17372c;color:#fff}@media(max-width:800px){.sysGrid,.sysStats{grid-template-columns:1fr 1fr}.locationActions{grid-template-columns:1fr}}@media(max-width:600px){.sysGrid{grid-template-columns:1fr}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js"></script></head><body>
<header class="sysTop"><div class="mark">LW</div><div><b>Limewood Engineering</b><small>Estate technical control centre</small></div><button onclick="location.href='/'">Dashboard</button></header><main class="sysShell"><section class="sysHero"><span>ENGINEERING SYSTEM VIEW</span><h1 id="title">Loading…</h1><p id="subtitle">Connecting to the estate database.</p></section><div class="sysTools" id="tools"><input id="search" placeholder="Search this view"><button id="refresh">Refresh</button></div><section class="sysStats"><article><b id="count">0</b><span>Matching records</span></article><article><b id="photoCount">0</b><span>Photos</span></article><article><b id="status">…</b><span>Database</span></article></section><section id="content" class="sysGrid"></section></main>
<script>(()=>{'use strict';const cfg=window.LIMEWOOD_CONFIG||{},client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),qs=new URLSearchParams(location.search),view=qs.get('view')||'Engineering Systems',kind=qs.get('kind')||'system',room=qs.get('room')||'',showList=qs.get('list')==='1',$=id=>document.getElementById(id);$('title').textContent=view;const TERMS={'Water Systems':['water','cws','hws','dhw','tmv','booster','water treatment','cold water','hot water'],'Heating Systems':['heating','boiler','lthw','calorifier','heat exchanger','pressurisation','radiator'],'Chilled Water Systems':['chilled','chw','chiller','cooling'],'Lighting':['lighting','light','dimmer','emergency lighting'],'Fire & Life Safety':['fire','alarm','sprinkler','smoke','emergency lighting','life safety'],'Pool & Spa Water Treatment':['pool','spa','dosing','chlorine','bromine','ph','water treatment','filter','backwash']};let assets=[],photos=[],buildings=[],plantRooms=[];function text(a){return[a.asset_code,a.asset_name,a.category,a.system_duty,a.manufacturer,a.model,a.serial_number,a.exact_location,a.notes].join(' ').toLowerCase()}function locationText(a){const b=buildings.find(x=>x.id===a.building_id)?.name||'',p=plantRooms.find(x=>x.id===a.plant_room_id)?.name||'';return[b,p,a.exact_location,a.asset_name,a.notes].join(' ').toLowerCase()}function poolSpaMatch(a){const t=text(a),cat=String(a.category||'').toLowerCase(),duty=String(a.system_duty||'').toLowerCase(),name=String(a.asset_name||'').toLowerCase();const strong=['pool','hydro','chlorine','bromine','dosing','backwash','water treatment','pool filter','spa filter'];if(strong.some(x=>[cat,duty,name].join(' ').includes(x)))return true;const spaPlant=locationText(a).includes('spa plant');const waterEquipment=['filter','pump','dosing','chemical','water','tank','uv','heat exchanger'].some(x=>[cat,duty,name].join(' ').includes(x));return spaPlant&&waterEquipment}function matching(){let list=assets.slice();if(kind==='location')list=list.filter(a=>locationText(a).includes(view.toLowerCase()));else if(view==='Pool & Spa Water Treatment')list=list.filter(poolSpaMatch);else if(TERMS[view])list=list.filter(a=>TERMS[view].some(t=>text(a).includes(t)));if(room)list=list.filter(a=>locationText(a).includes(room.toLowerCase()));const q=$('search').value.trim().toLowerCase();if(q)list=list.filter(a=>text(a).includes(q)||locationText(a).includes(q));return list}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function card(a){const b=buildings.find(x=>x.id===a.building_id)?.name||'',p=plantRooms.find(x=>x.id===a.plant_room_id)?.name||'',pc=photos.filter(x=>x.asset_id===a.id).length;return`<article class="sysCard"><span class="badge">${esc(a.asset_code||'Asset')}</span><h3>${esc(a.asset_name||'Unnamed asset')}</h3><p>${esc([b,p,a.exact_location].filter(Boolean).join(' · ')||'Location not set')}</p><p>${esc([a.manufacturer,a.model].filter(Boolean).join(' ')||a.category||'')}</p><p>${pc} photo${pc===1?'':'s'}</p><a href="/?asset=${encodeURIComponent(a.asset_code||'')}">Open asset</a></article>`}function renderAssets(){$('subtitle').textContent=kind==='location'?`Filtered asset register for ${view}.`:`Live asset register filtered for ${view}.`;const list=matching();$('count').textContent=list.length;$('photoCount').textContent=photos.filter(p=>list.some(a=>a.id===p.asset_id)).length;$('content').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No matching assets yet.</div>'}async function load(){try{const{data:{session}}=await client.auth.getSession();if(!session){location.href='/?return='+encodeURIComponent(location.href);return}const[a,b,p,ph]=await Promise.all([client.from('assets').select('*').order('asset_code'),client.from('buildings').select('*').order('name'),client.from('plant_rooms').select('*').order('name'),client.from('asset_photos').select('*').order('created_at',{ascending:false})]);const err=a.error||b.error||p.error||ph.error;if(err)throw err;assets=a.data||[];buildings=b.data||[];plantRooms=p.data||[];photos=ph.data||[];$('status').textContent='Live';renderAssets()}catch(e){$('status').textContent='Error';$('content').innerHTML=`<div class="empty">Could not load this view: ${esc(e.message||e)}</div>`}}$('search').addEventListener('input',renderAssets);$('refresh').onclick=load;load()})();</script></body></html>
