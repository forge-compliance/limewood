name: Limewood Engineer Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-engineer/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-engineer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Limewood-Engineer-APK
          path: android-engineer/app/build/outputs/apk/debug/app-debug.apk
