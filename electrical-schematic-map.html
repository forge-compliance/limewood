<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electrical Schematic Maps</title><link rel="stylesheet" href="/assets/style.css?v=607"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js?v=20260901-auth2"></script><script defer src="/assets/site-sidebar.js"></script><style>:root{--g:#17372c;--g2:#245647;--cream:#f5f1e8;--card:#fff;--ink:#24332e;--muted:#72807b;--line:#8da99a;--border:#dedbd3;--soft:#f8f7f3;--gold:#c6a96a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.page{max-width:1180px;margin:auto;padding:14px}.head{background:var(--g);color:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(23,55,44,.12)}.head small{color:#d8c28c;font-size:9px;font-weight:900;letter-spacing:.08em}.head h1{margin:5px 0 5px;font:700 27px Georgia,serif}.head p{margin:0;color:#dce8e1;font-size:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.toolbar select,.toolbar button,.toolbar a{border:0;border-radius:10px;padding:9px 11px;background:#315746;color:#fff;font-weight:800;text-decoration:none;font-size:10px}.toolbar a.primary{background:var(--gold);color:var(--g)}.status,.note{margin-top:14px;padding:11px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--muted);font-size:10px}.tree{margin-top:18px}.treeRoot{display:flex;flex-direction:column;align-items:center}.node{width:min(390px,100%);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:0 7px 18px rgba(23,55,44,.07);text-align:left}.node strong{display:block;color:var(--g);font-size:14px}.node small{display:block;color:var(--muted);margin-top:4px;line-height:1.35;font-size:9px}.node.root{border:2px solid #7ca28f;background:#f3f8f5}.node.board{border-color:#93ae9f}.node.load{background:#fff}.node.unmapped{border-style:dashed;box-shadow:none}.wire{width:3px;height:28px;background:var(--line)}.branches{width:100%;position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;padding-top:28px}.branches:before{content:"";position:absolute;left:5%;right:5%;top:12px;height:3px;background:var(--line)}.branch{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}.branch:before{content:"";position:absolute;top:-16px;left:50%;width:3px;height:16px;background:var(--line)}.circuit{font-size:9px;font-weight:900;color:#557366;margin-bottom:6px;text-align:center}.childTree{width:100%;display:flex;flex-direction:column;align-items:center}.section{margin-top:24px}.section h2{margin:0 0 10px;color:var(--g);font:700 19px Georgia,serif}.unmappedGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.legend span{background:#edf2ef;color:#567064;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:800}@media(max-width:650px){.page{padding:10px}.head{border-radius:15px;padding:15px}.head h1{font-size:23px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar select{grid-column:1/-1}.branches{grid-template-columns:1fr 1fr;gap:10px}.branches:before{left:10%;right:10%}.node{padding:10px}.node strong{font-size:12px}}@media(max-width:430px){.branches{grid-template-columns:1fr}.branches:before{display:none}.branch:before{height:14px;top:-14px}.toolbar{grid-template-columns:1fr}}</style></head><body><main class="page"><section class="head"><small>ELECTRICAL SCHEMATIC · LIVE REGISTER</small><h1 id="title">Electrical schematic</h1><p>Follow the supply from the top down. Known feeds are connected. Unknown feeds stay unconnected.</p><div class="toolbar"><select id="building"></select><button id="refresh">Refresh</button><a href="/electrical-map.html">All locations</a><a class="primary" href="/electrical-distribution.html">Electrical search</a></div><div class="legend"><span>Solid line = registered feed</span><span>Dashed card = feed not mapped</span></div></section><div id="status" class="status">Loading electrical register…</div><div id="map" hidden></div></main><script>(async()=>{const cfg=window.LIMEWOOD_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const sel=document.getElementById('building'),status=document.getElementById('status'),map=document.getElementById('map'),title=document.getElementById('title');const q=new URL(location.href).searchParams;const [br,pr]=await Promise.all([sb.from('buildings').select('id,name').order('name'),sb.from('plant_rooms').select('id,name,building_id')]);if(br.error||pr.error){status.textContent='Could not load building directory.';return}const buildings=br.data||[],rooms=pr.data||[];sel.innerHTML=buildings.map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');const requested=q.get('building');if(requested&&buildings.some(b=>b.name===requested))sel.value=requested;else if(buildings.some(b=>b.name==='Main House'))sel.value='Main House';function node(a,cls='load'){return `<div class="node ${cls}"><strong>${esc([a.asset_code,a.asset_name].filter(Boolean).join(' · ')||'Unnamed electrical asset')}</strong><small>${esc(a.plant_room||'Location not recorded')}${a.voltage?' · '+esc(a.voltage):''}${a.device_rating?' · '+esc(a.device_rating):''}</small>${a.circuit_reference?`<small>Circuit: ${esc(a.circuit_reference)}</small>`:''}</div>`}function isBoard(a){return /distribution board|control panel|mcp|panel|switchboard|intake|meter|feeder/i.test((a.category||'')+' '+(a.asset_name||''))}function refMatches(ref,a){const r=norm(ref);if(!r)return false;return [a.asset_code,a.asset_name].filter(Boolean).some(v=>{const n=norm(v);return n&&r.includes(n)})}async function load(){status.hidden=false;map.hidden=true;status.textContent='Loading electrical register…';const name=sel.value;title.textContent=name+' electrical schematic';history.replaceState(null,'','?building='+encodeURIComponent(name));const b=buildings.find(x=>x.name===name);const roomNames=rooms.filter(r=>String(r.building_id)===String(b?.id)).map(r=>r.name);if(!roomNames.length){status.textContent='No registered electrical locations for this building yet.';return}const ar=await sb.from('electrical_assets').select('asset_code,asset_name,plant_room,category,distribution_board,circuit_reference,upstream_supply,phase,voltage,protective_device,device_rating,isolation_point,verification_status').in('plant_room',roomNames).order('asset_code');if(ar.error){status.textContent=ar.error.message;return}const assets=ar.data||[];if(!assets.length){status.textContent='No electrical assets registered for this building yet.';return}const keys=[...new Set(assets.filter(isBoard).flatMap(a=>[a.asset_code,a.asset_name]).filter(Boolean))];let circuits=[];if(keys.length){const cr=await sb.from('electrical_circuits').select('board_asset_code,circuit_number,circuit_description,phase,protective_device,device_rating,destination,verification_status').in('board_asset_code',keys).order('board_asset_code').order('circuit_number');if(!cr.error)circuits=cr.data||[]}const childrenOf=parent=>assets.filter(a=>a!==parent&&(refMatches(a.upstream_supply,parent)||refMatches(a.distribution_board,parent)));const circuitsOf=parent=>circuits.filter(c=>[parent.asset_code,parent.asset_name].filter(Boolean).some(k=>norm(c.board_asset_code)===norm(k)));const seen=new Set();function renderTree(a,root=false,depth=0){if(depth>8||seen.has(a.asset_code||a.asset_name))return node(a,isBoard(a)?'board':'load');seen.add(a.asset_code||a.asset_name);const kids=childrenOf(a),cs=circuitsOf(a);const usedKids=new Set();const branches=[];for(const c of cs){const txt=norm((c.circuit_description||'')+' '+(c.destination||''));const linked=kids.find(k=>{const kn=norm((k.asset_name||'')+' '+(k.asset_code||''));return kn&&txt&&(txt.includes(kn)||kn.includes(txt))});if(linked)usedKids.add(linked.asset_code||linked.asset_name);branches.push(`<div class="branch"><div class="circuit">${esc(c.circuit_number||'No ref')}${c.phase?' · '+esc(c.phase):''}${c.device_rating?' · '+esc(c.device_rating):''}</div><div class="childTree">${linked?renderTree(linked,false,depth+1):`<div class="node load"><strong>${esc(c.circuit_description||c.destination||'Unnamed outgoing')}</strong><small>${esc([c.protective_device,c.device_rating].filter(Boolean).join(' · ')||c.verification_status||'Registered circuit')}</small></div>`}</div></div>`)}for(const k of kids.filter(k=>!usedKids.has(k.asset_code||k.asset_name)))branches.push(`<div class="branch"><div class="circuit">${esc(k.circuit_reference||'Registered feed')}</div><div class="childTree">${renderTree(k,false,depth+1)}</div></div>`);return `<div class="treeRoot">${node(a,root?'root':isBoard(a)?'board':'load')}${branches.length?`<div class="wire"></div><div class="branches">${branches.join('')}</div>`:''}</div>`}const hasParent=a=>assets.some(p=>p!==a&&(refMatches(a.upstream_supply,p)||refMatches(a.distribution_board,p)));let roots=assets.filter(a=>isBoard(a)&&!hasParent(a));if(!roots.length)roots=assets.filter(a=>!hasParent(a));if(!roots.length)roots=[assets[0]];seen.clear();const trees=roots.map(r=>`<div class="tree">${renderTree(r,true,0)}</div>`).join('');const connected=new Set([...seen]);const unmapped=assets.filter(a=>!connected.has(a.asset_code||a.asset_name));map.innerHTML=trees+(unmapped.length?`<section class="section"><h2>Still to map</h2><div class="unmappedGrid">${unmapped.map(a=>node(a,'unmapped')).join('')}</div></section>`:'');status.hidden=true;map.hidden=false}sel.addEventListener('change',load);document.getElementById('refresh').addEventListener('click',load);await load()})();</script></body></html>
