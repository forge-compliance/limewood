<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Electrical Map</title><link rel="stylesheet" href="/assets/style.css?v=20260901-map3"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js?v=20260901-auth2"></script><script defer src="/assets/site-sidebar.js"></script><style>:root{--g:#17372c;--cream:#f5f1e8;--ink:#24332e;--muted:#72807b;--line:#dedbd3;--gold:#c6a96a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial}.page{max-width:980px;margin:auto;padding:8px}.hero{background:var(--g);color:#fff;border-radius:13px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;gap:10px}.heroTitle small{display:block;color:#d7c28d;font-size:7px;font-weight:900;letter-spacing:.09em}.heroTitle h1{margin:2px 0 0;font-size:20px}.heroActions{display:flex;gap:5px}.heroActions a{padding:7px 8px;border-radius:8px;text-decoration:none;font-size:8px;font-weight:900;background:#ffffff1a;color:#fff;white-space:nowrap}.heroActions a.primary{background:var(--gold);color:var(--g)}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:3px 2px 5px}.sectionHead h2{margin:0;color:var(--g);font-size:14px}.sectionHead span{color:var(--muted);font-size:7px}.locationGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.locationBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 9px;min-height:54px;text-align:left;box-shadow:0 3px 9px #17372c0b;cursor:pointer;overflow:hidden}.locationBtn b{display:block;color:var(--g);font-size:11px;line-height:1.05;white-space:normal}.locationBtn span{display:block;margin-top:4px;color:var(--muted);font-size:7px}.locationBtn:active{transform:scale(.98)}.loading{padding:15px;text-align:center;color:var(--muted);font-size:9px}@media(max-width:700px){.locationGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:520px){.page{padding:5px}.hero{padding:8px 9px;border-radius:10px;margin-bottom:5px}.heroTitle h1{font-size:17px}.heroTitle small{font-size:6px}.heroActions{gap:3px}.heroActions a{font-size:7px;padding:6px}.sectionHead{margin-bottom:4px}.sectionHead h2{font-size:12px}.locationGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.locationBtn{padding:6px;min-height:45px;border-radius:8px}.locationBtn b{font-size:9px}.locationBtn span{font-size:6px;margin-top:2px}}@media(max-width:360px){.locationGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main class="page"><section class="hero"><div class="heroTitle"><small>ELECTRICAL DISTRIBUTION</small><h1>Electrical Map</h1></div><div class="heroActions"><a class="primary" href="/electrical-distribution.html">← Distribution</a><a href="/">Dashboard</a></div></section><div class="sectionHead"><h2>Locations</h2><span>Tap to open schematic</span></div><div id="locations" class="locationGrid"><div class="loading">Loading…</div></div></main><script>(async()=>{const cfg=window.LIMEWOOD_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const box=document.getElementById('locations');const {data:sessionData}=await sb.auth.getSession();if(!sessionData.session){location.href='/';return}const [br,pr,er]=await Promise.all([sb.from('buildings').select('id,name').order('name'),sb.from('plant_rooms').select('id,name,building_id'),sb.from('electrical_assets').select('asset_code,plant_room')]);if(br.error||pr.error){box.innerHTML='<div class="loading">Could not load locations.</div>';return}const buildings=br.data||[],rooms=pr.data||[],electrical=er.error?[]:er.data||[];const counts=new Map();for(const b of buildings){const names=new Set(rooms.filter(r=>String(r.building_id)===String(b.id)).map(r=>r.name));counts.set(b.id,electrical.filter(a=>names.has(a.plant_room)).length)}box.innerHTML=buildings.map(b=>`<button class="locationBtn" data-building="${String(b.name).replace(/"/g,'&quot;')}"><b>${b.name}</b><span>${counts.get(b.id)||0} assets</span></button>`).join('');box.addEventListener('click',e=>{const btn=e.target.closest('[data-building]');if(!btn)return;const n=btn.dataset.building;if(n==='Staff House')return location.href='/staff-house-electrical.html';if(n==='Barn')return location.href='/barn-electrical.html';if(n==='Crescent')return location.href='/crescent-electrical.html';location.href='/electrical-schematic-map.html?building='+encodeURIComponent(n)});})();</script></body></html>
