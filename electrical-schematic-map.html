<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Electrical Distribution</title><link rel="stylesheet" href="/assets/style.css?v=20260830-10"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js?v=20260901-auth2"></script><script defer src="/assets/site-sidebar.js?v=20260830-2"></script><style>
:root{--g:#173d33;--gold:#c6a96a;--cream:#f4f0e8;--muted:#6f7b76}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1f2b27;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:8px}.bolt{width:34px;height:34px;border-radius:9px;background:#54230a;color:#ffd46a;display:grid;place-items:center;font-size:19px}.brand h1{font:700 20px Georgia,serif;margin:0}.brand small{opacity:.72;font-size:9px}.top a{border:1px solid #ffffff35;background:#ffffff12;color:#fff;padding:8px;border-radius:8px;font-weight:700;text-decoration:none}.page{max-width:900px;margin:auto;padding:7px}.intro h2{margin:0;color:var(--g);font-size:18px}.intro p{margin:2px 0 7px;color:var(--muted);font-size:10px}.search{margin:0 0 8px}.search input{width:100%;height:42px;border:1px solid #c9c4ba;border-radius:10px;background:#fff;padding:0 12px;font-size:12px}.canvas{background:#272727;border:1px solid #77736d;border-radius:13px;padding:7px}.sourceWrap{text-align:center}.sourceNode{display:inline-block;width:min(500px,82%);background:#052417;color:#fff;border:2px solid #296b52;border-radius:12px;padding:8px}.sourceNode .code{font-size:7px;font-weight:800;color:#c7ab6d}.sourceNode h3{margin:2px 0;font-size:13px}.sourceNode p{margin:0;font-size:7px;color:#d8e6df}.trunk{height:8px;width:2px;background:#b8ded0;margin:0 auto}.branches{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding-top:8px}.branches:before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:#b8ded0}.branch{min-width:0;display:flex;flex-direction:column}.branch>.vline:first-child{margin-top:-8px;height:8px}.node{display:block;width:100%;min-width:0;background:#5a5853;border:1.5px solid #77736d;border-radius:8px;padding:6px;text-align:left;text-decoration:none;color:#fff;cursor:pointer}.node .code{font-size:7px;font-weight:800;color:#c8b37d}.node h3{margin:2px 0;font-size:9px;color:#d7f2e7}.node p{margin:0;color:#d0ccc6;font-size:7px;line-height:1.25}.pill{display:inline-block;margin-top:4px;padding:2px 5px;border-radius:999px;background:#132d24;color:#d5eee4;font-size:7px;font-weight:800}.vline{height:7px;width:2px;background:#b8ded0;margin:0 auto}.groupGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:10px}.group{background:#3d4f47;border-color:#739587}.group h3{font-size:10px}.groupPanel{display:none;margin-top:8px;padding-top:8px;border-top:1px solid #6d716e}.groupPanel.open{display:block}.groupTitle{color:#d7f2e7;font-size:10px;font-weight:900;margin:0 0 6px}.itemGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.item{background:#44433f}.item h3{font-size:8px}.item p{font-size:6.5px}.hidden{display:none!important}.status{padding:12px;color:#d0ccc6;font-size:10px;text-align:center}.noMatches{display:none;color:#d0ccc6;text-align:center;padding:16px;font-size:9px}@media(max-width:600px){.page{padding:5px}.branches{gap:4px}.node{padding:5px}.node h3{font-size:8px}.node p,.node .code,.pill{font-size:6.3px}.brand h1{font-size:18px}}@media(max-width:390px){.groupGrid,.itemGrid{grid-template-columns:1fr 1fr}}
</style></head><body><header class="top"><div class="brand"><div class="bolt">⚡</div><div><h1 id="pageTitle">Electrical</h1><small>Interactive distribution schematic</small></div></div><a href="/electrical-map.html">← Locations</a></header><main class="page"><section class="intro"><h2>Electrical distribution</h2><p>Major distribution first. Boards, rooms, iLight and dimmer racks are separated and ordered numerically.</p></section><div class="search"><input id="mapSearch" type="search" placeholder="Search MH19, Kitchen, Room 15, iLight…" autocomplete="off"></div><div id="status" class="status">Loading electrical distribution…</div><section id="canvas" class="canvas" hidden></section></main><script>
(async()=>{'use strict';
const requested=new URLSearchParams(location.search).get('building')||'Main House';
if(requested==='Barn'){location.replace('/barn-electrical.html?v=20260901-2');return}
if(requested==='Crescent'){location.replace('/crescent-electrical.html?v=20260901-1');return}
const cfg=window.LIMEWOOD_CONFIG||{};
const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const natural=(a,b)=>String(a.asset_name||a.asset_code||'').localeCompare(String(b.asset_name||b.asset_code||''),undefined,{numeric:true,sensitivity:'base'});
const status=document.getElementById('status'),canvas=document.getElementById('canvas');
const [br,pr]=await Promise.all([sb.from('buildings').select('id,name').order('name'),sb.from('plant_rooms').select('id,name,building_id')]);
if(br.error||pr.error){status.textContent='Could not load building directory.';return}
const building=(br.data||[]).find(b=>b.name===requested)||(br.data||[])[0];
if(!building){status.textContent='No building found.';return}
document.getElementById('pageTitle').textContent=building.name+' Electrical';
const roomNames=(pr.data||[]).filter(r=>String(r.building_id)===String(building.id)).map(r=>r.name);
const [ar,cr]=await Promise.all([sb.from('electrical_assets').select('asset_code,asset_name,plant_room,category,system_duty,distribution_board,upstream_supply,circuit_reference,verification_status').in('plant_room',roomNames).order('asset_code'),sb.from('electrical_circuits').select('board_asset_code,circuit_number')]);
if(ar.error){status.textContent='Could not load electrical assets.';return}
const all=ar.data||[],circuits=cr.error?[]:(cr.data||[]);
const structure=a=>/incoming|incomer|intake|meter|main switch|switchboard|feeder|mcp|motor control|control panel|distribution board|\bdb\b|dimmer|lighting control panel|unit mh/i.test((a.category||'')+' '+(a.asset_name||'')+' '+(a.system_duty||''));
const assets=all.filter(structure);
const countCircuits=a=>{const keys=[a.asset_code,a.asset_name].filter(Boolean).map(norm);return circuits.filter(c=>keys.includes(norm(c.board_asset_code))).length};
const clickable=a=>/switchboard|mcp|control panel|distribution board|\bdb\b|panel|dimmer/i.test((a.category||'')+' '+(a.asset_name||''));
const incoming=assets.find(a=>/incoming|incomer|intake|meter/.test(norm((a.category||'')+' '+(a.asset_name||''))))||null;
const txt=a=>norm((a.asset_name||'')+' '+(a.category||'')+' '+(a.system_duty||'')+' '+(a.asset_code||''));
const isILight=a=>/\bilight\b/.test(txt(a));
const isDimmerRack=a=>!isILight(a)&&/dimmer|lighting rack/.test(txt(a));
const isRoom=a=>/\broom\s*\d+\b|\bbedroom\s*\d+\b|\bunit\s*mh\s*\d+\b/.test(txt(a));
const isMain=a=>/switchboard|main switch|feeder/.test(txt(a));
const isDB=a=>/distribution board|\bdb\b/.test(txt(a));
function itemCard(a){const n=countCircuits(a),verified=/verified|human reviewed/.test(norm(a.verification_status)),click=clickable(a)&&a.asset_code;const tag=n?n+' circuit'+(n===1?'':'s'):(verified?'Verified':'Recorded');const s=norm([a.asset_code,a.asset_name,a.plant_room,a.category,a.system_duty,a.distribution_board].join(' '));return `<${click?'a':'div'} class="node item mapItem" data-search="${esc(s)}"${click?` href="/electrical-board-circuits.html?board=${encodeURIComponent(a.asset_code)}"`:''}><div class="code">${esc(a.asset_code||'')}</div><h3>${esc(a.asset_name||'Electrical asset')}</h3><p>${esc(a.plant_room||'Location not recorded')}</p><span class="pill">${esc(tag)}</span></${click?'a':'div'}>`}
function groupCard(key,title,sub,items){return `<button class="node group groupBtn" type="button" data-group="${key}"><div class="code">${items.length} ITEM${items.length===1?'':'S'}</div><h3>${esc(title)}</h3><p>${esc(sub)}</p><span class="pill">Open group</span></button>`}
const remainder=assets.filter(a=>a!==incoming);
const mainItems=remainder.filter(a=>isMain(a)&&!isILight(a)&&!isDimmerRack(a)).sort(natural);
const top=mainItems.slice(0,2);
const used=new Set(top);
const makeGroup=(key,title,sub,test)=>{const items=remainder.filter(a=>!used.has(a)&&test(a)).sort(natural);items.forEach(a=>used.add(a));return {key,title,sub,items}};
const groups=[
 makeGroup('db','Distribution Boards','DBs only, ordered numerically',a=>isDB(a)&&!isRoom(a)&&!isILight(a)&&!isDimmerRack(a)),
 makeGroup('rooms','Rooms','Room and bedroom electrical units, ordered numerically',a=>isRoom(a)&&!isILight(a)&&!isDimmerRack(a)),
 makeGroup('ilight','iLight Units','iLight control units only, ordered numerically',a=>isILight(a)),
 makeGroup('dimmers','Dimmer Racks','Non-iLight dimmer and lighting racks, ordered numerically',a=>isDimmerRack(a)),
 makeGroup('feeders','Feeders & Supplies','Remaining switchboard feeders and supply equipment',a=>isMain(a)),
 makeGroup('other','Other Controls','Remaining control panels and electrical equipment',a=>true)
].filter(g=>g.items.length);
const sourceTitle=incoming?incoming.asset_name:'Mains incoming',sourceCode=incoming?(incoming.asset_code||building.name.toUpperCase()):building.name.toUpperCase(),sourceSub=incoming?(incoming.plant_room||'Incoming electrical distribution'):'Incoming electrical distribution';
let html=`<div class="sourceWrap"><div class="sourceNode"><div class="code">${esc(sourceCode)}</div><h3>${esc(sourceTitle)}</h3><p>${esc(sourceSub)}</p></div></div><div class="trunk"></div>`;
if(top.length){html+=`<div class="branches">${top.map(a=>`<div class="branch"><div class="vline"></div>${itemCard(a)}</div>`).join('')}</div>`}
html+=`<div class="groupGrid">${groups.map(g=>groupCard(g.key,g.title,g.sub,g.items)).join('')}</div>`;
html+=groups.map(g=>`<div id="group-${g.key}" class="groupPanel"><div class="groupTitle">${esc(g.title)}</div><div class="itemGrid">${g.items.map(itemCard).join('')}</div></div>`).join('');
html+='<div id="noMatches" class="noMatches">No electrical items match that search.</div>';
canvas.innerHTML=html;
canvas.querySelectorAll('.groupBtn').forEach(btn=>btn.addEventListener('click',()=>{const p=document.getElementById('group-'+btn.dataset.group);const open=p.classList.toggle('open');btn.querySelector('.pill').textContent=open?'Close group':'Open group';if(open)p.scrollIntoView({behavior:'smooth',block:'nearest'})}));
const search=document.getElementById('mapSearch');
search.addEventListener('input',()=>{const q=norm(search.value);let hits=0;canvas.querySelectorAll('.mapItem').forEach(el=>{const hit=!q||(el.dataset.search||'').includes(q);el.classList.toggle('hidden',!hit);if(hit)hits++});canvas.querySelectorAll('.groupPanel').forEach(p=>{const visible=[...p.querySelectorAll('.mapItem')].filter(x=>!x.classList.contains('hidden')).length;if(q&&visible)p.classList.add('open');else if(q&&!visible)p.classList.remove('open')});canvas.querySelectorAll('.groupBtn').forEach(btn=>{const p=document.getElementById('group-'+btn.dataset.group);const visible=p?[...p.querySelectorAll('.mapItem')].filter(x=>!x.classList.contains('hidden')).length:0;btn.classList.toggle('hidden',!!q&&!visible)});document.getElementById('noMatches').style.display=q&&hits===0?'block':'none'});
status.hidden=true;canvas.hidden=false})();
</script></body></html>
