async function run(){try{if(!num)throw new Error('SOP number missing');const{data:sop,error}=await db.from('sops').select('*').eq('sop_number',num).maybeSingle();if(error||!sop)throw error||new Error('Could not find '+num);msg.textContent='Creating '+sop.sop_number+'...';const{data:attachments}=await db.from('sop_attachments').select('*').eq('sop_id',sop.id).order('sort_order').order('created_at');const jsPDF=await loadJsPdf(),d=new jsPDF({unit:'mm',format:'a4'}),detail=parse(sop.description),green=[23,55,44],lime=[184,204,25],cream=[246,242,233],ink=[35,54,47];

function footer(p,n){d.setFillColor(...cream);d.rect(0,282,210,15,'F');d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(6.5);d.text((sop.sop_number||'SOP')+' - REVISION '+(sop.revision||'1'),15,290);d.text('PAGE '+p+' OF '+n,195,290,{align:'right'})}
function sec(n,t,text,y){text=String(text||'').trim();if(!text)return y;const lines=d.splitTextToSize(text,158),need=14+lines.length*4.3;if(y+need>274){d.addPage();header();y=40}d.setTextColor(...lime);d.setFont('helvetica','bold');d.setFontSize(9);d.text(String(n),18,y);d.setTextColor(...green);d.text(t.toUpperCase(),28,y);d.setTextColor(...ink);d.setFont('helvetica','normal');d.setFontSize(8.5);d.text(lines,28,y+6);return y+10+lines.length*4.3}
header();let y=41;d.setTextColor(...lime);d.setFont('helvetica','bold');d.setFontSize(7.5);d.text(sop.sop_number||'SOP',15,y);d.setTextColor(...green);d.setFont('times','bold');d.setFontSize(18);const tl=d.splitTextToSize(sop.title||'Untitled SOP',178);d.text(tl,15,y+9);y+=15+tl.length*7;const meta=[['STATUS',sop.status||'draft'],['REVISION',sop.revision||'1'],['CATEGORY',sop.category||'General'],['AUTHOR',sop.author||'-'],['ISSUE DATE',sop.issue_date||'-'],['REVIEW DATE',sop.review_date||'-']];meta.forEach((m,i)=>{const x=15+(i%2)*91,yy=y+Math.floor(i/2)*13;d.setFillColor(255,255,251);d.setDrawColor(218,220,201);d.roundedRect(x,yy,86,10,2,2,'FD');d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(6);d.text(m[0],x+4,yy+4);d.setTextColor(...ink);d.setFont('helvetica','normal');d.setFontSize(7.5);d.text(String(m[1]).replaceAll('_',' '),x+4,yy+8)});y+=42;y=sec(1,'Purpose',detail.purpose,y);y=sec(2,'Scope',detail.scope,y);y=sec(3,'PPE / Equipment',detail.ppe,y);y=sec(4,'Isolation / Safety Precautions',detail.isolation,y);y=sec(5,'Procedure',detail.steps,y);y=sec(6,'Emergency / Abnormal Conditions',detail.emergency,y);y=sec(7,'Notes',detail.notes,y);
if((attachments||[]).length){const paths=attachments.map(a=>a.storage_path),{data:signed}=await db.storage.from(BUCKET).createSignedUrls(paths,3600);for(let i=0;i<attachments.length;i++){const url=signed?.[i]?.signedUrl;if(!url)continue;const data=await imageData(url);if(!data)continue;d.addPage();header();d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(9);d.text('PHOTO '+(i+1),15,41);d.setFont('helvetica','normal');d.setFontSize(7);d.text(attachments[i].caption||attachments[i].file_name||'SOP photo',15,47);try{const img=new Image();img.src=data;await new Promise(res=>{img.onload=res;img.onerror=res});const ratio=Math.min(180/img.width,220/img.height),w=img.width*ratio,h=img.height*ratio;d.addImage(data,'JPEG',15,54,w,h)}catch{}}}
const pages=d.getNumberOfPages();for(let p=1;p<=pages;p++){d.setPage(p);footer(p,pages)}d.save(safe(sop.sop_number)+'_'+safe(sop.title)+'.pdf');msg.textContent='PDF downloaded.';document.getElementById('back').hidden=false}catch(e){msg.textContent='Could not create PDF: '+(e?.message||e);document.getElementById('back').hidden=false}}

})();</script></body></html>
