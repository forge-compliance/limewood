<main><section class="card"><div class="top"><div><div class="eyebrow">LIMEWOOD ENGINEERING</div><div class="eyebrow">CONTROLLED STANDARD OPERATING PROCEDURE</div><h1 id="heading">Loading SOP...</h1></div><div id="badge"></div></div>
<div class="grid"><label>SOP number<input id="number"></label><label>Revision<input id="revision"></label><label class="wide">Title<input id="title"></label><label>Category<input id="category"></label><label>Status<select id="status"><option value="draft">Draft</option><option value="under_review">Under review</option><option value="approved">Approved</option><option value="superseded">Superseded</option></select></label><label>Building<select id="building"><option value="">Estate-wide</option></select></label><label>Plant room<select id="room"><option value="">No plant room</option></select></label><label>Author<input id="author"></label><label>Approved by<input id="approved"></label><label>Issue date<input id="issue" type="date"></label><label>Review date<input id="review" type="date"></label><label class="wide">Purpose<textarea id="purpose"></textarea></label><label class="wide">Scope<textarea id="scope"></textarea></label><label class="wide">PPE / equipment<textarea id="ppe"></textarea></label><label class="wide">Isolation / safety precautions<textarea id="isolation"></textarea></label><label class="wide">Procedure steps<textarea id="steps"></textarea></label><label class="wide">Emergency / abnormal conditions<textarea id="emergency"></textarea></label><label class="wide">Notes<textarea id="notes"></textarea></label></div>
<section class="photoPanel"><div class="photoHead"><div><h2>Photos</h2><div class="photoHint">Add photos directly to this SOP. They will also be included in the PDF.</div></div><div class="photoActions"><label for="photoInput">+ Add photos<input id="photoInput" type="file" accept="image/*" multiple></label></div></div><div id="photoMsg" class="photoHint"></div><div id="photoGrid" class="photoGrid"><div class="emptyPhotos">Loading photos...</div></div></section>

const SUPABASE_URL='https://sswedojvkqvoqmwhfmkj.supabase.co',SUPABASE_KEY='sb_publishable_BoOHg11kfg6FB3xhQHW-dw_yal1q1Yu',BUCKET='asset-files',MARK='LW_SOP_BUILDER_V1:';
const $=id=>document.getElementById(id), db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let sop=null,buildings=[],rooms=[],attachments=[];const params=new URLSearchParams(location.search),num=(params.get('number')||'').trim();
const val=id=>$(id).value.trim(),set=(id,v)=>{$(id).value=v??''};
function parse(v){v=String(v||'');if(!v.startsWith(MARK))return{notes:v};try{return JSON.parse(v.slice(MARK.length))}catch{return{notes:v}}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeName(v){return String(v||'photo').replace(/[^a-zA-Z0-9._-]+/g,'_')}
function fillSop(data){sop=data;const d=parse(data.description);$('heading').textContent=data.title||data.sop_number;$('badge').textContent=(data.status||'draft').replaceAll('_',' ');set('number',data.sop_number);set('revision',data.revision||'1');set('title',data.title);set('category',data.category);set('status',data.status||'draft');set('author',data.author);set('approved',data.approved_by);set('issue',data.issue_date);set('review',data.review_date);set('purpose',d.purpose);set('scope',d.scope);set('ppe',d.ppe);set('isolation',d.isolation);set('steps',d.steps);set('emergency',d.emergency);set('notes',d.notes)}
async function loadSop(){if(!num)throw new Error('SOP number missing');const{data,error}=await db.from('sops').select('*').eq('sop_number',num).maybeSingle();if(error||!data)throw error||new Error('Could not find '+num);fillSop(data);$('loadbar').style.display='none'}
async function directory(){const[b,r]=await Promise.all([db.from('buildings').select('id,name').order('name'),db.from('plant_rooms').select('id,name,building_id').order('name')]);buildings=b.data||[];rooms=r.data||[];$('building').innerHTML='<option value="">Estate-wide</option>'+buildings.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('building').value=sop?.building_id||'';fillRooms();$('room').value=sop?.plant_room_id||''}
function fillRooms(){const b=$('building').value,old=$('room').value,list=b?rooms.filter(x=>String(x.building_id)===String(b)):rooms;$('room').innerHTML='<option value="">No plant room</option>'+list.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');if(list.some(x=>String(x.id)===String(old)))$('room').value=old}
$('building').addEventListener('change',fillRooms);
async function loadPhotos(){if(!sop)return;const host=$('photoGrid');const {data,error}=await db.from('sop_attachments').select('*').eq('sop_id',sop.id).order('sort_order').order('created_at');if(error){host.innerHTML='<div class="emptyPhotos">Could not load photos.</div>';return}attachments=data||[];if(!attachments.length){host.innerHTML='<div class="emptyPhotos">No photos added yet.</div>';return}const paths=attachments.map(a=>a.storage_path);const {data:signed}=await db.storage.from(BUCKET).createSignedUrls(paths,3600);const urls={};(signed||[]).forEach((x,i)=>urls[paths[i]]=x.signedUrl||'');host.innerHTML=attachments.map(a=>`<article class="photoCard">${urls[a.storage_path]?`<img src="${esc(urls[a.storage_path])}" alt="">`:''}<div class="photoMeta">${esc(a.caption||a.file_name||'Photo')}</div><button class="removePhoto" data-remove="${esc(a.id)}" type="button">Remove</button></article>`).join('');host.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removePhoto(b.dataset.remove));}
async function uploadPhotos(files){if(!sop||!files.length)return;const m=$('photoMsg');m.textContent=`Uploading ${files.length} photo${files.length===1?'':'s'}...`;const {data:sess}=await db.auth.getSession();const uid=sess?.session?.user?.id;if(!uid){m.textContent='Please sign in again.';return}let order=attachments.length;for(const file of files){const path=`sop-attachments/${sop.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safeName(file.name)}`;const up=await db.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(up.error){m.textContent='Upload failed: '+up.error.message;return}const ins=await db.from('sop_attachments').insert({sop_id:sop.id,storage_path:path,file_name:file.name,caption:file.name,sort_order:order++,created_by:uid});if(ins.error){m.textContent='Photo saved but link failed: '+ins.error.message;return}}m.textContent='Photos added.';$('photoInput').value='';await loadPhotos();}
$('photoInput').addEventListener('change',e=>uploadPhotos([...e.target.files]));
async function removePhoto(id){const row=attachments.find(a=>String(a.id)===String(id));if(!row)return;if(!confirm('Remove this photo from the SOP?'))return;const d=await db.from('sop_attachments').delete().eq('id',id);if(d.error){$('photoMsg').textContent=d.error.message;return}await db.storage.from(BUCKET).remove([row.storage_path]);await loadPhotos();}
async function save(){if(!sop)return;const {data:sess}=await db.auth.getSession();const uid=sess?.session?.user?.id;if(!uid){$('msg').textContent='Please sign in again.';return}const detail={purpose:val('purpose'),scope:val('scope'),ppe:val('ppe'),isolation:val('isolation'),steps:val('steps'),emergency:val('emergency'),notes:val('notes')};const p={sop_number:val('number'),revision:val('revision')||'1',title:val('title'),category:val('category')||'General',status:val('status')||'draft',building_id:val('building')||null,plant_room_id:val('room')||null,author:val('author')||null,approved_by:val('approved')||null,issue_date:val('issue')||null,review_date:val('review')||null,description:MARK+JSON.stringify(detail),updated_by:uid};$('msg').textContent='Saving...';const{data,error}=await db.from('sops').update(p).eq('id',sop.id).select('*').single();if(error){$('msg').textContent=error.message;return}fillSop(data);$('msg').textContent='Saved.'}
async function loadJsPdf(){if(window.jspdf?.jsPDF)return window.jspdf.jsPDF;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});return window.jspdf.jsPDF}
async function imageData(url){try{const r=await fetch(url),b=await r.blob();return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}catch{return null}}
async function downloadPdf(){if(!sop)return;const btn=$('pdfBtn');btn.disabled=true;btn.textContent='Building PDF...';try{const J=await loadJsPdf(),d=new J({unit:'mm',format:'a4'}),detail=parse(sop.description);const green=[8,53,42],lime=[184,204,25],cream=[249,248,239],ink=[25,38,32];function header(){d.setFillColor(...cream);d.rect(0,0,210,28,'F');try{d.addImage(LOGO,'JPEG',14,6,60,16)}catch{}d.setDrawColor(...lime);d.setLineWidth(.8);d.line(82,5,82,21);d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(10);d.text('LIMEWOOD ENGINEERING',90,11);d.setFontSize(6.5);d.text('CONTROLLED STANDARD OPERATING PROCEDURE',90,18);d.line(0,28,210,28)}function footer(p,n){d.setFillColor(...cream);d.rect(0,280,210,17,'F');d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(6);d.text(`${sop.sop_number||'SOP'} - REVISION ${sop.revision||'1'}`,16,287);d.text(`PAGE ${p} OF ${n}`,194,287,{align:'right'})}function section(num,title,text,y){if(!String(text||'').trim())return y;const lines=d.splitTextToSize(String(text),157),need=18+lines.length*4.2;if(y+need>270){d.addPage();header();y=40}d.setTextColor(...lime);d.setFont('helvetica','bold');d.setFontSize(9);d.text(String(num),19,y);d.setTextColor(...green);d.text(title.toUpperCase(),28,y);d.setTextColor(...ink);d.setFont('helvetica','normal');d.setFontSize(8.5);d.text(lines,28,y+6);return y+10+lines.length*4.2}header();let y=40;d.setTextColor(...lime);d.setFont('helvetica','bold');d.setFontSize(7);d.text(sop.sop_number||'SOP',16,y);d.setTextColor(...green);d.setFontSize(17);const titleLines=d.splitTextToSize(sop.title||'Untitled SOP',178);d.text(titleLines,16,y+9);y+=14+titleLines.length*7;const meta=[['Status',sop.status||'draft'],['Revision',sop.revision||'1'],['Category',sop.category||'General'],['Author',sop.author||'-'],['Issue date',sop.issue_date||'-'],['Review date',sop.review_date||'-']];d.setFontSize(7);meta.forEach((m,i)=>{const x=16+(i%2)*91,yy=y+Math.floor(i/2)*13;d.setFillColor(255,255,251);d.setDrawColor(218,220,201);d.roundedRect(x,yy,86,10,2,2,'FD');d.setTextColor(...green);d.setFont('helvetica','bold');d.text(m[0].toUpperCase(),x+4,yy+4);d.setFont('helvetica','normal');d.setTextColor(...ink);d.text(String(m[1]),x+4,yy+8)});y+=42;y=section(1,'Purpose',detail.purpose,y);y=section(2,'Scope',detail.scope,y);y=section(3,'PPE / Equipment',detail.ppe,y);y=section(4,'Isolation / Safety Precautions',detail.isolation,y);y=section(5,'Procedure',detail.steps,y);y=section(6,'Emergency / Abnormal Conditions',detail.emergency,y);y=section(7,'Notes',detail.notes,y);if(attachments.length){const paths=attachments.map(a=>a.storage_path);const {data:signed}=await db.storage.from(BUCKET).createSignedUrls(paths,3600);for(let i=0;i<attachments.length;i++){const u=signed?.[i]?.signedUrl;if(!u)continue;const img=await imageData(u);if(!img)continue;d.addPage();header();d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(11);d.text('PHOTO '+(i+1),16,40);d.setFont('helvetica','normal');d.setFontSize(7);d.text(attachments[i].caption||attachments[i].file_name||'SOP photo',16,46);try{const props=d.getImageProperties(img),mw=178,mh=218,r=Math.min(mw/props.width,mh/props.height),w=props.width*r,h=props.height*r;d.addImage(img,props.fileType||'JPEG',16+(mw-w)/2,52,w,h)}catch{}}}const pages=d.getNumberOfPages();for(let p=1;p<=pages;p++){d.setPage(p);footer(p,pages)}d.save(`${String(sop.sop_number||'SOP').replace(/[^a-z0-9_-]+/gi,'_')}_${String(sop.title||'').replace(/[^a-z0-9_-]+/gi,'_')}.pdf`)}catch(e){alert('Could not create PDF: '+(e?.message||e))}finally{btn.disabled=false;btn.textContent='Download PDF'}}
$('saveBtn').onclick=save;$('pdfBtn').onclick=downloadPdf;
(async()=>{try{await loadSop();directory();loadPhotos();if(params.get('download')==='1')setTimeout(downloadPdf,120)}catch(e){$('heading').textContent='Could not load SOP';$('msg').textContent=e?.message||e;$('loadbar').style.display='none'}})();
})();
