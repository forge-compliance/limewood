<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17372c">
<title>Limewood Engineering Systems</title>
<link rel="stylesheet" href="/assets/style.css?v=601">
<style>
  body{margin:0;background:#f4f0e7;color:#1f2925;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
  .sysTop{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#17372c;color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
  .sysTop .mark{width:40px;height:40px;display:grid;place-items:center;background:#d6b36a;color:#17372c;border-radius:11px;font-weight:900}
  .sysTop div:nth-child(2){flex:1}.sysTop b{display:block}.sysTop small{color:#cbd7d1}
  .sysTop button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 12px}
  .sysShell{width:min(1200px,calc(100% - 24px));margin:0 auto;padding:20px 0 48px}
  .sysHero{padding:24px;border-radius:20px;background:linear-gradient(135deg,#17372c,#285746);color:#fff;box-shadow:0 16px 40px rgba(23,55,44,.15)}
  .sysHero span{color:#e7cc94;font-size:11px;font-weight:900;letter-spacing:.15em}.sysHero h1{margin:7px 0 8px;font-family:Georgia,serif;font-size:clamp(30px,5vw,48px)}.sysHero p{margin:0;color:#d7e1dc;line-height:1.55}
  .sysTools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.sysTools input{flex:1;min-width:220px;padding:12px;border:1px solid #ccd3ce;border-radius:11px;background:#fff}.sysTools button{padding:11px 14px;border:0;border-radius:11px;background:#17372c;color:#fff;font-weight:800}
  .sysStats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.sysStats article{padding:16px;background:#fff;border:1px solid #d8ddd7;border-radius:14px}.sysStats b{display:block;font-size:26px;color:#17372c}.sysStats span{font-size:12px;color:#66716c}
  .sysGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sysCard{min-width:0;padding:17px;background:#fff;border:1px solid #d8ddd7;border-radius:15px;box-shadow:0 7px 20px rgba(23,55,44,.05)}.sysCard h3{margin:6px 0 8px;font-size:18px}.sysCard p{margin:4px 0;color:#66716c;font-size:13px;overflow-wrap:anywhere}.sysCard .badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8efe9;color:#285746;font-size:11px;font-weight:900}.sysCard button,.sysCard a{display:inline-block;margin-top:10px;padding:9px 11px;border:0;border-radius:9px;background:#17372c;color:#fff;text-decoration:none;font-weight:800}.empty{grid-column:1/-1;padding:32px;background:#fff;border:1px dashed #b8c1bc;border-radius:15px;text-align:center;color:#66716c}
  .locationActions{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.locationActions a{display:block;padding:22px;background:#fff;border:1px solid #d8ddd7;border-radius:15px;text-decoration:none;color:#1f2925}.locationActions b{display:block;font-size:20px;margin-bottom:6px}.locationActions span{color:#66716c}.locationActions .primaryLink{background:#17372c;color:#fff}.locationActions .primaryLink span{color:#d7e1dc}
  .settings{display:grid;gap:12px}.settings article{padding:18px;background:#fff;border:1px solid #d8ddd7;border-radius:15px}.settings button{padding:10px 13px;border:0;border-radius:10px;background:#17372c;color:#fff;font-weight:800;margin-right:8px;margin-top:8px}
  @media(max-width:800px){.sysGrid{grid-template-columns:1fr}.sysStats{grid-template-columns:1fr 1fr}.sysTop small{display:none}.locationActions{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/config.js"></script>
</head>
<body>
<header class="sysTop"><div class="mark">LW</div><div><b>Limewood Engineering</b><small>Estate technical control centre</small></div><button onclick="location.href='/'">Dashboard</button></header>
<main class="sysShell">
<section class="sysHero"><span>ENGINEERING SYSTEM VIEW</span><h1 id="title">Loading…</h1><p id="subtitle">Connecting to the estate database.</p></section>
<div class="sysTools" id="tools"><input id="search" placeholder="Search this view"><button id="refresh">Refresh</button></div>
<section class="sysStats"><article><b id="count">0</b><span>Matching records</span></article><article><b id="photoCount">0</b><span>Photos</span></article><article><b id="status">…</b><span>Database</span></article></section>
<section id="content" class="sysGrid"></section>
</main>
<script>
(() => {
  'use strict';
  const cfg=window.LIMEWOOD_CONFIG||{};
  const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const qs=new URLSearchParams(location.search);
  const view=qs.get('view')||'Engineering Systems';
  const kind=qs.get('kind')||'system';
  const room=qs.get('room')||'';
  const showList=qs.get('list')==='1';
  const $=id=>document.getElementById(id);
  $('title').textContent=view;

  const TERMS={
    'Water Systems':['water','cws','hws','dhw','tmv','booster','water treatment','cold water','hot water'],
    'Heating Systems':['heating','boiler','lthw','calorifier','heat exchanger','pressurisation','radiator'],
    'Chilled Water Systems':['chilled','chw','chiller','cooling'],
    'Lighting':['lighting','light','dimmer','emergency lighting'],
    'Fire & Life Safety':['fire','alarm','sprinkler','smoke','emergency lighting','life safety'],
    'Pool & Spa Water Treatment':['pool','spa','dosing','chlorine','bromine','ph','water treatment','filter','backwash']
  };
  let assets=[],photos=[],buildings=[],plantRooms=[];

  function text(a){return [a.asset_code,a.asset_name,a.category,a.system_duty,a.manufacturer,a.model,a.serial_number,a.exact_location,a.notes].join(' ').toLowerCase()}
  function locationText(a){
    const b=buildings.find(x=>x.id===a.building_id)?.name||'';
    const p=plantRooms.find(x=>x.id===a.plant_room_id)?.name||'';
    return [b,p,a.exact_location,a.asset_name,a.notes].join(' ').toLowerCase();
  }
  function matching(){
    let list=assets.slice();
    if(kind==='location') list=list.filter(a=>locationText(a).includes(view.toLowerCase()));
    else if(TERMS[view]) list=list.filter(a=>TERMS[view].some(t=>text(a).includes(t)));
    if(room) list=list.filter(a=>locationText(a).includes(room.toLowerCase()));
    const q=$('search').value.trim().toLowerCase();
    if(q) list=list.filter(a=>text(a).includes(q)||locationText(a).includes(q));
    return list;
  }
  function card(a){
    const b=buildings.find(x=>x.id===a.building_id)?.name||'';
    const p=plantRooms.find(x=>x.id===a.plant_room_id)?.name||'';
    const pc=photos.filter(x=>x.asset_id===a.id).length;
    return `<article class="sysCard"><span class="badge">${esc(a.asset_code||'Asset')}</span><h3>${esc(a.asset_name||'Unnamed asset')}</h3><p>${esc([b,p,a.exact_location].filter(Boolean).join(' · ')||'Location not set')}</p><p>${esc([a.manufacturer,a.model].filter(Boolean).join(' ')||a.category||'')}</p><p>${pc} photo${pc===1?'':'s'}</p><a href="/?asset=${encodeURIComponent(a.asset_code||'')}">Open asset</a></article>`;
  }
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

  function locationAssetsUrl(){
    const u=new URL('/systems.html',location.origin);
    u.searchParams.set('view',view);u.searchParams.set('kind','location');u.searchParams.set('list','1');return u.toString();
  }
  function locationPhotosUrl(){
    const u=new URL('/systems.html',location.origin);
    u.searchParams.set('view','Photo Library');u.searchParams.set('kind','system');u.searchParams.set('room',view);return u.toString();
  }
  function renderLocationLanding(){
    const list=matching();
    $('tools').hidden=true;
    $('subtitle').textContent=`Engineering overview for ${view}. Open the filtered register when you need the individual assets.`;
    $('count').textContent=list.length;
    $('photoCount').textContent=photos.filter(p=>list.some(a=>a.id===p.asset_id)).length;
    $('content').innerHTML=`<div class="locationActions"><a class="primaryLink" href="${locationAssetsUrl()}"><b>Open ${esc(view)} assets</b><span>${list.length} matching asset${list.length===1?'':'s'} in the live register</span></a><a href="${locationPhotosUrl()}"><b>Open ${esc(view)} photos</b><span>Room and equipment photographs</span></a></div>`;
  }
  async function renderPhotoLibrary(){
    $('subtitle').textContent=room?`Photos attached to assets in ${room}.`:'Asset photographs across the estate. Full images only load when opened.';
    const q=$('search').value.trim().toLowerCase();
    const rows=photos.filter(p=>{
      const a=assets.find(x=>x.id===p.asset_id);
      if(room && a && !locationText(a).includes(room.toLowerCase())) return false;
      return !q || [p.caption,p.photo_type,a?.asset_code,a?.asset_name].join(' ').toLowerCase().includes(q);
    });
    $('count').textContent=rows.length;$('photoCount').textContent=photos.length;
    $('content').innerHTML=rows.length?rows.map(p=>{const a=assets.find(x=>x.id===p.asset_id);return `<article class="sysCard"><span class="badge">PHOTO</span><h3>${esc(p.caption||a?.asset_name||'Asset photo')}</h3><p>${esc(a?[a.asset_code,a.asset_name].filter(Boolean).join(' · '):'Unassigned photo')}</p><p>${esc(p.photo_type||'General')}</p><button data-photo="${esc(p.storage_path||'')}">Open photo</button></article>`}).join(''):'<div class="empty">No photos match this view.</div>';
  }
  function renderAssets(){
    $('subtitle').textContent=kind==='location'?`Filtered asset register for ${view}.`:`Live asset register filtered for ${view}.`;
    const list=matching();$('count').textContent=list.length;$('photoCount').textContent=photos.filter(p=>list.some(a=>a.id===p.asset_id)).length;
    $('content').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No matching assets yet. The view is working; this system/location simply has no matching registered equipment yet.</div>';
  }
  function renderSettings(){
    $('tools').hidden=true;$('count').textContent='—';$('photoCount').textContent='—';$('subtitle').textContent='App maintenance and local device controls.';
    $('content').className='settings';$('content').innerHTML=`<article><h3>Refresh application</h3><p>Reload the latest site files and service worker.</p><button id="hardRefresh">Refresh app</button></article><article><h3>Local UI cache</h3><p>Clear Limewood UI preferences on this device. Supabase sign-in is preserved.</p><button id="clearUi">Clear local UI cache</button></article><article><h3>Useful tools</h3><a href="/photo-inbox.html">Photo Inbox</a> <a href="/maintenance-dashboard.html">Maintenance Centre</a></article>`;
    $('hardRefresh').onclick=async()=>{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.update().catch(()=>{})))}location.reload(true)};
    $('clearUi').onclick=()=>{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&(/^(lw-|limewood-)/i.test(k)))localStorage.removeItem(k)}alert('Local Limewood UI cache cleared. Sign-in kept.')};
  }
  async function load(){
    try{
      const {data:{session}}=await client.auth.getSession();
      if(!session){location.href='/?return='+encodeURIComponent(location.href);return}
      const [a,b,p,ph]=await Promise.all([
        client.from('assets').select('*').order('asset_code'),
        client.from('buildings').select('*').order('name'),
        client.from('plant_rooms').select('*').order('name'),
        client.from('asset_photos').select('*').order('created_at',{ascending:false})
      ]);
      const err=a.error||b.error||p.error||ph.error;if(err)throw err;
      assets=a.data||[];buildings=b.data||[];plantRooms=p.data||[];photos=ph.data||[];$('status').textContent='Live';
      if(view==='Settings') renderSettings(); else if(view==='Photo Library') renderPhotoLibrary(); else if(kind==='location'&&!showList) renderLocationLanding(); else renderAssets();
    }catch(e){$('status').textContent='Error';$('content').innerHTML=`<div class="empty">Could not load this view: ${esc(e.message||e)}</div>`}
  }
  $('search').addEventListener('input',()=>view==='Photo Library'?renderPhotoLibrary():renderAssets());
  $('refresh').onclick=load;
  $('content').addEventListener('click',async e=>{const b=e.target.closest('[data-photo]');if(!b)return;const path=b.dataset.photo;if(!path)return;const {data,error}=await client.storage.from(cfg.storageBucket).createSignedUrl(path,900);if(error)return alert(error.message);window.open(data.signedUrl,'_blank','noopener')});
  load();
})();
</script>
</body>
</html>
