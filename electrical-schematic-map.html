<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Electrical Distribution Schematic</title><link rel="stylesheet" href="/assets/style.css?v=20260830-10"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js?v=20260901-auth2"></script><script defer src="/assets/site-sidebar.js?v=20260830-2"></script><style>
:root{--g:#173d33;--gold:#c6a96a;--cream:#f4f0e8;--muted:#6f7b76}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1f2b27;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:8px}.bolt{width:34px;height:34px;border-radius:9px;background:#54230a;color:#ffd46a;display:grid;place-items:center;font-size:19px}.brand h1{font:700 20px Georgia,serif;margin:0;line-height:1}.brand small{opacity:.72;font-size:9px}.top a{border:1px solid #ffffff35;background:#ffffff12;color:#fff;padding:8px;border-radius:8px;font-weight:700;text-decoration:none}.page{max-width:900px;margin:auto;padding:7px}.intro h2{margin:0;color:var(--g);font-size:18px}.intro p{margin:2px 0 7px;color:var(--muted);font-size:10px}.canvas{background:#272727;border:1px solid #77736d;border-radius:13px;padding:7px}.sourceWrap{text-align:center}.sourceNode{display:inline-block;width:min(500px,82%);background:#052417;color:#fff;border:2px solid #296b52;border-radius:12px;padding:8px}.sourceNode .code{font-size:7px;font-weight:800;color:#c7ab6d}.sourceNode h3{margin:2px 0;font-size:13px;line-height:1.05}.sourceNode p{margin:0;font-size:7px;color:#d8e6df}.trunk{height:8px;width:2px;background:#b8ded0;margin:0 auto}.branches{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-top:8px}.branches:before{content:"";position:absolute;top:0;left:16.66%;right:16.66%;height:2px;background:#b8ded0}.branch{min-width:0;display:flex;flex-direction:column;align-items:stretch}.branch>.vline:first-child{margin-top:-8px;height:8px}.node{display:block;width:100%;min-width:0;background:#5a5853;border:1.5px solid #77736d;border-radius:8px;padding:5px 6px;text-align:left;text-decoration:none;color:#fff;cursor:pointer}.node .code{font-size:7px;font-weight:800;color:#c8b37d;line-height:1}.node h3{margin:2px 0;font-size:9px;line-height:1.05;color:#d7f2e7}.node p{margin:0;color:#d0ccc6;font-size:7px;line-height:1.1}.pill{display:inline-block;margin-top:3px;padding:2px 5px;border-radius:999px;background:#132d24;color:#d5eee4;font-size:7px;font-weight:800}.pill.pending{background:#40381d;color:#f0d990}.vline{height:7px;width:2px;background:#b8ded0;margin:0 auto}.childBranches{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding-top:7px}.childBranches:before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:#b8ded0}.childBranch{position:relative;min-width:0}.childBranch:before{content:"";position:absolute;top:-7px;left:50%;width:2px;height:7px;background:#b8ded0}.orphanTitle{font-size:8px;font-weight:900;color:#d5eee4;margin:10px 0 5px}.orphanGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.orphanGrid .node{border-style:dashed;opacity:.9}.status{padding:12px;border:1px solid #d8d3ca;background:#fff;border-radius:11px;color:var(--muted);font-size:10px}@media(max-width:600px){.page{padding:5px}.branches{gap:4px}.node{padding:4px}.node h3{font-size:8px}.node p,.node .code,.pill{font-size:6.2px}.orphanGrid{grid-template-columns:1fr 1fr}.brand h1{font-size:18px}}@media(max-width:390px){.branches{grid-template-columns:1fr 1fr}.branches:before{left:25%;right:25%}.orphanGrid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="top"><div class="brand"><div class="bolt">⚡</div><div><h1 id="pageTitle">Electrical</h1><small>Interactive distribution schematic</small></div></div><a href="/electrical-map.html">← Locations</a></header>
<main class="page"><section class="intro"><h2>Electrical distribution</h2><p>Tap a board, dimmer or control panel for its recorded circuit schedule.</p></section><div id="status" class="status">Loading electrical distribution…</div><section id="canvas" class="canvas" hidden></section></main>
<script>(async()=>{'use strict';const cfg=window.LIMEWOOD_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const requested=new URLSearchParams(location.search).get('building')||'Main House',status=document.getElementById('status'),canvas=document.getElementById('canvas'),pageTitle=document.getElementById('pageTitle');const [br,pr]=await Promise.all([sb.from('buildings').select('id,name').order('name'),sb.from('plant_rooms').select('id,name,building_id')]);if(br.error||pr.error){status.textContent='Could not load building directory.';return}const buildings=br.data||[],rooms=pr.data||[],building=buildings.find(b=>b.name===requested)||buildings[0];if(!building){status.textContent='No building found.';return}pageTitle.textContent=building.name+' Electrical';const roomNames=rooms.filter(r=>String(r.building_id)===String(building.id)).map(r=>r.name);const [ar,cr]=await Promise.all([sb.from('electrical_assets').select('asset_code,asset_name,plant_room,category,system_duty,distribution_board,upstream_supply,circuit_reference,verification_status').in('plant_room',roomNames).order('asset_code'),sb.from('electrical_circuits').select('board_asset_code,circuit_number')]);if(ar.error){status.textContent='Could not load electrical assets.';return}const all=ar.data||[],circuits=cr.error?[]:(cr.data||[]);const isStructure=a=>/incoming|incomer|intake|meter|main switch|switchboard|feeder|mcp|motor control|control panel|distribution board|\bdb\b|dimmer|lighting control panel/i.test((a.category||'')+' '+(a.asset_name||'')+' '+(a.system_duty||''));let assets=all.filter(isStructure);if(!assets.length){status.textContent='No distribution equipment recorded for this location yet.';return}const byCode=new Map(assets.map(a=>[a.asset_code,a]));const refMatches=(ref,a)=>{const r=norm(ref);if(!r)return false;return [a.asset_code,a.asset_name].filter(Boolean).some(v=>{const n=norm(v);return n&&(r===n||r.includes(n)||n.includes(r))})};function parentOf(a){let p=assets.find(x=>x!==a&&(refMatches(a.upstream_supply,x)||refMatches(a.distribution_board,x)));if(p)return p;if(building.name==='Main House'&&/^MH-F-/.test(a.asset_code||''))return byCode.get('MH-E-001')||null;if(building.name==='Main House'){const n=norm(a.asset_name);p=assets.find(x=>/^MH-F-/.test(x.asset_code||'')&&norm(x.asset_name)===n);if(p)return p}return null}const kidsOf=p=>assets.filter(a=>parentOf(a)===p);const countCircuits=a=>{const keys=[a.asset_code,a.asset_name].filter(Boolean).map(norm);return circuits.filter(c=>keys.includes(norm(c.board_asset_code))).length};const clickable=a=>/switchboard|mcp|control panel|distribution board|\bdb\b|dimmer|panel/i.test((a.category||'')+' '+(a.asset_name||''));const isActualIncoming=a=>/incoming|incomer|intake|meter/.test(norm((a.category||'')+' '+(a.asset_name||'')));function card(a,pending=false){const count=countCircuits(a),click=clickable(a)&&a.asset_code;let label=count?count+' circuit'+(count===1?'':'s'):String(a.verification_status||'').toLowerCase().includes('verified')||String(a.verification_status||'').toLowerCase().includes('human-reviewed')?'Verified':'Recorded';if(pending)label='Feed to confirm';return `<${click?'a':'div'} class="node"${click?` href="/electrical-board-circuits.html?board=${encodeURIComponent(a.asset_code)}"`:''}><div class="code">${esc(a.asset_code||'')}</div><h3>${esc(a.asset_name||'Electrical asset')}</h3><p>${esc(a.plant_room||'Location not recorded')}</p><span class="pill${pending?' pending':''}">${esc(label)}</span></${click?'a':'div'}>`}const seen=new Set();function render(a,depth=0){const key=a.asset_code||a.asset_name;if(depth>7||seen.has(key))return card(a);seen.add(key);const kids=kidsOf(a);return `${card(a)}${kids.length?`<div class="vline"></div><div class="childBranches">${kids.map(k=>`<div class="childBranch">${render(k,depth+1)}</div>`).join('')}</div>`:''}`}
const incoming=assets.filter(isActualIncoming).sort((a,b)=>String(a.asset_code).localeCompare(String(b.asset_code)))[0]||null;let roots=assets.filter(a=>!parentOf(a)&&a!==incoming);if(incoming){roots=kidsOf(incoming);seen.add(incoming.asset_code||incoming.asset_name)}if(building.name==='Main House'&&byCode.get('MH-E-001')){const sw=byCode.get('MH-E-001');if(!incoming&&roots.includes(sw))roots=[sw,...roots.filter(x=>x!==sw)]}const sourceTitle=incoming?incoming.asset_name:'Mains incoming';const sourceCode=incoming?(incoming.asset_code||building.name.toUpperCase()):building.name.toUpperCase();const sourceSub=incoming?(incoming.plant_room||'Incoming electrical distribution'):'Incoming electrical distribution';let html=`<div class="sourceWrap"><div class="sourceNode"><div class="code">${esc(sourceCode)}</div><h3>${esc(sourceTitle)}</h3><p>${esc(sourceSub)}</p></div></div><div class="trunk"></div>`;if(!roots.length){html+='<div style="text-align:center;color:#aaa;font-size:8px;padding:8px">No mapped top-level distribution equipment yet.</div>'}else{html+=`<div class="branches">${roots.map(r=>`<div class="branch"><div class="vline"></div>${render(r)}</div>`).join('')}</div>`}const leftovers=assets.filter(a=>a!==incoming&&!seen.has(a.asset_code||a.asset_name));if(leftovers.length){html+=`<div class="orphanTitle">Feed relationship still to confirm</div><div class="orphanGrid">${leftovers.map(a=>card(a,true)).join('')}</div>`}canvas.innerHTML=html;status.hidden=true;canvas.hidden=false})();</script></body></html>
