<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Electrical Distribution</title><link rel="stylesheet" href="/assets/style.css?v=20260830-10"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js?v=20260901-auth2"></script><script defer src="/assets/site-sidebar.js?v=20260830-2"></script><style>
:root{--g:#173d33;--gold:#c6a96a;--cream:#f4f0e8;--muted:#6f7b76;--line:#d8d3ca}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1f2b27;font-family:Arial,Helvetica,sans-serif}.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:8px}.bolt{width:34px;height:34px;border-radius:9px;background:#54230a;color:#ffd46a;display:grid;place-items:center;font-size:19px}.brand h1{font:700 20px Georgia,serif;margin:0;line-height:1}.brand small{opacity:.72;font-size:9px}.top a{border:1px solid #ffffff35;background:#ffffff12;color:#fff;padding:8px;border-radius:8px;font-weight:700;text-decoration:none}.page{max-width:900px;margin:auto;padding:10px}.intro h2{margin:0;color:var(--g);font-size:19px}.intro p{margin:3px 0 10px;color:var(--muted);font-size:10px}.search{position:sticky;top:58px;z-index:10;background:var(--cream);padding:2px 0 9px}.search input{width:100%;height:43px;border:1px solid #cfc9bd;border-radius:11px;background:#fff;padding:0 13px;font-size:13px}.source{background:#08291d;color:#fff;border:2px solid #347b61;border-radius:13px;padding:10px 12px;margin-bottom:10px}.source small{color:#d2b66f;font-size:8px;font-weight:900}.source b{display:block;font-size:14px;margin-top:2px}.source span{font-size:8px;color:#cfe0d8}.section{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}.sectionHead{width:100%;border:0;background:#fff;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer}.sectionIcon{width:34px;height:34px;border-radius:9px;background:#f1eee6;display:grid;place-items:center;font-size:18px}.sectionText{min-width:0;flex:1}.sectionText b{display:block;color:var(--g);font-size:14px}.sectionText span{font-size:8px;color:var(--muted)}.chev{font-size:18px;color:#7c877f;transition:.2s}.section.closed .chev{transform:rotate(-90deg)}.sectionBody{padding:0 10px 10px}.section.closed .sectionBody{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.node{display:block;min-width:0;border:1px solid #d7d2c8;border-radius:10px;padding:9px;background:#fbfaf7;color:#1f2b27;text-decoration:none}.node .code{font-size:7px;font-weight:900;color:#8a7443}.node h3{margin:3px 0;font-size:11px;color:var(--g);line-height:1.15}.node p{margin:0;font-size:8px;color:#68756f;line-height:1.25}.pill{display:inline-block;margin-top:6px;padding:3px 6px;border-radius:999px;background:#e8f0ec;color:#245443;font-size:7px;font-weight:900}.empty{padding:20px;text-align:center;color:var(--muted);font-size:10px}.hiddenBySearch{display:none!important}.noMatches{display:none;padding:25px;text-align:center;color:var(--muted);font-size:11px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:390px){.page{padding:7px}.grid{grid-template-columns:1fr}.brand h1{font-size:18px}.search{top:56px}}
</style></head><body><header class="top"><div class="brand"><div class="bolt">⚡</div><div><h1 id="pageTitle">Electrical</h1><small>Electrical distribution</small></div></div><a href="/electrical-map.html">← Locations</a></header><main class="page"><section class="intro"><h2>Electrical distribution</h2><p>Grouped by function so you can find the thing you actually came here for.</p></section><div class="search"><input id="mapSearch" type="search" placeholder="Search board, room, iLight, asset code…" autocomplete="off"></div><div id="status" class="empty">Loading electrical distribution…</div><div id="content" hidden><div id="source"></div><div id="groups"></div><div id="noMatches" class="noMatches">No electrical items match that search.</div></div></main><script>
(async()=>{'use strict';const requested=new URLSearchParams(location.search).get('building')||'Main House';if(requested==='Barn'){location.replace('/barn-electrical.html?v=20260901-2');return}if(requested==='Crescent'){location.replace('/crescent-electrical.html?v=20260901-1');return}const cfg=window.LIMEWOOD_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const status=document.getElementById('status'),content=document.getElementById('content'),groupsEl=document.getElementById('groups');const [br,pr]=await Promise.all([sb.from('buildings').select('id,name').order('name'),sb.from('plant_rooms').select('id,name,building_id')]);if(br.error||pr.error){status.textContent='Could not load building directory.';return}const building=(br.data||[]).find(b=>b.name===requested)||(br.data||[])[0];if(!building){status.textContent='No building found.';return}document.getElementById('pageTitle').textContent=building.name+' Electrical';const roomNames=(pr.data||[]).filter(r=>String(r.building_id)===String(building.id)).map(r=>r.name);const [ar,cr]=await Promise.all([sb.from('electrical_assets').select('asset_code,asset_name,plant_room,category,system_duty,distribution_board,upstream_supply,circuit_reference,verification_status').in('plant_room',roomNames).order('asset_code'),sb.from('electrical_circuits').select('board_asset_code,circuit_number')]);if(ar.error){status.textContent='Could not load electrical assets.';return}const all=ar.data||[],circuits=cr.error?[]:(cr.data||[]);const structure=a=>/incoming|incomer|intake|meter|main switch|switchboard|feeder|mcp|motor control|control panel|distribution board|\bdb\b|dimmer|lighting control panel|unit mh/i.test((a.category||'')+' '+(a.asset_name||'')+' '+(a.system_duty||''));const assets=all.filter(structure);const countCircuits=a=>{const keys=[a.asset_code,a.asset_name].filter(Boolean).map(norm);return circuits.filter(c=>keys.includes(norm(c.board_asset_code))).length};const clickable=a=>/switchboard|mcp|control panel|distribution board|\bdb\b|panel|dimmer/i.test((a.category||'')+' '+(a.asset_name||''));const incoming=assets.find(a=>/incoming|incomer|intake|meter/.test(norm((a.category||'')+' '+(a.asset_name||''))))||null;const isILight=a=>/ilight|dimmer|lighting rack|lighting control/i.test(norm((a.asset_name||'')+' '+(a.category||'')+' '+(a.system_duty||'')));const isRoom=a=>/\broom\s*\d+\b|\bunit\s*mh\s*\d+\b|passenger lift|dishwasher pot wash|fire alarm/i.test(norm((a.asset_name||'')+' '+(a.system_duty||'')));const isMain=a=>/switchboard|main switch|feeder|incoming|incomer|intake|meter/i.test(norm((a.asset_name||'')+' '+(a.category||'')));const isDB=a=>/distribution board|\bdb\b/i.test(norm((a.asset_name||'')+' '+(a.category||'')));function card(a){const n=countCircuits(a),verified=/verified|human reviewed/.test(norm(a.verification_status)),click=clickable(a)&&a.asset_code;const tag=n?n+' circuit'+(n===1?'':'s'):(verified?'Verified':'Recorded');return `<${click?'a':'div'} class="node mapItem" data-search="${esc(norm([a.asset_code,a.asset_name,a.plant_room,a.category,a.system_duty,a.distribution_board].join(' ')))}"${click?` href="/electrical-board-circuits.html?board=${encodeURIComponent(a.asset_code)}"`:''}><div class="code">${esc(a.asset_code||'')}</div><h3>${esc(a.asset_name||'Electrical asset')}</h3><p>${esc(a.plant_room||'Location not recorded')}</p><span class="pill">${esc(tag)}</span></${click?'a':'div'}>`}const remainder=assets.filter(a=>a!==incoming);const defs=[{key:'main',icon:'⚡',title:'Main supply & feeders',sub:'Switchboard, incoming supplies and outgoing feeders',test:a=>isMain(a)&&!isILight(a)},{key:'db',icon:'▣',title:'Distribution boards',sub:'DBs grouped together, without lighting controls mixed through them',test:a=>isDB(a)&&!isMain(a)&&!isILight(a)&&!isRoom(a)},{key:'rooms',icon:'⌂',title:'Rooms & local units',sub:'Room supplies, bedroom units and local electrical equipment',test:a=>isRoom(a)&&!isILight(a)},{key:'ilight',icon:'💡',title:'iLight & lighting controls',sub:'All iLight dimmers and lighting control units in one place',test:a=>isILight(a)},{key:'other',icon:'◈',title:'Other controls',sub:'Control panels and electrical items not in the groups above',test:a=>true}];const used=new Set();const rendered=[];for(const d of defs){const items=remainder.filter(a=>!used.has(a)&&d.test(a));items.forEach(a=>used.add(a));if(!items.length)continue;items.sort((a,b)=>String(a.asset_name||'').localeCompare(String(b.asset_name||''),undefined,{numeric:true}));rendered.push(`<section class="section" data-group="${d.key}"><button class="sectionHead" type="button"><span class="sectionIcon">${d.icon}</span><span class="sectionText"><b>${d.title}</b><span class="countText">${items.length} item${items.length===1?'':'s'} · ${d.sub}</span></span><span class="chev">⌄</span></button><div class="sectionBody"><div class="grid">${items.map(card).join('')}</div></div></section>`)}document.getElementById('source').innerHTML=incoming?`<div class="source mapItem" data-search="${esc(norm([incoming.asset_code,incoming.asset_name,incoming.plant_room].join(' ')))}"><small>${esc(incoming.asset_code||building.name.toUpperCase())}</small><b>${esc(incoming.asset_name||'Mains incoming')}</b><span>${esc(incoming.plant_room||'Incoming electrical supply')}</span></div>`:`<div class="source"><small>${esc(building.name.toUpperCase())}</small><b>Mains incoming</b><span>Incoming electrical supply</span></div>`;groupsEl.innerHTML=rendered.join('');document.querySelectorAll('.sectionHead').forEach(b=>b.addEventListener('click',()=>b.closest('.section').classList.toggle('closed')));const search=document.getElementById('mapSearch');search.addEventListener('input',()=>{const q=norm(search.value),sections=[...document.querySelectorAll('.section')];let total=0;document.querySelectorAll('.mapItem').forEach(el=>{const hit=!q||(el.dataset.search||'').includes(q);el.classList.toggle('hiddenBySearch',!hit);if(hit&&el.classList.contains('node'))total++});sections.forEach(s=>{const visible=[...s.querySelectorAll('.node')].filter(n=>!n.classList.contains('hiddenBySearch')).length;s.classList.toggle('hiddenBySearch',!!q&&!visible);if(q&&visible)s.classList.remove('closed')});document.getElementById('noMatches').style.display=q&&total===0?'block':'none'});status.hidden=true;content.hidden=false})();
</script></body></html>
