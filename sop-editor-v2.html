<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17372c">
<title>SOP Editor - Limewood Engineering</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#17372c;--l:#b8cc19;--c:#f6f2e9;--i:#23362f;--line:#dfe5e0}
*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:3;background:var(--g);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
header button,.actions button,.photoActions button{border:0;border-radius:10px;padding:11px 14px;font-weight:800}
.brand{font-weight:900}.sub{font-size:12px;opacity:.75}main{max-width:920px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 24px #0000000d}.top{display:flex;justify-content:space-between;gap:14px;border-bottom:2px solid var(--l);padding-bottom:14px;margin-bottom:16px}.logo{height:50px;max-width:230px;object-fit:contain;background:#111;border-radius:5px;padding:4px 8px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.11em;color:var(--g);margin-top:8px}h1{font:700 30px Georgia,serif;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#536259}input,select,textarea{width:100%;margin-top:5px;padding:11px;border:1px solid #cfd6d1;border-radius:10px;background:#fbfcfa;font:inherit;color:var(--i)}textarea{min-height:98px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:0;background:#fff;padding:12px 0}.save{background:var(--g);color:#fff}.pdf{background:var(--l);color:var(--g)}#msg{font-size:13px;font-weight:800;padding-top:8px}.photoPanel{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#f8faf8}.photoHead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.photoHead h2{margin:0;font-size:18px}.photoHint{font-size:12px;color:#647168;margin-top:3px}.photoActions label{background:var(--g);color:white;padding:10px 12px;border-radius:10px;cursor:pointer}.photoActions input{display:none}.photoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}.photoCard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.photoCard img{display:block;width:100%;height:130px;object-fit:cover;background:#e8ece9}.photoMeta{padding:8px;font-size:11px}.removePhoto{width:100%;background:#eee;color:#6d2f2f;border:0;padding:8px;font-weight:800}.emptyPhotos{font-size:12px;color:#6d756f;padding:8px 0}.loadingbar{height:3px;background:linear-gradient(90deg,var(--l),#e6ef8a,var(--l));background-size:200% 100%;animation:load 1.2s linear infinite}@keyframes load{to{background-position:-200% 0}}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{flex-direction:column}h1{font-size:25px}.actions button{flex:1}.photoGrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div><div class="brand">Limewood Engineering</div><div class="sub">Controlled SOP editor</div></div><button onclick="history.length>1?history.back():location.href='/'">Back</button></header><div id="loadbar" class="loadingbar"></div>
<main><section class="card"><div class="top"><div><div class="eyebrow">LIMEWOOD ENGINEERING</div><div class="eyebrow">CONTROLLED STANDARD OPERATING PROCEDURE</div><h1 id="heading">Loading SOP...</h1></div><div id="badge"></div></div>
<div class="grid"><label>SOP number<input id="number"></label><label>Revision<input id="revision"></label><label class="wide">Title<input id="title"></label><label>Category<input id="category"></label><label>Status<select id="status"><option value="draft">Draft</option><option value="under_review">Under review</option><option value="approved">Approved</option><option value="superseded">Superseded</option></select></label><label>Building<select id="building"><option value="">Estate-wide</option></select></label><label>Plant room<select id="room"><option value="">No plant room</option></select></label><label>Author<input id="author"></label><label>Approved by<input id="approved"></label><label>Issue date<input id="issue" type="date"></label><label>Review date<input id="review" type="date"></label><label class="wide">Purpose<textarea id="purpose"></textarea></label><label class="wide">Scope<textarea id="scope"></textarea></label><label class="wide">PPE / equipment<textarea id="ppe"></textarea></label><label class="wide">Isolation / safety precautions<textarea id="isolation"></textarea></label><label class="wide">Procedure steps<textarea id="steps"></textarea></label><label class="wide">Emergency / abnormal conditions<textarea id="emergency"></textarea></label><label class="wide">Notes<textarea id="notes"></textarea></label></div>
<section class="photoPanel"><div class="photoHead"><div><h2>Photos</h2><div class="photoHint">Add photos directly to this SOP. They will also be included in the PDF.</div></div><div class="photoActions"><label for="photoInput">+ Add photos<input id="photoInput" type="file" accept="image/*" multiple></label></div></div><div id="photoMsg" class="photoHint"></div><div id="photoGrid" class="photoGrid"><div class="emptyPhotos">Loading photos...</div></div></section>
<div id="msg"></div><div class="actions"><button class="pdf" id="pdfBtn">Download PDF</button><button class="save" id="saveBtn">Save changes</button></div></section></main>
<script>
(()=>{'use strict';const SUPABASE_URL='https://sswedojvkqvoqmwhfmkj.supabase.co',SUPABASE_KEY='sb_publishable_BoOHg11kfg6FB3xhQHW-dw_yal1q1Yu',BUCKET='asset-files',MARK='LW_SOP_BUILDER_V1:';const $=id=>document.getElementById(id),db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let sop=null,buildings=[],rooms=[],attachments=[];const params=new URLSearchParams(location.search),num=(params.get('number')||'').trim();const val=id=>$(id).value.trim(),set=(id,v)=>{$(id).value=v??''};function parse(v){v=String(v||'');if(!v.startsWith(MARK))return{notes:v};try{return JSON.parse(v.slice(MARK.length))}catch{return{notes:v}}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeName(v){return String(v||'photo').replace(/[^a-zA-Z0-9._-]+/g,'_')}function fillSop(data){sop=data;const d=parse(data.description);$('heading').textContent=data.title||data.sop_number;$('badge').textContent=(data.status||'draft').replaceAll('_',' ');set('number',data.sop_number);set('revision',data.revision||'1');set('title',data.title);set('category',data.category);set('status',data.status||'draft');set('author',data.author);set('approved',data.approved_by);set('issue',data.issue_date);set('review',data.review_date);set('purpose',d.purpose);set('scope',d.scope);set('ppe',d.ppe);set('isolation',d.isolation);set('steps',d.steps);set('emergency',d.emergency);set('notes',d.notes)}async function loadSop(){if(!num)throw new Error('SOP number missing');const{data,error}=await db.from('sops').select('*').eq('sop_number',num).maybeSingle();if(error||!data)throw error||new Error('Could not find '+num);fillSop(data);$('loadbar').style.display='none'}async function directory(){const[b,r]=await Promise.all([db.from('buildings').select('id,name').order('name'),db.from('plant_rooms').select('id,name,building_id').order('name')]);buildings=b.data||[];rooms=r.data||[];$('building').innerHTML='<option value="">Estate-wide</option>'+buildings.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('building').value=sop?.building_id||'';fillRooms();$('room').value=sop?.plant_room_id||''}function fillRooms(){const b=$('building').value,old=$('room').value,list=b?rooms.filter(x=>String(x.building_id)===String(b)):rooms;$('room').innerHTML='<option value="">No plant room</option>'+list.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');if(list.some(x=>String(x.id)===String(old)))$('room').value=old}$('building').addEventListener('change',fillRooms);async function loadPhotos(){if(!sop)return;const host=$('photoGrid');const{data,error}=await db.from('sop_attachments').select('*').eq('sop_id',sop.id).order('sort_order').order('created_at');if(error){host.innerHTML='<div class="emptyPhotos">Could not load photos.</div>';return}attachments=data||[];if(!attachments.length){host.innerHTML='<div class="emptyPhotos">No photos added yet.</div>';return}const paths=attachments.map(a=>a.storage_path),{data:signed}=await db.storage.from(BUCKET).createSignedUrls(paths,3600),urls={};(signed||[]).forEach((x,i)=>urls[paths[i]]=x.signedUrl||'');host.innerHTML=attachments.map(a=>'<article class="photoCard">'+(urls[a.storage_path]?'<img src="'+esc(urls[a.storage_path])+'" alt="">':'')+'<div class="photoMeta">'+esc(a.caption||a.file_name||'Photo')+'</div><button class="removePhoto" data-remove="'+a.id+'" type="button">Remove</button></article>').join('');host.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removePhoto(b.dataset.remove))}async function uploadPhotos(files){if(!sop||!files.length)return;const m=$('photoMsg');m.textContent='Uploading '+files.length+' photo'+(files.length===1?'':'s')+'...';const{data:s}=await db.auth.getSession(),uid=s?.session?.user?.id;if(!uid){m.textContent='Session expired. Sign in again.';return}let order=attachments.length;for(const file of files){const path='sop-attachments/'+sop.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+safeName(file.name);const up=await db.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(up.error){m.textContent='Upload failed: '+up.error.message;return}const ins=await db.from('sop_attachments').insert({sop_id:sop.id,storage_path:path,file_name:file.name,caption:file.name,sort_order:order++,created_by:uid});if(ins.error){m.textContent='Link failed: '+ins.error.message;return}}m.textContent='Photos added.';$('photoInput').value='';await loadPhotos()}$('photoInput').addEventListener('change',e=>uploadPhotos([...e.target.files]));async function removePhoto(id){const row=attachments.find(a=>String(a.id)===String(id));if(!row||!confirm('Remove this photo from the SOP?'))return;const d=await db.from('sop_attachments').delete().eq('id',id);if(d.error){$('photoMsg').textContent=d.error.message;return}await db.storage.from(BUCKET).remove([row.storage_path]);await loadPhotos()}async function save(){if(!sop)return;const{data:s}=await db.auth.getSession(),uid=s?.session?.user?.id;if(!uid){$('msg').textContent='Session expired. Sign in again.';return}const detail={purpose:val('purpose'),scope:val('scope'),ppe:val('ppe'),isolation:val('isolation'),steps:val('steps'),emergency:val('emergency'),notes:val('notes')},p={sop_number:val('number'),revision:val('revision')||'1',title:val('title'),category:val('category')||'General',status:val('status')||'draft',building_id:val('building')||null,plant_room_id:val('room')||null,author:val('author')||null,approved_by:val('approved')||null,issue_date:val('issue')||null,review_date:val('review')||null,description:MARK+JSON.stringify(detail),updated_by:uid};$('msg').textContent='Saving...';const{data,error}=await db.from('sops').update(p).eq('id',sop.id).select('*').single();if(error){$('msg').textContent=error.message;return}fillSop(data);$('msg').textContent='Saved.'}async function loadJsPdf(){if(window.jspdf?.jsPDF)return window.jspdf.jsPDF;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});return window.jspdf.jsPDF}async function imageData(url){try{const r=await fetch(url),b=await r.blob();return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}catch{return null}}async function downloadPdf(){if(!sop)return;const btn=$('pdfBtn');btn.disabled=true;btn.textContent='Building PDF...';try{const jsPDF=await loadJsPdf(),d=new jsPDF({unit:'mm',format:'a4'}),detail=parse(sop.description),green=[23,55,44],lime=[184,204,25],cream=[246,242,233],ink=[35,54,47];function header(){d.setFillColor(...cream);d.rect(0,0,210,29,'F');d.setTextColor(...green);d.setFont('times','bold');d.setFontSize(19);d.text('LIME WOOD',15,14);d.setDrawColor(...lime);d.setLineWidth(.8);d.line(83,5,83,23);d.setFont('helvetica','bold');d.setFontSize(10);d.text('LIMEWOOD ENGINEERING',92,12);d.setFontSize(6.5);d.text('CONTROLLED STANDARD OPERATING PROCEDURE',92,19);d.line(0,29,210,29)}function footer(p,n){d.setFillColor(...cream);d.rect(0,282,210,15,'F');d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(6.5);d.text((sop.sop_number||'SOP')+' - REVISION '+(sop.revision||'1'),15,290);d.text('PAGE '+p+' OF '+n,195,290,{align:'right'})}function sec(n,t,text,y){text=String(text||'').trim();if(!text)return y;const lines=d.splitTextToSize(text,158),need=14+lines.length*4.3;if(y+need>274){d.addPage();header();y=40}d.setTextColor(...lime);d.setFont('helvetica','bold');d.setFontSize(9);d.text(String(n),18,y);d.setTextColor(...green);d.text(t.toUpperCase(),28,y);d.setTextColor(...ink);d.setFont('helvetica','normal');d.setFontSize(8.5);d.text(lines,28,y+6);return y+10+lines.length*4.3}header();let y=41;d.setTextColor(...lime);d.setFont('helvetica','bold');d.setFontSize(7.5);d.text(sop.sop_number||'SOP',15,y);d.setTextColor(...green);d.setFont('times','bold');d.setFontSize(18);const tl=d.splitTextToSize(sop.title||'Untitled SOP',178);d.text(tl,15,y+9);y+=15+tl.length*7;const meta=[['STATUS',sop.status||'draft'],['REVISION',sop.revision||'1'],['CATEGORY',sop.category||'General'],['AUTHOR',sop.author||'-'],['ISSUE DATE',sop.issue_date||'-'],['REVIEW DATE',sop.review_date||'-']];meta.forEach((m,i)=>{const x=15+(i%2)*91,yy=y+Math.floor(i/2)*13;d.setFillColor(255,255,251);d.setDrawColor(218,220,201);d.roundedRect(x,yy,86,10,2,2,'FD');d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(6);d.text(m[0],x+4,yy+4);d.setTextColor(...ink);d.setFont('helvetica','normal');d.setFontSize(7.5);d.text(String(m[1]).replaceAll('_',' '),x+4,yy+8)});y+=42;y=sec(1,'Purpose',detail.purpose,y);y=sec(2,'Scope',detail.scope,y);y=sec(3,'PPE / Equipment',detail.ppe,y);y=sec(4,'Isolation / Safety Precautions',detail.isolation,y);y=sec(5,'Procedure',detail.steps,y);y=sec(6,'Emergency / Abnormal Conditions',detail.emergency,y);y=sec(7,'Notes',detail.notes,y);if(attachments.length){const paths=attachments.map(a=>a.storage_path),{data:signed}=await db.storage.from(BUCKET).createSignedUrls(paths,3600);for(let i=0;i<attachments.length;i++){const url=signed?.[i]?.signedUrl;if(!url)continue;const data=await imageData(url);if(!data)continue;d.addPage();header();d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(9);d.text('PHOTO '+(i+1),15,41);d.setFont('helvetica','normal');d.setFontSize(7);d.text(attachments[i].caption||attachments[i].file_name||'SOP photo',15,47);try{const img=new Image();img.src=data;await new Promise(res=>{img.onload=res;img.onerror=res});const maxW=180,maxH=220,ratio=Math.min(maxW/img.width,maxH/img.height),w=img.width*ratio,h=img.height*ratio;d.addImage(data,'JPEG',15,54,w,h)}catch{}}}const pages=d.getNumberOfPages();for(let p=1;p<=pages;p++){d.setPage(p);footer(p,pages)}d.save(safeName(sop.sop_number||'SOP')+'_'+safeName(sop.title||'')+'.pdf')}catch(e){alert('Could not create PDF: '+(e?.message||e))}finally{btn.disabled=false;btn.textContent='Download PDF'}}$('saveBtn').addEventListener('click',save);$('pdfBtn').addEventListener('click',downloadPdf);(async()=>{try{await loadSop();Promise.allSettled([directory(),loadPhotos()]);if(params.get('download')==='1')setTimeout(downloadPdf,150)}catch(e){$('heading').textContent='Could not load SOP';$('msg').textContent=e?.message||e;$('loadbar').style.display='none'}})()})();
</script></body></html>
