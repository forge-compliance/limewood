<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17332d">
  <title>Lime Wood Engineering</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div>
    <h1>Lime Wood Engineering</h1>
    <p>Staff House Boiler Room</p>
  </div>
  <button id="installBtn" hidden>Install</button>
</header>

<main>
  <section class="toolbar">
    <input id="search" type="search" placeholder="Search asset, model or serial number">
    <select id="typeFilter">
      <option value="">All equipment</option>
    </select>
  </section>

  <section class="stats" id="stats"></section>
  <section id="assetList" class="asset-list"></section>
</main>

<dialog id="assetDialog">
  <article>
    <button class="close" id="closeDialog">×</button>
    <div id="assetDetail"></div>
  </article>
</dialog>

<script src="app.js"></script>
</body>
</html>
