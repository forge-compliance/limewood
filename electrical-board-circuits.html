<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Electrical Circuit Schedule</title><link rel="stylesheet" href="/assets/style.css?v=20260901-mcp-links"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js?v=20260901-auth2"></script><style>:root{--g:#173d33;--gold:#c6a96a;--cream:#f4f0e8;--muted:#6f7b76}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1f2b27;font-family:Arial,Helvetica,sans-serif}.top{background:var(--g);color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:17px;margin:0}.top small{opacity:.7}.top button{border:1px solid #ffffff35;background:#ffffff12;color:#fff;padding:9px 10px;border-radius:8px;font-weight:700}.page{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #d9d6cf;border-radius:14px;overflow:hidden}.head{padding:14px;border-bottom:1px solid #e7e2d8}.code{font-size:10px;font-weight:800;color:#8a7650}.head h2{margin:4px 0 2px;color:var(--g);font-size:22px}.head p{margin:0;color:var(--muted);font-size:12px}.mcpNote{display:none;margin:10px 14px 0;padding:9px;border-radius:9px;background:#eef3f0;color:#40534b;font-size:10px}.status{margin:14px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;background:#f1efe9;padding:9px}td{padding:9px;border-bottom:1px solid #ebe8e1;vertical-align:top}.verified{font-weight:800;color:var(--g)}.assetLinkCell{min-width:110px}.assetBtn{border:0;border-radius:999px;padding:6px 8px;font-size:9px;font-weight:800;cursor:pointer;white-space:nowrap}.linkBtn{background:var(--g);color:#fff}.changeBtn{background:#efede7;color:#666}.openBtn{display:inline-block;background:#eaf1ed;color:var(--g);text-decoration:none;margin-right:4px}.linkedAsset{display:block;margin-top:4px;font-size:8px;color:#6f7b76}.modalBack{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:flex-end;justify-content:center}.modalBack.show{display:flex}.modal{background:#fff;width:min(680px,100%);max-height:82vh;border-radius:18px 18px 0 0;padding:14px;display:flex;flex-direction:column}.modalHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.modalHead h3{margin:0;color:var(--g);font-size:18px}.close{border:0;background:#eee;border-radius:9px;padding:8px 10px;font-weight:900}.search{width:100%;margin:10px 0 7px;border:1px solid #ccc;border-radius:10px;padding:11px;font-size:16px}.results{overflow:auto;display:grid;gap:6px}.result{border:1px solid #ddd;background:#faf9f6;border-radius:10px;padding:9px;text-align:left;cursor:pointer}.result b{display:block;color:var(--g);font-size:12px}.result small{display:block;color:#777;margin-top:2px}.empty{padding:18px;text-align:center;color:#777;font-size:11px}.unlink{margin-top:8px;border:0;background:#f0e9e7;color:#7c3c31;border-radius:9px;padding:8px;font-weight:800;display:none}@media(max-width:560px){.page{padding:7px}.tableWrap{overflow:auto}table{min-width:650px}}</style></head><body><header class="top"><div><h1>Electrical Circuit Schedule</h1><small>Live verified register</small></div><button id="backBtn">← Schematic</button></header><main class="page"><section class="card"><div class="head"><div class="code" id="code">BOARD</div><h2 id="name">Loading…</h2><p id="meta">Loading board details…</p></div><div id="mcpNote" class="mcpNote">MCP outputs can be linked directly to the physical asset they control. Use <b>Link asset</b> on any row.</div><div id="content" class="status">Loading circuit schedule…</div></section></main><div id="modalBack" class="modalBack"><div class="modal"><div class="modalHead"><div><h3 id="modalTitle">Link asset</h3><small id="modalSub"></small></div><button id="close" class="close">✕</button></div><input id="search" class="search" type="search" placeholder="Search asset code or name…" autocomplete="off"><div id="results" class="results"></div><button id="unlink" class="unlink">Remove current link</button></div></div><script>(async function(){'use strict';const p=new URLSearchParams(location.search),code=(p.get('board')||'').trim();document.getElementById('backBtn').onclick=()=>history.length>1?history.back():location.href='/electrical-map.html';document.getElementById('code').textContent=code||'BOARD';if(!code||code.length>80||/[<>"']/.test(code)){document.getElementById('name').textContent='Invalid board';document.getElementById('content').textContent='No valid board code was supplied.';return}const cfg=window.LIMEWOOD_CONFIG||{};if(!window.supabase||!cfg.supabaseUrl||!cfg.supabasePublishableKey){document.getElementById('name').textContent=code;document.getElementById('content').textContent='Database connection unavailable.';return}const c=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const {data:sd}=await c.auth.getSession();if(!sd.session){location.href='/';return}const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const a=await c.from('electrical_assets').select('asset_code,asset_name,plant_room,status,distribution_board,upstream_supply,category,system_duty').eq('asset_code',code).maybeSingle();const assetName=a.data?.asset_name||code;document.getElementById('name').textContent=assetName;document.getElementById('meta').textContent=[a.data?.plant_room,a.data?.upstream_supply?`Supply: ${a.data.upstream_supply}`:null,a.data?.status].filter(Boolean).join(' · ')||'Electrical asset';const isMcp=/\bmcp\b|motor control|control panel/i.test([assetName,a.data?.category,a.data?.system_duty].filter(Boolean).join(' '));if(isMcp)document.getElementById('mcpNote').style.display='block';const [r,lr,ar]=await Promise.all([c.from('electrical_circuits').select('circuit_number,circuit_description,phase,protective_device,device_rating,status').eq('board_asset_code',code),isMcp?c.from('mcp_function_asset_links').select('function_number,function_name,asset_id,assets(id,asset_code,asset_name,category,exact_location)').eq('panel_code',code):Promise.resolve({data:[],error:null}),isMcp?c.from('assets').select('id,asset_code,asset_name,category,exact_location').order('asset_name').limit(2000):Promise.resolve({data:[],error:null})]);if(r.error){document.getElementById('content').textContent='Could not load this circuit schedule.';return}const rows=(r.data||[]).sort((x,y)=>String(x.circuit_number||'').localeCompare(String(y.circuit_number||''),undefined,{numeric:true}));if(!rows.length){document.getElementById('content').textContent=isMcp?'No outgoing MCP function schedule is recorded yet. Once functions are added, each one will have a Link asset control automatically.':'No outgoing circuit schedule recorded for this asset.';return}let links=new Map((lr.data||[]).map(x=>[Number(x.function_number),x])),assets=ar.data||[],activeNo=null,activeName='';const rowNo=(row,i)=>{const n=Number.parseInt(String(row.circuit_number||''),10);return Number.isFinite(n)&&n>0?n:i+1};function assetCell(row,i){if(!isMcp)return'';const n=rowNo(row,i),l=links.get(n),aa=l&&l.assets;if(aa){return `<td class="assetLinkCell"><a class="assetBtn openBtn" href="/?asset=${encodeURIComponent(aa.asset_code||'')}&return=${encodeURIComponent(location.pathname+location.search)}">Open ›</a><button class="assetBtn changeBtn" data-link="${n}" data-name="${esc(row.circuit_description||('Function '+n))}">Change</button><span class="linkedAsset">${esc(aa.asset_code||'')} · ${esc(aa.asset_name||'')}</span></td>`}return `<td class="assetLinkCell"><button class="assetBtn linkBtn" data-link="${n}" data-name="${esc(row.circuit_description||('Function '+n))}">Link asset</button></td>`}function render(){document.getElementById('content').className='tableWrap';document.getElementById('content').innerHTML=`<table><thead><tr><th>Circuit</th><th>Description</th><th>Phase</th><th>Device</th><th>Rating</th><th>Status</th>${isMcp?'<th>Controlled asset</th>':''}</tr></thead><tbody>${rows.map((x,i)=>`<tr><td><b>${esc(x.circuit_number)}</b></td><td>${esc(x.circuit_description||'—')}</td><td>${esc(x.phase||'—')}</td><td>${esc(x.protective_device||'—')}</td><td>${esc(x.device_rating||'—')}</td><td class="${String(x.status).toLowerCase()==='verified'?'verified':''}">${esc(x.status||'—')}</td>${assetCell(x,i)}</tr>`).join('')}</tbody></table>`}render();if(!isMcp)return;const back=document.getElementById('modalBack'),search=document.getElementById('search'),results=document.getElementById('results'),title=document.getElementById('modalTitle'),sub=document.getElementById('modalSub'),unlink=document.getElementById('unlink');function showResults(q){const terms=String(q||'').toLowerCase().trim().split(/\s+/).filter(Boolean);let found=assets.filter(v=>{const hay=[v.asset_code,v.asset_name,v.category,v.exact_location].join(' ').toLowerCase();return terms.every(t=>hay.includes(t))});found=found.slice(0,terms.length?60:30);results.innerHTML=found.length?found.map(v=>`<button class="result" data-asset="${v.id}"><b>${esc(v.asset_code||'No code')} · ${esc(v.asset_name||'Unnamed asset')}</b><small>${esc([v.category,v.exact_location].filter(Boolean).join(' · ')||'Asset register')}</small></button>`).join(''):'<div class="empty">No matching assets found.</div>'}function openModal(n,name){activeNo=n;activeName=name;const current=links.get(n);title.textContent=current&&current.assets?'Change linked asset':'Link asset';sub.textContent=`${code} · ${name}`;search.value='';unlink.style.display=current&&current.asset_id?'block':'none';back.classList.add('show');showResults('');setTimeout(()=>search.focus(),50)}async function linkAsset(id){const {data:userData}=await c.auth.getUser();const payload={panel_code:code,function_number:activeNo,function_name:activeName,asset_id:id,linked_by:userData?.user?.id||null,updated_at:new Date().toISOString()};const {error}=await c.from('mcp_function_asset_links').upsert(payload,{onConflict:'panel_code,function_number'});if(error){alert('Could not save asset link: '+error.message);return}back.classList.remove('show');location.reload()}async function removeLink(){const {error}=await c.from('mcp_function_asset_links').delete().eq('panel_code',code).eq('function_number',activeNo);if(error){alert('Could not remove link: '+error.message);return}back.classList.remove('show');location.reload()}document.getElementById('content').addEventListener('click',e=>{const b=e.target.closest('[data-link]');if(b)openModal(Number(b.dataset.link),b.dataset.name||'MCP function')});search.addEventListener('input',()=>showResults(search.value));results.addEventListener('click',e=>{const b=e.target.closest('[data-asset]');if(b)linkAsset(b.dataset.asset)});document.getElementById('close').onclick=()=>back.classList.remove('show');unlink.onclick=removeLink;back.addEventListener('click',e=>{if(e.target===back)back.classList.remove('show')})})();</script></body></html>
