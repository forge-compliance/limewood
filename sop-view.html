<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17372c">
  <title>SOP - Limewood Engineering</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--green:#17372c;--lime:#b8cc19;--cream:#f6f2e9;--ink:#23362f;--line:#d9e0db;--gold:#b98a2e}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--green);color:#fff}
    header b{display:block;font-size:17px}header small{opacity:.72}button,a.action{border:0;border-radius:10px;padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}
    header button{background:#fff;color:var(--green)}main{max-width:900px;margin:auto;padding:16px}.sheet{background:#fff;border-radius:18px;box-shadow:0 8px 28px #0001;overflow:hidden}
    .hero{padding:22px;border-bottom:3px solid var(--lime);background:linear-gradient(135deg,#fff,#f8faef)}.eyebrow{color:#73840e;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:5px 0 10px;color:var(--green);font:700 32px Georgia,serif;line-height:1.1}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.meta div{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}.meta b,.meta span{display:block}.meta b{font-size:10px;color:#68756e;text-transform:uppercase}.approved{color:#547000;font-weight:900}
    .content{padding:20px}.section{margin:0 0 22px}.section h2{margin:0 0 8px;color:var(--green);font:700 23px Georgia,serif}.section p{margin:0;white-space:pre-line}.notice{padding:13px;border-left:5px solid var(--gold);background:#fff8e8;border-radius:8px}
    .where{padding:16px;border:2px solid var(--lime);background:#f9fbe9;border-radius:14px}.where h2{display:flex;align-items:center;gap:8px}.where p{font-weight:700}
    .photoSection{margin:0 0 24px}.photoSection h2{margin:0 0 10px;color:var(--green);font:700 23px Georgia,serif}.photoGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.photoCard{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#f9faf8}.photoCard img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;background:#eef1ee}.photoCard figcaption{padding:10px 12px;font-weight:800;color:#45564f}.photoCard figcaption small{display:block;margin-top:3px;font-weight:500;color:#75817b}
    .choose{margin:0 0 12px;color:var(--green);font:800 13px system-ui;text-transform:uppercase;letter-spacing:.08em}.serviceGrid{display:grid;gap:12px;margin:0 0 24px}.serviceCard{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.serviceHead{padding:13px 15px;color:#fff;background:var(--green)}.serviceHead b{display:block;font-size:21px}.serviceHead small{display:block;margin-top:2px;font-weight:700}.serviceBody{padding:14px 15px}.serviceBody ol{margin:0;padding-left:22px}.serviceBody li{margin:0 0 9px}.serviceBody li:last-child{margin-bottom:0}.cold .serviceHead{background:#176ca4}.hot .serviceHead{background:#a8402a}.heating .serviceHead{background:#806019}.electrical .serviceHead{background:#765400}.gas .serviceHead{background:#7a342d}.pool .serviceHead{background:#087784}.proof,.restore,.warning{margin-top:12px;padding:10px 12px;border-radius:9px;font-weight:800}.proof{background:#eef5ed;color:#254b35}.restore{background:#eef3f8;color:#24465f}.warning{background:#fff2df;color:#753d0a}
    .actions{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px 22px}.actions .pdf{background:var(--lime);color:var(--green)}.actions .back{background:var(--green);color:#fff}.error{padding:30px;text-align:center;color:#7c2d2d}
    @media(max-width:620px){h1{font-size:27px}.meta{grid-template-columns:1fr 1fr}.content{padding:16px}.actions{padding:0 16px 18px}.actions a{flex:1;text-align:center}.photoGrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div><b>Limewood Engineering</b><small>Controlled SOP</small></div><button type="button" onclick="history.length>1?history.back():location.href='/'">Back</button></header>
  <main><article class="sheet" id="sheet"><div class="error">Loading approved procedure…</div></article></main>
  <script>
  (()=>{'use strict';
    const U='https://sswedojvkqvoqmwhfmkj.supabase.co',K='sb_publishable_BoOHg11kfg6FB3xhQHW-dw_yal1q1Yu',MARK='LW_SOP_BUILDER_V1:';
    const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),number=(new URLSearchParams(location.search).get('number')||'').trim(),sheet=document.getElementById('sheet');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function detail(v){v=String(v||'');if(!v.startsWith(MARK))return{notes:v};try{return JSON.parse(v.slice(MARK.length))}catch{return{notes:v}}}
    function sec(title,text,notice=false,extra=''){return text?`<section class="section${notice?' notice':''}${extra?' '+extra:''}"><h2>${esc(title)}</h2><p>${esc(text)}</p></section>`:''}
    function lines(v){return String(v||'').split(/\n+/).map(x=>x.replace(/^\s*(?:\d+[.)]|[-•])\s*/, '').trim()).filter(Boolean)}
    function actionCards(d,sop){let items=Array.isArray(d.service_actions)?d.service_actions:Array.isArray(d.action_groups)?d.action_groups:[];let heading=d.action_heading||'Choose the affected service';if(!items.length&&d.steps){items=[{key:String(sop.category||'').toLowerCase().includes('pool')?'pool':'general',title:'STEP-BY-STEP PROCEDURE',when:d.scope||'Use this procedure for the task described above.',steps:lines(d.steps),prove:d.prove||'',restore:d.reinstatement||''}];heading='Follow these instructions in order'}if(!items.length)return'';return`<div class="choose">${esc(heading)}</div><div class="serviceGrid">${items.map(x=>`<section class="serviceCard ${esc(x.key||'general')}"><div class="serviceHead"><b>${esc(x.title||'SERVICE / TASK')}</b><small>${esc(x.when||'')}</small></div><div class="serviceBody">${x.warning?`<div class="warning">⚠ Before you start: ${esc(x.warning)}</div>`:''}<ol>${(x.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${x.prove?`<div class="proof">✓ Prove it: ${esc(x.prove)}</div>`:''}${x.restore?`<div class="restore">↻ Put it back: ${esc(x.restore)}</div>`:''}</div></section>`).join('')}</div>`}
    function photoHtml(rows){
      if(!rows?.length)return'';
      const cards=rows.map(r=>{const p=r.photo_inbox||r.photo_inbox_id||{},path=p.storage_path||r.storage_path||'',name=p.original_filename||r.file_name||'';if(!path)return'';const url=db.storage.from('asset-files').getPublicUrl(path).data.publicUrl;return `<figure class="photoCard"><img src="${esc(url)}" alt="${esc(r.caption||name||'SOP reference photo')}" loading="lazy"><figcaption>${esc(r.caption||'Approved reference photo')}${name?`<small>${esc(name)}</small>`:''}</figcaption></figure>`}).join('');
      return cards?`<section class="photoSection"><h2>Photos & locations</h2><div class="photoGrid">${cards}</div></section>`:'';
    }
    async function run(){
      if(!number)throw Error('SOP number missing.');
      const{data:sop,error}=await db.from('sops').select('*').eq('sop_number',number).maybeSingle();if(error||!sop)throw error||Error('SOP not found.');
      const {data:photos,error:photoErr}=await db.from('sop_photos').select('caption,sort_order,photo_inbox:photo_inbox_id(storage_path,original_filename)').eq('sop_id',sop.id).order('sort_order',{ascending:true});
      if(photoErr)console.warn('SOP photos unavailable',photoErr.message);
      const d=detail(sop.description);document.title=(sop.title||number)+' - Limewood Engineering';
      const hasCards=(Array.isArray(d.service_actions)&&d.service_actions.length)||(Array.isArray(d.action_groups)&&d.action_groups.length);
      sheet.innerHTML=`<div class="hero"><div class="eyebrow">Controlled standard operating procedure</div><h1>${esc(sop.title||number)}</h1><div class="meta"><div><b>Document</b><span>${esc(sop.sop_number)}</span></div><div><b>Revision</b><span>${esc(sop.revision||'1')}</span></div><div><b>Status</b><span class="approved">${esc((sop.status||'draft').replaceAll('_',' '))}</span></div><div><b>Author</b><span>${esc(sop.author||'—')}</span></div><div><b>Approved by</b><span>${esc(sop.approved_by||'—')}</span></div><div><b>Issue date</b><span>${esc(sop.issue_date||'—')}</span></div></div></div><div class="content">${sec('📍 Where to find it',d.location,false,'where')}${photoHtml(photos||[])}${actionCards(d,sop)}${sec('Before starting',d.ppe)}${hasCards?sec('Full procedure — engineering detail',d.steps):''}${hasCards?sec('Reinstatement',d.reinstatement):''}${sec('Emergency or failed isolation',d.emergency,true)}${sec('Technical reference',d.isolation)}${sec('Operating notes',d.notes)}</div><div class="actions"><a class="action pdf" href="/sop-pdf.html?number=${encodeURIComponent(sop.sop_number)}">Download PDF</a><a class="action back" href="/">Back to dashboard</a></div>`;
    }
    run().catch(e=>sheet.innerHTML='<div class="error"><b>Could not open this SOP.</b><br>'+esc(e?.message||e)+'</div>');
  })();
  </script>
</body>
</html>
