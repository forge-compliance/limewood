<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Building SOP PDF</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px system-ui;background:#f6f2e9;color:#17372c;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:24px;border-radius:16px;max-width:440px;text-align:center;box-shadow:0 8px 24px #0001}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;background:#17372c;color:#fff}</style></head><body><div class="box"><h2>Building SOP PDF</h2><p id="msg">Loading SOP...</p><button id="back" hidden onclick="history.back()">Back</button></div><script>
(()=>{'use strict';
const LOGO='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA4QAAAD4CAYAAAB1q8f9AAAB...';
const SUPABASE_URL='https://sswedojvkqvoqmwhfmkj.supabase.co',SUPABASE_KEY='sb_publishable_BoOHg11kfg6FB3xhQHW-dw_yal1q1Yu',BUCKET='asset-files',MARK='LW_SOP_BUILDER_V1:';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),params=new URLSearchParams(location.search),num=(params.get('number')||'').trim(),msg=document.getElementById('msg');
function parse(v){v=String(v||'');if(!v.startsWith(MARK))return{notes:v};try{return JSON.parse(v.slice(MARK.length))}catch{return{notes:v}}}function safe(v){return String(v||'SOP').replace(/[^a-zA-Z0-9._-]+/g,'_')}async function jsPdf(){if(window.jspdf?.jsPDF)return window.jspdf.jsPDF;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});return window.jspdf.jsPDF}async function imageData(url){try{const r=await fetch(url),b=await r.blob();return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}catch{return null}}
async function run(){try{if(!num)throw new Error('SOP number missing');const{data:sop,error}=await db.from('sops').select('*').eq('sop_number',num).maybeSingle();if(error||!sop)throw error||new Error('SOP not found');const detail=parse(sop.description),att=await db.from('sop_attachments').select('*').eq('sop_id',sop.id).order('sort_order').order('created_at'),attachments=att.data||[];msg.textContent='Creating PDF...';const J=await jsPdf(),d=new J({unit:'mm',format:'a4'}),green=[23,55,44],lime=[184,204,25],cream=[246,242,233],ink=[35,54,47];
function header(){d.setFillColor(...cream);d.rect(0,0,210,29,'F');try{d.addImage(LOGO,'PNG',14,5.8,62,17)}catch(e){console.warn('logo',e)}d.setDrawColor(...lime);d.setLineWidth(.8);d.line(83,5,83,23);d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(10);d.text('LIMEWOOD ENGINEERING',92,12);d.setFontSize(6.5);d.text('CONTROLLED STANDARD OPERATING PROCEDURE',92,19);d.line(0,29,210,29)}
function footer(p,n){d.setFillColor(...cream);d.rect(0,282,210,15,'F');d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(6.5);d.text((sop.sop_number||'SOP')+' - REVISION '+(sop.revision||'1'),15,290);d.text('PAGE '+p+' OF '+n,195,290,{align:'right'})}
function sec(n,t,text,y){text=String(text||'').trim();if(!text)return y;const lines=d.splitTextToSize(text,158),need=14+lines.length*4.3;if(y+need>274){d.addPage();header();y=40}d.setTextColor(...lime);d.setFont('helvetica','bold');d.setFontSize(9);d.text(String(n),18,y);d.setTextColor(...green);d.text(t.toUpperCase(),28,y);d.setTextColor(...ink);d.setFont('helvetica','normal');d.setFontSize(8.5);d.text(lines,28,y+6);return y+10+lines.length*4.3}
header();let y=41;d.setTextColor(...lime);d.setFont('helvetica','bold');d.setFontSize(7.5);d.text(sop.sop_number||'SOP',15,y);d.setTextColor(...green);d.setFont('times','bold');d.setFontSize(18);const tl=d.splitTextToSize(sop.title||'Untitled SOP',178);d.text(tl,15,y+9);y+=15+tl.length*7;const meta=[['STATUS',sop.status||'draft'],['REVISION',sop.revision||'1'],['CATEGORY',sop.category||'General'],['AUTHOR',sop.author||'-'],['ISSUE DATE',sop.issue_date||'-'],['REVIEW DATE',sop.review_date||'-']];meta.forEach((m,i)=>{const x=15+(i%2)*91,yy=y+Math.floor(i/2)*13;d.setFillColor(255,255,251);d.setDrawColor(218,220,201);d.roundedRect(x,yy,86,10,2,2,'FD');d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(6);d.text(m[0],x+4,yy+4);d.setTextColor(...ink);d.setFont('helvetica','normal');d.setFontSize(7.5);d.text(String(m[1]).replaceAll('_',' '),x+4,yy+8)});y+=42;y=sec(1,'Purpose',detail.purpose,y);y=sec(2,'Scope',detail.scope,y);y=sec(3,'PPE / Equipment',detail.ppe,y);y=sec(4,'Isolation / Safety Precautions',detail.isolation,y);y=sec(5,'Procedure',detail.steps,y);y=sec(6,'Emergency / Abnormal Conditions',detail.emergency,y);y=sec(7,'Notes',detail.notes,y);
if((attachments||[]).length){const paths=attachments.map(a=>a.storage_path),{data:signed}=await db.storage.from(BUCKET).createSignedUrls(paths,3600);for(let i=0;i<attachments.length;i++){const url=signed?.[i]?.signedUrl;if(!url)continue;const data=await imageData(url);if(!data)continue;d.addPage();header();d.setTextColor(...green);d.setFont('helvetica','bold');d.setFontSize(9);d.text('PHOTO '+(i+1),15,41);d.setFont('helvetica','normal');d.setFontSize(7);d.text(attachments[i].caption||attachments[i].file_name||'SOP photo',15,47);try{const img=new Image();img.src=data;await new Promise(res=>{img.onload=res;img.onerror=res});const ratio=Math.min(180/img.width,220/img.height),w=img.width*ratio,h=img.height*ratio;d.addImage(data,'JPEG',15,54,w,h)}catch{}}}
const pages=d.getNumberOfPages();for(let p=1;p<=pages;p++){d.setPage(p);footer(p,pages)}d.save(safe(sop.sop_number)+'_'+safe(sop.title)+'.pdf');msg.textContent='PDF downloaded.';document.getElementById('back').hidden=false}catch(e){msg.textContent='Could not create PDF: '+(e?.message||e);document.getElementById('back').hidden=false}}
run();
})();</script></body></html>
