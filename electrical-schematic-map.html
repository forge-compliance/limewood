<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Electrical Distribution Schematic</title><link rel="stylesheet" href="/assets/style.css?v=607"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/config.js?v=20260901-auth2"></script><script defer src="/assets/site-sidebar.js"></script><style>
:root{--g:#173d33;--gold:#c6a96a;--cream:#f4f0e8;--muted:#6f7b76;--card:#faf9f6;--line:#b8ded0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1f2b27;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:8px}.bolt{width:36px;height:36px;border-radius:10px;background:#54230a;color:#ffd46a;display:grid;place-items:center;font-size:20px}.brand h1{font:700 19px Georgia,serif;margin:0;line-height:1}.brand small{opacity:.72;font-size:9px}.top a{border:1px solid #ffffff35;background:#ffffff12;color:#fff;padding:9px 10px;border-radius:9px;font-weight:800;text-decoration:none;font-size:10px}.page{max-width:980px;margin:auto;padding:10px}.intro{padding:8px 0 10px}.intro h2{margin:0;color:var(--g);font-size:20px}.intro p{margin:4px 0 0;color:var(--muted);font-size:10px}.canvas{background:#272727;border:1px solid #77736d;border-radius:14px;padding:10px;overflow-x:auto}.sourceWrap{text-align:center}.sourceNode{display:inline-block;width:min(500px,82%);background:#052417;color:#fff;border:2px solid #296b52;border-radius:12px;padding:10px}.sourceNode .code{font-size:8px;font-weight:900;color:#c7ab6d}.sourceNode h3{margin:2px 0;font-size:14px;line-height:1.05}.sourceNode p{margin:0;font-size:8px;color:#d8e6df}.trunk{height:14px;width:3px;background:var(--line);margin:0 auto}.branches{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;padding-top:14px}.branches:before{content:"";position:absolute;top:0;left:5%;right:5%;height:3px;background:var(--line)}.branch{min-width:0;display:flex;flex-direction:column;align-items:stretch}.branch>.vline:first-child{margin-top:-14px;height:14px}.node{display:block;width:100%;min-width:0;background:#5a5853;border:1px solid #77736d;border-radius:11px;padding:8px 9px;text-align:left;text-decoration:none;color:#fff;cursor:pointer;box-shadow:0 4px 10px #0003}.node .code{font-size:8px;font-weight:900;color:#c8b37d;line-height:1}.node h3{margin:3px 0;font-size:12px;line-height:1.05;color:#d7f2e7}.node p{margin:0;color:#d0ccc6;font-size:8px;line-height:1.2}.pill{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:999px;background:#132d24;color:#d5eee4;font-size:8px;font-weight:900}.vline{height:12px;width:3px;background:var(--line);margin:0 auto}.childWrap{display:flex;flex-direction:column}.childWrap>.node{margin:0}.childBranches{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;padding-top:12px}.childBranches:before{content:"";position:absolute;top:0;left:8%;right:8%;height:2px;background:var(--line)}.childBranch{position:relative}.childBranch:before{content:"";position:absolute;top:-12px;left:50%;height:12px;width:2px;background:var(--line)}.unmapped{margin-top:14px}.unmapped h3{color:#d5eee4;font-size:10px;margin:0 0 7px}.unmappedGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px}.unmapped .node{border-style:dashed;opacity:.82}.status{padding:12px;border:1px solid #d8d3ca;background:#fff;border-radius:11px;color:var(--muted);font-size:10px}.empty{color:#ccc;padding:18px;text-align:center;font-size:10px}@media(max-width:560px){.page{padding:7px}.branches{grid-template-columns:1fr 1fr;gap:7px}.childBranches{grid-template-columns:1fr 1fr}.node{padding:7px}.node h3{font-size:10px}.node p,.node .code,.pill{font-size:7px}.sourceNode h3{font-size:12px}}@media(max-width:390px){.branches{grid-template-columns:1fr 1fr}.childBranches{grid-template-columns:1fr}.top a{padding:8px;font-size:9px}}

<header class="top"><div class="brand"><div class="bolt">⚡</div><div><h1 id="pageTitle">Electrical</h1><small>Interactive distribution schematic</small></div></div><a href="/electrical-map.html">← Locations</a></header>
<main class="page"><section class="intro"><h2>Electrical distribution</h2><p>Tap a board, dimmer or control panel for its circuit schedule.</p></section><div id="status" class="status">Loading electrical distribution…</div><section id="canvas" class="canvas" hidden></section></main>
<script>(async()=>{'use strict';const cfg=window.LIMEWOOD_CONFIG||{};const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const q=new URLSearchParams(location.search),requested=q.get('building')||'Main House',status=document.getElementById('status'),canvas=document.getElementById('canvas'),pageTitle=document.getElementById('pageTitle');const [br,pr]=await Promise.all([sb.from('buildings').select('id,name').order('name'),sb.from('plant_rooms').select('id,name,building_id')]);if(br.error||pr.error){status.textContent='Could not load building directory.';return}const buildings=br.data||[],rooms=pr.data||[],building=buildings.find(b=>b.name===requested)||buildings.find(b=>b.name==='Main House')||buildings[0];if(!building){status.textContent='No buildings found.';return}pageTitle.textContent=building.name+' Electrical';const roomNames=rooms.filter(r=>String(r.building_id)===String(building.id)).map(r=>r.name);if(!roomNames.length){status.textContent='No registered electrical locations for this building yet.';return}const [ar,cr]=await Promise.all([sb.from('electrical_assets').select('asset_code,asset_name,plant_room,category,system_duty,distribution_board,upstream_supply,voltage,verification_status').in('plant_room',roomNames).order('asset_code'),sb.from('electrical_circuits').select('board_asset_code,circuit_number')]);if(ar.error){status.textContent='Could not load electrical assets.';return}const all=ar.data||[],circuits=cr.error?[]:(cr.data||[]);const isStructure=a=>/incomer|incoming|intake|meter|main switch|switchboard|mcp|motor control|control panel|distribution board|\bdb\b|dimmer|feeder|panel/i.test((a.category||'')+' '+(a.asset_name||'')+' '+(a.system_duty||''));const assets=all.filter(isStructure);if(!assets.length){status.textContent='No distribution equipment mapped for this building yet.';return}const refMatches=(ref,a)=>{const r=norm(ref);if(!r)return false;return [a.asset_code,a.asset_name].filter(Boolean).some(v=>{const n=norm(v);return n&&(r===n||r.includes(n)||n.includes(r))})};const kidsOf=p=>assets.filter(a=>a!==p&&(refMatches(a.upstream_supply,p)||refMatches(a.distribution_board,p)));const hasParent=a=>assets.some(p=>p!==a&&(refMatches(a.upstream_supply,p)||refMatches(a.distribution_board,p)));const rank=a=>{const t=norm((a.category||'')+' '+(a.asset_name||''));if(/incoming|incomer|intake|meter/.test(t))return 0;if(/main switch|switchboard|feeder/.test(t))return 1;if(/mcp|motor control|control panel/.test(t))return 2;if(/distribution board|\bdb\b/.test(t))return 3;if(/dimmer/.test(t))return 4;return 5};const countCircuits=a=>{const keys=[a.asset_code,a.asset_name].filter(Boolean).map(norm);return circuits.filter(c=>keys.includes(norm(c.board_asset_code))).length};const clickable=a=>/switchboard|mcp|motor control|control panel|distribution board|\bdb\b|dimmer|panel/i.test((a.category||'')+' '+(a.asset_name||''));function card(a){const count=countCircuits(a),click=clickable(a)&&a.asset_code;const pill=count?count+' circuit'+(count===1?'':'s'):(String(a.verification_status||'').toLowerCase().includes('verified')?'Verified':'Open');return `<${click?'a':'div'} class="node"${click?` href="/electrical-board-circuits.html?board=${encodeURIComponent(a.asset_code)}"`:''}><div class="code">${esc(a.asset_code||'')}</div><h3>${esc(a.asset_name||'Electrical asset')}</h3><p>${esc(a.plant_room||'Location not recorded')}</p><span class="pill">${esc(pill)}</span></${click?'a':'div'}>`}const seen=new Set();function renderBranch(a,depth=0){const key=a.asset_code||a.asset_name;if(depth>8||seen.has(key))return card(a);seen.add(key);const kids=kidsOf(a).sort((x,y)=>rank(x)-rank(y)||String(x.asset_name||'').localeCompare(String(y.asset_name||'')));return `<div class="childWrap">${card(a)}${kids.length?`<div class="vline"></div><div class="childBranches">${kids.map(k=>`<div class="childBranch">${renderBranch(k,depth+1)}</div>`).join('')}</div>`:''}</div>`}let roots=assets.filter(a=>!hasParent(a)).sort((x,y)=>rank(x)-rank(y)||String(x.asset_name||'').localeCompare(String(y.asset_name||'')));const actualIncoming=roots.filter(a=>rank(a)===0);const topRoots=actualIncoming.length?actualIncoming:roots;seen.clear();let html=`<div class="sourceWrap"><div class="sourceNode"><div class="code">${esc(building.name.toUpperCase())}</div><h3>Mains incoming</h3><p>Incoming electrical distribution</p></div></div><div class="trunk"></div>`;html+=topRoots.length?`<div class="branches">${topRoots.map(r=>`<div class="branch"><div class="vline"></div>${renderBranch(r)}</div>`).join('')}</div>`:'<div class="empty">No mapped top-level distribution equipment yet.</div>';const leftovers=assets.filter(a=>!seen.has(a.asset_code||a.asset_name));if(leftovers.length)html+=`<div class="unmapped"><h3>Not yet connected</h3><div class="unmappedGrid">${leftovers.map(card).join('')}</div></div>`;canvas.innerHTML=html;status.hidden=true;canvas.hidden=false})();</script></body></html>
